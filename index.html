<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="入卷">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090807">
  <title>入卷 - AI 互动小说</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script>if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js');</script>
  <script src="common.js?v=17"></script>
  <style>
    /* ── Page Layout ─────────────────────────────── */
    body {
      overflow-y: auto;
      overflow-x: hidden;
    }

    .page-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 100px;
    }

    /* ── Header Bar ──────────────────────────────── */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: var(--z-chrome);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: calc(14px + env(safe-area-inset-top, var(--sat, 0px))) 20px 14px;
      background: linear-gradient(180deg, rgba(15,12,8,0.9) 0%, rgba(15,12,8,0.6) 60%, transparent 100%);
      pointer-events: none;
    }

    .header-bar > * {
      pointer-events: auto;
    }

    /* ── v2.5 顶部毛玻璃 ──────────────────────────────
       原顶栏是纯渐变遮罩，滚动时下方文字会从半透明区透出来。
       补一层 backdrop-filter 让它真正"糊"住内容，再压一道金色发丝线
       收边——这是方案里 .home-header-blur 的语言。
       定位/尺寸仍由 .header-bar 负责，这里只叠视觉。 */
    .header-bar.home-header-blur {
      background: linear-gradient(180deg, var(--overlay-scrim-heavy) 80%, transparent);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--gold-border-subtle);
    }

    .btn-settings {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 14px;
      color: var(--text-secondary);
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
    }

    .btn-settings:hover {
      color: var(--accent);
      border-color: var(--border-strong);
      background: var(--bg-glass-light);
    }

    /* ── Hero / Mini-Banner ──────────────────────────
       v2.5 重构：原先 72px 巨型标题 + 80px 上留白把首屏几乎占满，
       故事列表要滚动才看得到。改为紧凑古典横幅：标题降到 40px，
       首屏就能直接触达故事列表，同时用卷轴边框保留仪式感。 */
    .hero {
      text-align: center;
      padding: 52px 0 24px;
      position: relative;
      width: 100%;
      max-width: 700px;
    }

    /* 卷轴式边框：四角金线 + 顶部一道渐隐金线 */
    .hero-banner {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 40px 18px;
    }
    .hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      border-image: linear-gradient(150deg, rgba(214,178,95,0.35), rgba(214,178,95,0.05) 40%, rgba(214,178,95,0.05) 60%, rgba(214,178,95,0.28)) 1;
      pointer-events: none;
    }

    .hero-ornament {
      display: block;
      margin: 0 auto 12px;
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--text-primary);
      line-height: 1.1;
      position: relative;
      display: inline-block;
      text-indent: 8px;
      text-shadow:
        0 0 28px rgba(214, 178, 95, 0.28),
        0 0 60px rgba(214, 178, 95, 0.1);
    }

    .hero-title::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    }

    .hero-subtitle {
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      font-weight: 400;
      letter-spacing: 5px;
      color: var(--text-muted);
      margin-top: 12px;
      text-indent: 5px;
      text-transform: uppercase;
    }

    .hero-tagline {
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0.62;
      font-style: italic;
    }

    /* Decorative corner flourishes on hero */
    .hero-flourish {
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: var(--border-strong);
      border-style: solid;
      opacity: 0.4;
      pointer-events: none;
    }
    .hero-flourish.tl { top: 20px; left: -10px; border-width: 1px 0 0 1px; }
    .hero-flourish.tr { top: 20px; right: -10px; border-width: 1px 1px 0 0; }
    .hero-flourish.bl { bottom: 6px; left: -10px; border-width: 0 0 1px 1px; }
    .hero-flourish.br { bottom: 6px; right: -10px; border-width: 0 1px 1px 0; }

    /* ── Main Content Area ───────────────────────── */
    .main-content {
      width: 100%;
      max-width: 700px;
    }

    /* ── Toolbar ─────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
    }

    .toolbar-label {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 1px;
    }

    .toolbar-count {
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 8px;
    }

    /* ── Conversation Cards ──────────────────────── */
    .conv-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── 故事线分组（主体 → 副本）树状图谱 ───────────
       v2.5 重构：原先只靠 margin-left 缩进表达层级，视觉上像"缩进的列表"，
       层级断裂感强。改为显式树状结构：母节点 + 虚线分支锚点 + 副本节点。 */
    .conv-group {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, rgba(36, 31, 23, 0.55), rgba(22, 18, 12, 0.5));
      padding: 14px 14px 12px;
      position: relative;
      transition: border-color var(--transition-smooth);
    }
    /* 主体左侧金线：标识"这是一条故事线的根" */
    .conv-group::before {
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 2px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--gold-primary), rgba(214,178,95,0.15));
    }
    .conv-group-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .conv-group-title {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conv-group-count {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      font-weight: 400;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 1px 8px;
      flex-shrink: 0;
    }
    .conv-group-actions { display: flex; gap: 6px; flex-shrink: 0; }
    /* 分组头部按钮：与对话卡片按钮同样的悬停/危险态反馈。
       （.conv-card-actions 那套样式作用域不含这里，不补的话删除键没有红色提示） */
    .conv-group-actions .btn-icon {
      width: 30px;
      height: 30px;
    }
    .conv-group-actions .btn-icon:hover {
      color: var(--accent);
      background: var(--accent-dim);
    }
    .conv-group-actions .btn-icon.btn-danger:hover {
      color: var(--danger);
      background: var(--cinnabar-dim);
    }
    .conv-group-actions .btn-icon .icon svg {
      width: 15px;
      height: 15px;
    }
    .conv-group-meta {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin: 5px 0 12px 23px;
    }
    /* 副本区域：竖向主干 + 每条副本的横向虚线分支，构成树状图谱 */
    .conv-group-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-left: 8px;
      padding-left: 20px;
      position: relative;
    }
    /* 竖向主干线 */
    .conv-group-body::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 0;
      bottom: 14px;
      width: 1px;
      background: repeating-linear-gradient(180deg, var(--border-strong) 0 4px, transparent 4px 8px);
    }
    /* 横向分支：从主干虚线引到副本节点，末端一个金点作为节点标记。
       用一层元素同时画出"虚线 + 圆点"，避免和 .conv-card::before（悬停金线）抢伪元素。 */
    .conv-group-body > .conv-card::after {
      content: '';
      position: absolute;
      left: -17px;
      top: 30px;
      width: 17px;
      height: 5px;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 3.5px 2.5px, var(--accent) 0 2.4px, transparent 2.5px),
        linear-gradient(90deg, transparent 0 6px, var(--border-strong) 6px 17px, transparent 17px);
      background-repeat: no-repeat;
    }
    .conv-group-label {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      margin: 2px 0 8px 2px;
    }
    .conv-card-nested {
      background: rgba(46, 39, 30, 0.5);
      padding: 14px 18px;
    }

    /* ── v2.5 首屏统计横幅 ──────────────────────────
       「卷数 / 字数 / 分支线」这类信息原本要翻完列表才知道，
       提到首屏后第一眼就能读出自己写了多少东西。 */
    .home-hero-banner {
      position: relative;
      margin: 14px 0 18px;
      padding: 22px 18px;
      background: linear-gradient(135deg, rgba(36, 31, 23, 0.75), rgba(26, 22, 16, 0.95));
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    /* 右上角一团金色浮光，避免大色块显得死板 */
    .home-hero-banner::after {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .banner-quote {
      position: relative;
      font-family: var(--font-serif);
      font-size: var(--fs-lg);
      font-style: italic;
      color: var(--gold-bright);
      line-height: 1.5;
      margin: 0 0 6px;
    }
    .banner-sub {
      position: relative;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }

    /* ── v2.5 故事线集群 / 树状分支 / 紧凑卡 ──────────
       新类与既有的 .conv-group / .conv-group-body / .conv-card-nested
       挂在同一元素上并存：新类负责视觉，旧类承载既有 JS 与入场动画。 */
    .conv-group.storyline-cluster {
      background: rgba(36, 31, 23, 0.4);
      border: 1px solid var(--gold-border-subtle);
      border-left: 3px solid var(--gold-primary);
      border-radius: var(--radius-md);
      padding: 14px;
    }
    /* 方案用 3px 实心左边框标根节点，与 .conv-group::before 的 2px 金线重复，
       这里关掉伪元素，避免同一条边上叠出两条线。 */
    .conv-group.storyline-cluster::before {
      display: none;
    }
    .storyline-cluster-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .storyline-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: var(--fs-lg);
      font-weight: 700;
      color: var(--gold-bright);
    }
    /* 分支容器：主干与横向节点由既有 .conv-group-body::before /
       > .conv-card::after 负责绘制，这里只补 flex 排布，避免两条树干打架。 */
    .storyline-tree-branch {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* 用双类名压过后面定义的 .conv-card（同特异性靠顺序会输），
       只覆盖背景/边框/圆角/内距，保留 .conv-card 的入场动画与悬停金线。 */
    .conv-card.story-card-compact {
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      padding: 12px;
      cursor: pointer;
    }
    .conv-card.story-card-compact:hover {
      border-color: var(--gold-border);
      background: var(--bg-elevated);
      transform: translateX(3px);
    }

    .storyline-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      font-size: var(--fs-xs);
      color: var(--gold-bright);
      background: var(--gold-dim);
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-full);
      padding: 1px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .conv-card {
      background: linear-gradient(160deg, rgba(36, 31, 23, 0.92), rgba(22, 18, 12, 0.9));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      cursor: pointer;
      transition: border-color var(--transition-smooth), transform var(--transition-smooth), box-shadow var(--transition-smooth);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
    }

    .conv-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 卡片顶部一道渐隐金线：悬停时点亮，作为"当前可进入"的提示 */
    .conv-card::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      opacity: 0;
      transition: opacity var(--transition-smooth);
      pointer-events: none;
    }
    .conv-card:hover::before { opacity: 0.8; }

    .conv-card:hover {
      border-color: var(--gold-border);
      transform: translateY(-2px);
      box-shadow: var(--shadow-floating);
    }

    .conv-card:active {
      transform: translateY(0) scale(0.995);
    }

    .conv-card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .conv-card-icon {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-dim);
      border-radius: var(--radius);
      color: var(--accent);
      border: 1px solid var(--gold-border-subtle);
    }

    .conv-card-icon .icon svg {
      width: 18px;
      height: 18px;
    }

    .conv-card-info {
      flex: 1;
      min-width: 0;
    }

    .conv-card-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      min-width: 0;
    }
    /* 名字文本自身省略，避免 flex 下 badge 被挤走 */
    .conv-card-name > .name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .conv-card-nested .conv-card-name { font-size: var(--fs-xl); }

    .conv-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .conv-card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .conv-card:hover .conv-card-actions {
      opacity: 1;
    }

    .conv-card-actions .btn-icon {
      width: 32px;
      height: 32px;
    }

    .conv-card-actions .btn-icon:hover {
      color: var(--accent);
      background: var(--accent-dim);
    }

    .conv-card-actions .btn-icon.btn-danger:hover {
      color: var(--danger);
      background: rgba(201, 106, 90, 0.12);
    }

    .conv-card-actions .btn-icon .icon svg {
      width: 15px;
      height: 15px;
    }

    /* Phase badge */
    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: var(--fs-xs);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .phase-badge.phase-init {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--gold-border);
    }

    .phase-badge.phase-rp {
      background: var(--jade-dim);
      color: var(--success);
      border: 1px solid rgba(120, 192, 145, 0.28);
    }

    /* 副本卷次标记：树状结构下给每个副本一个明确的序号锚点 */
    .vol-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 18px;
      padding: 0 5px;
      border-radius: var(--radius-sm);
      background: var(--accent-dim);
      border: 1px solid var(--gold-border-subtle);
      color: var(--accent);
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      font-weight: 600;
      flex-shrink: 0;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Inline Rename Input ─────────────────────── */
    .conv-card-rename {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 600;
      background: var(--bg-surface);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 2px 8px;
      color: var(--text-primary);
      width: 100%;
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    /* ── Empty State ── 样式收口到 common.js（与聊天页空态同构），此处不再重复定义 ── */

    /* ── Footer area (import/export) ─────────────── */
    .footer-actions {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.6s forwards;
    }

    .footer-actions .btn-ghost {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      gap: 5px;
    }

    .footer-actions .btn-ghost .icon svg {
      width: 14px;
      height: 14px;
    }

    /* ── 悬浮创作岛（原 FAB 重构）─────────────────────
       v2.5 重构：原先孤立的圆形悬浮球在暗金主题里像一块贴上去的塑料。
       改为吸附式胶囊控制器：主按钮 + 展开的次级动作，带金色描边与浮光。 */
    .creation-island {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: var(--z-chrome);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .creation-island > * { pointer-events: auto; }

    .fab {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(214, 178, 95, 0.35);
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      color: var(--ink-on-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        0 8px 28px rgba(214, 178, 95, 0.34),
        0 0 0 1px rgba(214, 178, 95, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), filter var(--transition-smooth);
    }

    .fab:hover {
      transform: translateY(-3px) scale(1.05);
      filter: brightness(1.06);
      box-shadow:
        0 12px 36px rgba(214, 178, 95, 0.48),
        0 0 0 1px rgba(214, 178, 95, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .fab:active {
      transform: translateY(-1px) scale(0.99);
    }

    .fab .icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.5;
    }

    /* FAB tooltip */
    .fab-tooltip {
      position: absolute;
      right: calc(100% + 12px);
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      color: var(--text-secondary);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: var(--shadow-ambient);
    }

    .fab:hover .fab-tooltip {
      opacity: 1;
    }

    /* 次级动作：v2.5 由「带文字胶囊」改为 34×34 玻璃方钮。
       尺寸/配色取自方案 .glass-btn-icon；展开动画（opacity +
       translateX）与 .creation-island.open/:hover 的联动保持不变。 */
    .island-action {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border-subtle);
      color: var(--text-regular);
      font-family: var(--font-ui);
      cursor: pointer;
      box-shadow: var(--shadow-ambient);
      opacity: 0;
      transform: translateX(12px) scale(0.94);
      pointer-events: none;
      transition: opacity var(--transition-smooth), transform var(--transition-smooth), border-color var(--transition-smooth), color var(--transition-smooth), background var(--transition-smooth);
    }
    /* 方钮容不下文字，标签仅在无障碍读屏里保留 */
    .island-action .island-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .island-action .icon svg { width: 15px; height: 15px; }
    .island-action:hover {
      color: var(--gold-bright);
      border-color: var(--gold-border);
      background: var(--bg-elevated);
    }
    .creation-island.open .island-action,
    .creation-island:hover .island-action,
    .creation-island:focus-within .island-action {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }
    .creation-island.open .island-action:nth-child(1) { transition-delay: 0.04s; }
    .creation-island.open .island-action:nth-child(2) { transition-delay: 0.02s; }

    /* ── 悬浮灵动创作岛（v2.5）─────────────────────────
       由右下角孤球改为底部居中的玻璃胶囊坞：次级图标钮 + 金色主行动钮。
       与 .creation-island 共用同一 DOM，仅追加定位与容器皮肤；
       展开/收起仍由 .creation-island.open/:hover/:focus-within 驱动。 */
    .floating-creation-island {
      position: fixed;
      bottom: 24px;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      width: calc(100% - 44px);
      max-width: 360px;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(26, 22, 16, 0.94);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-floating), var(--shadow-gold-glow);
      z-index: var(--z-fab);
    }

    /* 胶囊坞形态下次级动作常驻可见（不再靠悬停弹出），
       故覆盖 .island-action 的初始隐藏态；.open 联动保留但已无视觉差异。 */
    .floating-creation-island .island-action {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    /* 主行动钮：胶囊化，承接方案 .fab-prime-btn 的金色渐变 */
    .fab.fab-prime-btn {
      flex: 1;
      width: auto;
      height: auto;
      min-height: 40px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      color: var(--ink-on-gold);
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26), 0 4px 14px rgba(214, 178, 95, 0.28);
    }
    .fab.fab-prime-btn .icon svg { width: 18px; height: 18px; stroke-width: 2.5; }
    .fab.fab-prime-btn .fab-prime-label {
      line-height: 1;
    }
    /* 主按钮已带可见文字，气泡提示在胶囊坞里反而会溢出视口 */
    .fab.fab-prime-btn .fab-tooltip { display: none; }

    /* ── Create Modal Specifics ───────────────────── */
    .create-form label {
      font-size: var(--fs-base);
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
    }

    .model-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .model-input-row input {
      flex: 1;
    }

    .model-input-row .btn {
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ── Hidden file input ───────────────────────── */
    #import-file-input {
      display: none;
    }

    /* ── Responsive ──────────────────────────────── */
    @media (max-width: 600px) {
      .page-container {
        padding: 0 14px 100px;
      }

      .hero {
        padding: 44px 0 18px;
      }

      .hero-banner {
        padding: 16px 24px 14px;
      }

      .hero-title {
        font-size: var(--fs-3xl);
        letter-spacing: 6px;
        text-indent: 6px;
      }

      .hero-subtitle {
        font-size: var(--fs-xs);
        letter-spacing: 3px;
      }

      .hero-tagline { font-size: var(--fs-sm); }

      .hero-flourish {
        display: none;
      }

      .conv-card {
        padding: 14px 16px;
      }

      .conv-card-name {
        font-size: var(--fs-xl);
      }

      .conv-card-icon {
        width: 34px;
        height: 34px;
      }

      .conv-card-actions {
        opacity: 1;
      }

      /* 移动端把树状分支收窄，避免内容区被挤压 */
      .conv-group-body { padding-left: 14px; margin-left: 4px; }
      .conv-group-body > .conv-card::after { left: -12px; width: 12px; }

      /* 移动端：胶囊坞贴底居中，次级钮与主钮同排，不再向上弹出 */
      .floating-creation-island {
        bottom: 16px;
        width: calc(100% - 32px);
        max-width: none;
        padding: 5px 8px;
        gap: 6px;
      }

      .fab.fab-prime-btn {
        min-height: 38px;
        padding: 9px 14px;
        font-size: var(--fs-sm);
      }

      .island-action {
        width: 32px;
        height: 32px;
      }

      .fab-tooltip {
        display: none;
      }

      .header-bar {
        padding: 10px 14px;
      }

      .toolbar-label {
        font-size: var(--fs-lg);
      }
    }

    /* ── Header icon buttons ──────────────────── */
    .header-bar { gap: 8px; }
    /* v2.5：顶栏方钮即方案里的 .glass-btn-icon——金调发丝边 + 悬停转亮金。
       两个类名共用同一份声明：.btn-header-icon 是既有语义名（HTML 在用），
       .glass-btn-icon 是方案名，留给后续新增按钮直接套用。 */
    .btn-header-icon,
    .glass-btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
      background: var(--bg-surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gold-border-subtle); border-radius: 10px;
      color: var(--text-regular); cursor: pointer;
      transition: all var(--transition-smooth);
    }
    .btn-header-icon:hover,
    .glass-btn-icon:hover { color: var(--gold-bright); border-color: var(--gold-border); background: var(--bg-elevated); }

    /* ── Guide overlay ────────────────────────── */
    .guide-overlay {
      position: fixed; inset: 0; z-index: var(--z-modal);
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .guide-overlay.visible { opacity: 1; }
    .guide-box {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); max-width: 480px; width: 90%;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .guide-header { padding: 20px 24px 12px; text-align: center; }
    .guide-header h2 { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 700; color: var(--accent); letter-spacing: 3px; margin-bottom: 4px; }
    .guide-header p { font-size: var(--fs-sm); color: var(--text-muted); letter-spacing: 1px; }
    .guide-body { padding: 8px 24px 20px; }
    .guide-step { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .guide-step:last-child { border-bottom: none; }
    .guide-num {
      flex-shrink: 0; width: 24px; height: 24px; margin-top: 1px;
      border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--accent);
      color: var(--accent); font-size: var(--fs-sm); font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .guide-text { font-size: var(--fs-base); line-height: 1.7; color: var(--text-secondary); }
    .guide-text strong { color: var(--text-primary); font-weight: 600; }
    .guide-text .guide-example {
      display: block; margin-top: 6px; padding: 6px 10px;
      background: var(--bg-elevated); border-radius: var(--radius);
      color: var(--text-muted); font-size: var(--fs-sm); font-style: italic;
    }
    .guide-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: center; }

    /* ── Settings panel ───────────────────────── */
    .settings-field { margin-bottom: 16px; }
    .settings-field label { margin-bottom: 6px; }
    .settings-field input[type="number"] { width: 80px; text-align: center; }
    .settings-field .field-hint { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 4px; }
    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .chip-group .chip {
      padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text-secondary); font-size: var(--fs-base);
      cursor: pointer; transition: all var(--transition); user-select: none;
    }
    .chip-group .chip:hover { border-color: var(--accent); color: var(--text-primary); }
    .chip-group .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .chip-group .chip-custom { display: flex; align-items: center; gap: 4px; }
    .chip-group .chip-custom input {
      width: 50px; padding: 2px 4px; text-align: center; font-size: var(--fs-base);
      background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text-primary);
    }
    .chip-group .chip-custom input:focus { border-color: var(--accent); outline: none; }
    .settings-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .settings-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .settings-actions .btn { flex: 1; min-width: 120px; justify-content: center; }
  </style>
</head>
<body>

<!-- ── Guide Overlay ──────────────────────────── -->
<div class="guide-overlay" id="guideOverlay">
  <div class="guide-box">
    <div class="guide-header">
      <h2>入卷指南</h2>
      <p>AI 互动小说</p>
    </div>
    <div class="guide-body">
      <div class="guide-step">
        <span class="guide-num">1</span>
        <div class="guide-text">
          <strong>新建故事</strong>后，先和 AI 聊聊你想要的世界。可以详细描述，也可以一句话概括，AI 会帮你完善。
          <span class="guide-example">"帮我做一个修仙流、废柴逆袭的世界观，第三人称视角"</span>
        </div>
      </div>
      <div class="guide-step">
        <span class="guide-num">2</span>
        <div class="guide-text">
          讨论完毕后，AI 会花约 <strong>1-2 分钟</strong>生成世界观和状态栏。在右侧预览，满意后点击<strong>「确认」</strong>即可开始游玩。
        </div>
      </div>
      <div class="guide-step">
        <span class="guide-num">3</span>
        <div class="guide-text">
          游玩中，AI 每轮会输出故事、更新状态栏，并给出 <strong>4 个选项</strong>。请等选项全部出现后再操作。点击右上角可随时查看状态栏。
        </div>
      </div>
    </div>
    <div class="guide-footer">
      <button class="btn btn-primary" onclick="closeGuide()" style="min-width:140px">知道了</button>
    </div>
  </div>
</div>

<!-- ── Fixed Header Bar ─────────────────────── -->
<div class="header-bar home-header-blur">
  <button class="btn-header-icon" onclick="showGuide()" title="使用指南" id="btn-guide">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </button>
  <button class="btn-header-icon" onclick="openSettings()" title="设置" id="btn-settings-pub" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <a class="btn-settings" href="settings.html?v=13" id="btn-settings">
    <span class="icon" style="width:16px;height:16px;"></span>
    设置
  </a>
</div>

<!-- ── Page Container ───────────────────────── -->
<div class="page-container">

  <!-- ── Hero Banner（紧凑古典横幅）────────────── -->
  <header class="hero">
    <div class="hero-flourish tl"></div>
    <div class="hero-flourish tr"></div>
    <div class="hero-flourish bl"></div>
    <div class="hero-flourish br"></div>
    <div class="hero-banner">
        <div class="pill-item">✦ 传世画卷 · 沉浸演绎 ✦</div>
      <span class="hero-ornament"></span>
      <h1 class="hero-title">入卷</h1>
      <p class="hero-subtitle">AI 互动小说</p>
      <p class="hero-tagline">在文字与想象之间，书写属于你的故事</p>
    </div>
  </header>

  <!-- ── Main Content ─────────────────────────── -->
  <main class="main-content">

    <!-- 首屏统计横幅：一眼读出自己写了多少（无故事时隐藏） -->
    <div class="home-hero-banner" id="home-banner" style="display:none;">
      <p class="banner-quote" id="banner-quote">笔墨未干，故事正长</p>
      <p class="banner-sub" id="banner-sub"></p>
    </div>

    <!-- Toolbar (shown when conversations exist) -->
    <div class="toolbar" id="toolbar" style="display:none;">
      <div class="toolbar-label">
        我的故事 <span class="toolbar-count" id="toolbar-count"></span>
      </div>
    </div>

    <!-- Conversation List -->
    <div class="conv-list" id="conv-list">
      <!-- Cards rendered by JS -->
    </div>

    <!-- Footer: Import/Export -->
    <div class="footer-actions" id="footer-actions" style="display:none;">
      <button class="btn btn-ghost" onclick="exportAllData()" title="导出所有数据" id="btn-export">
        导出数据
      </button>
      <button class="btn btn-ghost" onclick="triggerImport()" title="导入数据" id="btn-import">
        导入数据
      </button>
    </div>
    <input type="file" id="import-file-input" accept=".json" onchange="importData(event)">

  </main>
</div>

<!-- ── 悬浮灵动创作岛：次级图标钮 + 金色主行动钮 ─────────── -->
<div class="creation-island floating-creation-island" id="creationIsland">
  <button class="island-action" onclick="triggerImport()" title="导入数据">
    <span class="icon" id="island-import-icon" style="width:15px;height:15px;display:inline-flex;"></span>
    <span class="island-label">导入</span>
  </button>
  <button class="island-action" onclick="exportAllData()" title="导出所有数据">
    <span class="icon" id="island-export-icon" style="width:15px;height:15px;display:inline-flex;"></span>
    <span class="island-label">导出</span>
  </button>
  <button class="fab fab-prime-btn" id="fab-create" onclick="showCreateModal()" title="开始新故事">
    <span class="icon" style="width:18px;height:18px;display:inline-flex;"></span>
    <span class="fab-prime-label">开启新纪事</span>
  </button>
</div>

<script>
  // ── Inject Icons ──────────────────────────────
  (function injectStaticIcons() {
    document.querySelector('#btn-settings .icon').innerHTML = Icons.settings;
    document.querySelector('#fab-create > .icon').innerHTML = Icons.plus;

    const btnExport = document.getElementById('btn-export');
    const btnImport = document.getElementById('btn-import');
    btnExport.innerHTML = `${getIcon('download', 14)} 导出数据`;
    btnImport.innerHTML = `<span class="icon" style="width:14px;height:14px;display:inline-flex;transform:rotate(180deg);">${Icons.download}</span> 导入数据`;

    // 悬浮创作岛的次级动作图标
    const islandExport = document.getElementById('island-export-icon');
    const islandImport = document.getElementById('island-import-icon');
    if (islandExport) islandExport.innerHTML = Icons.download;
    if (islandImport) islandImport.innerHTML = `<span style="display:inline-flex;transform:rotate(180deg);width:15px;height:15px;">${Icons.download}</span>`;
  })();

  // ── 悬浮创作岛：悬停/点击展开次级动作 ──────────
  (function initCreationIsland() {
    const island = document.getElementById('creationIsland');
    if (!island) return;
    const fab = document.getElementById('fab-create');
    // 点击主按钮时先展开（若已展开则直接进入新建流程，由 onclick 处理）
    fab.addEventListener('click', () => island.classList.add('open'));
    document.addEventListener('click', (e) => {
      if (!island.contains(e.target)) island.classList.remove('open');
    });
  })();

  // ── Guide ──────────────────────────────────────
  function showGuide() {
    const el = document.getElementById('guideOverlay');
    el.style.display = 'flex';
    requestAnimationFrame(() => el.classList.add('visible'));
  }
  function closeGuide() {
    const el = document.getElementById('guideOverlay');
    el.classList.remove('visible');
    setTimeout(() => el.style.display = 'none', 300);
  }

  // ── Settings panel (public mode) ───────────────
  function openSettings() {
    const s = Storage.getSettings();
    const aw = s.articleWordCount || 500;
    const sw = s.summaryWordCount || 50;
    const articleOpts = [300, 500, 700, 1000];
    const summaryOpts = [50, 100, 150];
    const awIsCustom = !articleOpts.includes(aw);
    const swIsCustom = !summaryOpts.includes(sw);

    UI.showModal({
      title: '设置',
      content: `
        <div class="settings-field">
          <label>每轮回复字数</label>
          <div class="chip-group" id="chip-article">
            ${articleOpts.map(v => `<span class="chip${v === aw && !awIsCustom ? ' active' : ''}" data-val="${v}" onclick="selectChip('article',${v})">${v}</span>`).join('')}
            <span class="chip chip-custom${awIsCustom ? ' active' : ''}" onclick="selectChipCustom('article')">
              自定义 <input type="number" id="set-article-custom" value="${awIsCustom ? aw : ''}" min="100" max="3000" onfocus="selectChipCustom('article')" onchange="selectChipCustom('article')">
            </span>
          </div>
        </div>
        <div class="settings-field">
          <label>摘要字数</label>
          <div class="chip-group" id="chip-summary">
            ${summaryOpts.map(v => `<span class="chip${v === sw && !swIsCustom ? ' active' : ''}" data-val="${v}" onclick="selectChip('summary',${v})">${v}</span>`).join('')}
            <span class="chip chip-custom${swIsCustom ? ' active' : ''}" onclick="selectChipCustom('summary')">
              自定义 <input type="number" id="set-summary-custom" value="${swIsCustom ? sw : ''}" min="10" max="500" onfocus="selectChipCustom('summary')" onchange="selectChipCustom('summary')">
            </span>
          </div>
        </div>
        <hr class="settings-divider">
        <div class="settings-actions">
          <button class="btn btn-secondary" onclick="exportAllData()">导出数据</button>
          <button class="btn btn-secondary" onclick="triggerImport()">导入数据</button>
        </div>`,
      buttons: [
        { text: '取消', class: 'btn-secondary', onclick: 'UI.closeModal()' },
        { text: '保存', class: 'btn-primary', onclick: 'savePublicSettings()' },
      ],
    });
  }

  function selectChip(group, val) {
    const container = document.getElementById('chip-' + group);
    container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    container.querySelector(`[data-val="${val}"]`).classList.add('active');
    const customInput = document.getElementById(`set-${group}-custom`);
    if (customInput) customInput.value = '';
  }

  function selectChipCustom(group) {
    const container = document.getElementById('chip-' + group);
    container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    container.querySelector('.chip-custom').classList.add('active');
    const customInput = document.getElementById(`set-${group}-custom`);
    if (customInput) customInput.focus();
  }

  function getChipValue(group, fallback) {
    const container = document.getElementById('chip-' + group);
    const active = container.querySelector('.chip.active');
    if (!active) return fallback;
    if (active.classList.contains('chip-custom')) {
      const v = parseInt(document.getElementById(`set-${group}-custom`).value);
      return v > 0 ? v : fallback;
    }
    return parseInt(active.dataset.val) || fallback;
  }

  function savePublicSettings() {
    const s = Storage.getSettings();
    s.articleWordCount = getChipValue('article', 500);
    s.summaryWordCount = getChipValue('summary', 50);
    Storage.saveSettings(s);
    UI.closeModal();
    UI.showToast('设置已保存', 'success');
  }

  // ── State ──────────────────────────────────────
  let conversations = [];

  // ── Init ───────────────────────────────────────
  async function init() {
    await Config.load();
    if (Config.isPublic()) {
      const token = Storage.getAuthToken();
      if (!token) { location.href = 'login.html'; return; }
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const me = await res.json();
        if (!me.ok) { Storage.clearAuthToken(); location.href = 'login.html'; return; }
      } catch { Storage.clearAuthToken(); location.href = 'login.html'; return; }
      // Hide full settings link, show simplified settings button
      document.getElementById('btn-settings').style.display = 'none';
      document.getElementById('btn-settings-pub').style.display = '';
      // Hide footer import/export (moved into settings panel)
      document.getElementById('btn-export').style.display = 'none';
      document.getElementById('btn-import').style.display = 'none';
      // 公网模式下数据导入导出移入设置面板，创作岛的这两个动作也一并隐藏
      document.querySelectorAll('#creationIsland .island-action').forEach(b => b.style.display = 'none');
    } else {
      // Local mode: hide guide and public settings buttons
      document.getElementById('btn-guide').style.display = 'none';
      document.getElementById('btn-settings-pub').style.display = 'none';
    }
    await Storage.syncFromServer();
    loadConversations();
  }

  // ── Load & Render Conversations ────────────────
  function loadConversations() {
    conversations = Storage.getConversationList();
    renderList();
  }

  function renderList() {
    const container = document.getElementById('conv-list');
    const toolbar = document.getElementById('toolbar');
    const footer = document.getElementById('footer-actions');

    renderHomeBanner();

    if (conversations.length === 0) {
      toolbar.style.display = 'none';
      footer.style.display = 'none';
      container.innerHTML = renderEmptyState();
      return;
    }

    toolbar.style.display = '';
    footer.style.display = '';
    document.getElementById('toolbar-count').textContent = `(${conversations.length})`;

    // 按故事线分组渲染：故事线是「主体」，线下的对话是「副本」，层级一眼可辨。
    const storylines = Storage.getStorylineList();
    const byStoryline = new Map();
    const orphans = [];
    for (const conv of conversations) {
      const sid = conv.storylineId;
      if (sid && Storage.getStoryline(sid)) {
        if (!byStoryline.has(sid)) byStoryline.set(sid, []);
        byStoryline.get(sid).push(conv);
      } else {
        orphans.push(conv); // 未归属 / 故事线已删除
      }
    }

    const groups = [];
    // 有线下对话的故事线，跟着对话一起排（按最新活动时间）
    for (const s of storylines) {
      const list = byStoryline.get(s.id);
      if (!list || list.length === 0) continue;
      const latest = Math.max(...list.map(c => c.updatedAt || 0));
      groups.push({ sortAt: latest, html: renderStorylineGroup(s, list) });
    }
    // 未归属的单独一组
    if (orphans.length > 0) {
      groups.push({
        sortAt: Math.max(...orphans.map(c => c.updatedAt || 0)),
        html: `<div class="conv-group-label orphan">未归属故事线</div>`
          + orphans.map(conv => renderCard(conv)).join(''),
      });
    }
    groups.sort((a, b) => b.sortAt - a.sortAt);

    container.innerHTML = groups.map(g => g.html).join('');

    // Staggered fade-in animation
    const cards = container.querySelectorAll('.conv-card');
    cards.forEach((card, i) => {
      setTimeout(() => {
        card.style.transition = `opacity 0.4s ease ${i * 0.06}s, transform 0.4s ease ${i * 0.06}s`;
        card.classList.add('visible');
      }, 30);
    });
  }

  /** 故事线分组：主体（故事线）→ 副本（线下对话） */
  function renderStorylineGroup(storyline, convs) {
    const hasTemplate = !!(storyline.template && (storyline.template.worldBook || storyline.template.storySetting));
    const head = `
      <div class="conv-group-head storyline-cluster-head">
        <div class="conv-group-title storyline-title">
          ${getIcon('book', 15)}
          <span>${Utils.escapeHtml(storyline.name || '未命名故事线')}</span>
          <span class="conv-group-count">${convs.length} 条支线</span>
        </div>
        <div class="conv-group-actions">
          <button class="btn-icon" onclick="newFromStoryline('${storyline.id}', event)" title="按这条线开新对话（新副本）">
            ${getIcon('plus', 15)}
          </button>
          <button class="btn-icon" onclick="refreshStorylineTemplate('${storyline.id}', event)" title="用当前对话重存开局模板">
            ${getIcon('refresh', 15)}
          </button>
          <button class="btn-icon" onclick="renameStoryline('${storyline.id}', event)" title="重命名故事线">
            ${getIcon('edit', 15)}
          </button>
          <button class="btn-icon btn-danger" onclick="removeStoryline('${storyline.id}', event)" title="删除故事线（线下对话保留）">
            ${getIcon('trash', 15)}
          </button>
        </div>
      </div>
      <div class="conv-group-meta">${hasTemplate ? '已存开局模板 · 新副本会继承设定与记忆' : '无开局模板'}</div>`;
    return `<div class="conv-group storyline-cluster">${head}<div class="conv-group-body storyline-tree-branch">${
      convs.map((conv, i) => renderCard(conv, { nested: true, index: i + 1 })).join('')
    }</div></div>`;
  }

  /** 首屏统计横幅：卷数 / 字数 / 分支线数，读不出内容时自动隐藏。 */
  function renderHomeBanner() {
    const banner = document.getElementById('home-banner');
    const sub = document.getElementById('banner-sub');
    if (!banner || !sub) return;
    if (conversations.length === 0) { banner.style.display = 'none'; return; }

    let chars = 0;
    for (const conv of conversations) {
      chars += Number(conv.charCount || 0);
      // 未落 charCount 的旧存档按消息长度粗估，避免统计恒为 0
      if (!conv.charCount) chars += Number(conv.msgCount || 0) * 120;
    }
    const wordCount = chars >= 10000 ? `${(chars / 10000).toFixed(1)} 万字` : `${chars} 字`;
    const branchCount = Storage.getStorylineList()
      .filter(s => conversations.some(c => c.storylineId === s.id)).length;

    sub.textContent = `${conversations.length} 卷连载纪事 · 共 ${wordCount}`
      + (branchCount > 0 ? ` · ${branchCount} 条故事线` : '');
    banner.style.display = '';
  }

  /**
   * 按故事线开一个新副本。
   * 语义：新建一个对话（副本），继承该线的开局模板；并自动把线上最新对话的
   * 记忆（合并摘要 + 往事纪要）带过来——这就是用户期望的"开新对话、存记忆"。
   */
  async function newFromStoryline(id, event) {
    if (event) event.stopPropagation();
    const storyline = Storage.getStoryline(id);
    if (!storyline) return;
    // 默认名 = 故事线名 + 序号，避免每一条都叫"新对话"分不清
    const siblings = Storyline.conversations(id);
    const conv = Storyline.buildConversation(storyline, { name: `${storyline.name || '故事'} · 第 ${siblings.length + 1} 卷` });

    // 继承记忆：取该线下最近更新的对话作为记忆来源
    if (siblings.length > 0) {
      try {
        const latest = await Storage.loadConversation(siblings[0].id);
        const src = latest?.summary;
        if (src && ((src.mergedSummaries || []).length || (src.archive || []).length)) {
          conv.summary = {
            ...(conv.summary || {}),
            mergedSummaries: JSON.parse(JSON.stringify(src.mergedSummaries || [])),
            archive: JSON.parse(JSON.stringify(src.archive || [])),
            lastMergedIdx: 0,
          };
          UI.showToast('已继承该故事线的记忆', 'success');
        }
      } catch (e) { log('newFromStoryline: memory inherit failed', e.message); }
    }

    Storage.saveConversation(conv);
    window.location.href = `chat.html?v=13&id=${conv.id}&new=true`;
  }

  async function refreshStorylineTemplate(id, event) {
    if (event) event.stopPropagation();
    const storyline = Storage.getStoryline(id);
    if (!storyline) return;
    const convs = Storyline.conversations(id);
    if (convs.length === 0) { UI.showToast('这条故事线下还没有对话', 'error'); return; }
    // 用最近更新的那个对话作为模板来源
    const latest = convs[0];
    const full = await Storage.loadConversation(latest.id);
    if (!full) { UI.showToast('读取对话失败', 'error'); return; }
    Storyline.refreshTemplate(id, full);
    UI.showToast(`已用「${full.name || '对话'}」刷新开局模板`, 'success');
  }

  function renameStoryline(id, event) {
    if (event) event.stopPropagation();
    const s = Storage.getStoryline(id);
    if (!s) return;
    const name = prompt('故事线名称:', s.name || '');
    if (name === null) return;
    Storyline.rename(id, name);
    renderList();
  }

  async function removeStoryline(id, event) {
    if (event) event.stopPropagation();
    const s = Storage.getStoryline(id);
    if (!s) return;
    UI.showConfirm({
      title: '删除故事线',
      message: `确定删除故事线「${Utils.escapeHtml(s.name || '')}」吗？<br>线下的对话<b>不会被删除</b>，只是解除归属。`,
      onConfirm: async () => { await Storyline.remove(id); UI.closeModal(); UI.showToast('已删除故事线', 'success'); loadConversations(); },
    });
  }

  /** 把某个对话加入 / 移出故事线 */
  function assignStoryline(convId, event) {
    if (event) event.stopPropagation();
    const storylines = Storage.getStorylineList();
    if (storylines.length === 0) {
      const name = prompt('还没有故事线，先创建一条（输入名称）:', '');
      if (!name) return;
      const conv = conversations.find(c => c.id === convId);
      Storyline.create({ name, conversation: conv ? { ...conv, id: convId } : null });
      UI.showToast('已创建故事线并加入', 'success');
      loadConversations();
      return;
    }
    const rows = storylines.map(s => `<button class="btn btn-secondary" style="width:100%;margin-bottom:6px;justify-content:center;"
        onclick="doAssignStoryline('${convId}','${s.id}')">${Utils.escapeHtml(s.name)}</button>`).join('');
    UI.showModal({
      title: '加入故事线',
      content: `${rows}
        <button class="btn btn-secondary" style="width:100%;margin-top:6px;justify-content:center;" onclick="doAssignStoryline('${convId}','')">移出故事线</button>`,
      buttons: [{ text: '关闭', class: 'btn-secondary', onclick: 'UI.closeModal()' }],
    });
  }

  async function doAssignStoryline(convId, storylineId) {
    const full = await Storage.loadConversation(convId);
    if (!full) { UI.showToast('读取对话失败', 'error'); return; }
    if (storylineId) full.storylineId = storylineId;
    else delete full.storylineId;
    Storage.saveConversation(full);
    UI.closeModal();
    UI.showToast(storylineId ? '已加入故事线' : '已移出故事线', 'success');
    loadConversations();
  }

  function renderCard(conv, { nested = false, index = null } = {}) {
    const phase = conv.phase || 'init';
    const phaseLabel = phase === 'rp' ? '进行中' : '初始化';
    const phaseClass = phase === 'rp' ? 'phase-rp' : 'phase-init';
    const msgCount = conv.msgCount !== undefined ? conv.msgCount : (conv.messages || []).filter(m => !m.hidden).length;
    const timeStr = conv.updatedAt ? Utils.formatRelative(conv.updatedAt) : '未知';
    const name = Utils.escapeHtml(conv.name || '未命名故事');
    // 分组渲染时归属已由分组标题表达，卡片内不再重复标签
    const storyline = (!nested && conv.storylineId) ? Storage.getStoryline(conv.storylineId) : null;
    const storylineTag = storyline
      ? `<span class="storyline-tag" title="所属故事线">${Utils.escapeHtml(storyline.name || '')}</span>`
      : '';
    // 树状图谱下给每个副本一个卷次序号，方便一眼分辨分支
    const volBadge = (nested && index !== null)
      ? `<span class="vol-index" title="第 ${index} 卷">${index}</span>`
      : '';

    return `
      <div class="conv-card${nested ? ' conv-card-nested story-card-compact' : ''}" data-id="${conv.id}" onclick="openConversation('${conv.id}', event)">
        <div class="conv-card-header">
          <div class="conv-card-icon">
            ${getIcon('book', 18)}
          </div>
          <div class="conv-card-info">
            <div class="conv-card-name" id="name-${conv.id}">${volBadge}<span class="name-text">${name}</span>${storylineTag}</div>
            <div class="conv-card-meta">
              <span class="phase-badge ${phaseClass}">${phaseLabel}</span>
              <span class="meta-dot"></span>
              <span>${msgCount} 条消息</span>
              <span class="meta-dot"></span>
              <span>${timeStr}</span>
            </div>
          </div>
          <div class="conv-card-actions">
            <button class="btn-icon" onclick="forkConversation('${conv.id}', event)" title="复制">
              ${getIcon('copy', 15)}
            </button>
            <button class="btn-icon" onclick="assignStoryline('${conv.id}', event)" title="加入故事线">
              ${getIcon('book', 15)}
            </button>
            <button class="btn-icon" onclick="exportConversation('${conv.id}', event)" title="导出">
              ${getIcon('download', 15)}
            </button>
            <button class="btn-icon" onclick="startRename('${conv.id}', event)" title="重命名">
              ${getIcon('edit', 15)}
            </button>
            <button class="btn-icon btn-danger" onclick="confirmDelete('${conv.id}', event)" title="删除">
              ${getIcon('trash', 15)}
            </button>
          </div>
        </div>
      </div>`;
  }

  function renderEmptyState() {
    return `
      <div class="empty-state">
        <div class="empty-quill">
          ${Icons.book}
        </div>
        <span class="empty-ornament"></span>
        <div class="empty-title">卷轴尚空，故事未启</div>
        <p class="empty-desc">
          每一段传奇都始于第一笔墨迹。<br>
          点击下方按钮开始创作，让AI与你共同书写独一无二的故事。
        </p>
        <button class="btn btn-primary empty-cta" onclick="showCreateModal()">
          ${getIcon('plus', 16)} 开始第一个故事
        </button>
      </div>`;
  }

  // ── Create New Story Modal ───────────────────
  // ── 起步面板（可选）：一开始就把框架定稳 ──
  function buildPanelFieldsHtml() {
    return Panel.FIELDS.map(f => `
      <div class="form-group" style="margin-top:10px;">
        <label>${f.label}</label>
        <textarea id="panel-${f.key}" rows="${f.rows}" placeholder="${Utils.escapeHtml(f.placeholder)}" style="width:100%;font-size: var(--fs-base);"></textarea>
      </div>`).join('');
  }

  function buildCreateFormHtml() {
    return `
      <div class="create-form">
        <div class="form-group">
          <label>故事名称</label>
          <input type="text" id="create-name" value="新的故事" placeholder="为你的故事起个名字" onfocus="this.select()">
        </div>
        <details style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px;">
          <summary style="cursor:pointer;font-size: var(--fs-base);color:var(--text-secondary);">起步面板（可选）· 一开始就把框架定稳</summary>
          <p style="font-size: var(--fs-sm);color:var(--text-muted);margin:10px 0;line-height:1.6;">
            留空则由 AI 在初始化阶段自行发挥。<br>
            世界观 / 角色 / 开场 / 规则 会进入「故事设定」（稳定内容，可被前缀缓存）；
            <b>文风</b>会以 @Depth 注入到最贴近「当下」的位置。
          </p>
          <div style="display:flex;gap:8px;margin-bottom:4px;align-items:stretch;">
            <textarea id="panel-ai-input" rows="2" placeholder="也可以先用一句话描述你想要的故事，再点右侧让 AI 帮你把面板填好" style="flex:1;font-size: var(--fs-base);"></textarea>
            <button class="btn btn-secondary" type="button" id="panel-ai-btn" style="white-space:nowrap;" onclick="aiRewriteCreatePanel()">AI 帮我写</button>
          </div>
          ${buildPanelFieldsHtml()}
        </details>
      </div>`;
  }

  function readCreatePanel() {
    const panel = Panel.empty();
    for (const f of Panel.FIELDS) {
      const el = document.getElementById(`panel-${f.key}`);
      if (el) panel[f.key] = String(el.value || '').trim();
    }
    return panel;
  }

  function writeCreatePanel(panel) {
    for (const f of Panel.FIELDS) {
      const el = document.getElementById(`panel-${f.key}`);
      if (el) el.value = String(panel?.[f.key] ?? '');
    }
  }

  /** AI 改造面板：把一句自然语言描述整理成结构化面板 */
  async function aiRewriteCreatePanel() {
    const desc = (document.getElementById('panel-ai-input')?.value || '').trim();
    if (!desc) { UI.showToast('先写一句描述', 'error'); return; }
    const settings = Storage.getSettings();
    const profileList = Object.values(Storage.getApiProfiles());
    const apiProfileId = settings.defaultApiProfileId || (profileList[0] ? profileList[0].id : '');
    if (!apiProfileId) { UI.showToast('请先配置 API 接口', 'error'); return; }

    const btn = document.getElementById('panel-ai-btn');
    const original = btn ? btn.textContent : '';
    if (btn) { btn.textContent = '生成中…'; btn.disabled = true; }
    try {
      const { systemPrompt, messages } = Panel.buildAiRewriteMessages(desc, readCreatePanel());
      const res = await API.sendChat({ apiProfileId, model: settings.defaultModel || '', systemPrompt, messages });
      if (!res.success) throw new Error(res.error || '请求失败');
      const parsed = Panel.parseAiRewrite(res.content || '');
      if (!parsed.ok) throw new Error(parsed.error);
      writeCreatePanel(parsed.panel);
      UI.showToast('已生成，可自行修改', 'success');
    } catch (e) {
      UI.showToast('生成失败：' + e.message, 'error');
    } finally {
      if (btn) { btn.textContent = original; btn.disabled = false; }
    }
  }

  function showCreateModal() {
    // Public mode: simplified creation (no API profile/model selection)
    if (Config.isPublic()) {
      UI.showModal({
        title: '创建新故事',
        content: buildCreateFormHtml(),
        buttons: [
          { text: '取消', class: 'btn-secondary', onclick: 'UI.closeModal()' },
          { text: '创建', class: 'btn-primary', onclick: 'doCreateConversation()' },
        ],
      });
      setTimeout(() => {
        const nameInput = document.getElementById('create-name');
        if (nameInput) nameInput.focus();
      }, 100);
      return;
    }

    const profiles = Storage.getApiProfiles();
    const profileList = Object.values(profiles);

    // If no API profiles configured, redirect to settings
    if (profileList.length === 0) {
      UI.showToast('请先配置API接口', 'error');
      setTimeout(() => { window.location.href = 'settings.html?v=13'; }, 800);
      return;
    }

    UI.showModal({
      title: '创建新故事',
      content: buildCreateFormHtml(),
      buttons: [
        { text: '取消', class: 'btn-secondary', onclick: 'UI.closeModal()' },
        { text: '创建', class: 'btn-primary', onclick: 'doCreateConversation()' },
      ],
    });

    // Focus the name input after modal opens
    setTimeout(() => {
      const nameInput = document.getElementById('create-name');
      if (nameInput) nameInput.focus();
    }, 100);
  }

  function doCreateConversation() {
    const name = (document.getElementById('create-name').value || '').trim() || '新的故事';

    let apiProfileId, model;
    if (Config.isPublic()) {
      apiProfileId = '__server__';
      model = Config.defaultModel;
    } else {
      const s = Storage.getSettings();
      const profiles = Storage.getApiProfiles();
      const profileList = Object.values(profiles);
      apiProfileId = s.defaultApiProfileId || (profileList[0] ? profileList[0].id : '');
      model = s.defaultModel || '';
      if (!apiProfileId) {
        UI.showToast('请先在设置中配置API', 'error');
        return;
      }
    }

    const settings = Storage.getSettings();
    const id = Utils.generateId('conv');
    const panel = readCreatePanel();
    const conv = {
      id,
      name,
      phase: 'init',
      apiProfileId,
      model,
      // 对话级预设：空 = 跟随全局预设（settings.activePresetId）
      presetId: '',
      messages: [],
      mvu: null,
      storySetting: null,
      worldBook: null,
      // 起步面板：空面板不写入，保持与老对话完全一致的结构
      panel: Panel.isEmpty(panel) ? undefined : panel,
      summary: { mergedSummaries: [], archive: [], lastMergedIdx: 0, interval: settings.summaryInterval || 80 },
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };

    Storage.saveConversation(conv);
    UI.closeModal();
    window.location.href = `chat.html?v=13&id=${id}&new=true`;
  }

  // ── Open Conversation ──────────────────────────
  function openConversation(id, event) {
    // Don't navigate if clicking action buttons or rename input
    if (event.target.closest('.conv-card-actions') || event.target.closest('.conv-card-rename')) {
      return;
    }
    window.location.href = `chat.html?v=13&id=${id}`;
  }

  // ── Rename (inline) ───────────────────────────
  function startRename(id, event) {
    event.stopPropagation();
    const meta = Storage.getConversation(id);
    if (!meta) return;

    const nameEl = document.getElementById(`name-${id}`);
    if (!nameEl) return;

    const currentName = meta.name || '未命名故事';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'conv-card-rename';
    input.value = currentName;

    nameEl.replaceWith(input);
    input.focus();
    input.select();

    let finished = false;
    async function finishRename() {
      if (finished) return;
      finished = true;
      const newName = input.value.trim() || currentName;
      if (newName !== currentName) {
        // Load full conversation from server, update name, save back
        const conv = await Storage.loadConversation(id);
        if (conv) {
          conv.name = newName;
          Storage.saveConversation(conv);
        }
      }
      loadConversations();
    }

    input.addEventListener('blur', finishRename);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = currentName; input.blur(); }
    });
    input.addEventListener('click', (e) => e.stopPropagation());
  }

  // ── Delete ─────────────────────────────────────
  function confirmDelete(id, event) {
    event.stopPropagation();
    const conv = Storage.getConversation(id);
    if (!conv) return;

    UI.showConfirm({
      title: '删除故事',
      message: `确定要删除「${Utils.escapeHtml(conv.name || '未命名故事')}」吗？此操作不可撤销。`,
      onConfirm: () => {
        Storage.deleteConversation(id);
        UI.showToast('故事已删除', 'success');
        loadConversations();
      },
    });
  }

  // ── Fork Conversation ────────────────────────────
  async function forkConversation(id, event) {
    event.stopPropagation();
    UI.showToast('正在复制...', 'info');
    const conv = await Storage.loadConversation(id);
    if (!conv) { UI.showToast('无法加载对话', 'error'); return; }
    const fork = JSON.parse(JSON.stringify(conv));
    fork.id = Utils.generateId();
    fork.name = (conv.name || '对话') + ' (副本)';
    fork.createdAt = Date.now();
    fork.updatedAt = Date.now();
    Storage.saveConversation(fork);
    loadConversations();
    UI.showToast('对话已复制', 'success');
  }

  // ── Export Single Conversation ──────────────────
  async function exportConversation(id, event) {
    event.stopPropagation();
    UI.showToast('正在加载对话数据...', 'info');
    const conv = await Storage.loadConversation(id);
    if (!conv) { UI.showToast('无法加载对话', 'error'); return; }
    const json = JSON.stringify(conv, null, 2);
    const name = (conv.name || '对话').replace(/[\/\\:*?"<>|]/g, '_');
    const date = new Date().toISOString().slice(0, 16).replace(':', '');
    Utils.downloadFile(json, `airp-conv-${name}-${date}.json`);
    UI.showToast('对话已导出', 'success');
  }

  // ── Export All Data ────────────────────────────
  async function exportAllData() {
    UI.showToast('正在加载全部数据...', 'info');
    const data = await Storage.exportAll();
    if (data && data.ok === false) {
      UI.showToast(data.error || '导出失败', 'error');
      return;
    }
    const missing = data && data._missing ? data._missing.length : 0;
    const json = JSON.stringify(data, null, 2);
    Utils.downloadFile(json, `airp-backup-${new Date().toISOString().slice(0, 16).replace(':', '')}.json`);
    if (missing > 0) {
      UI.showToast(`数据已导出，但有 ${missing} 个对话读取失败，备份可能不完整`, 'error');
      return;
    }
    UI.showToast('数据已导出', 'success');
  }

  // ── Import Data ────────────────────────────────
  function triggerImport() {
    document.getElementById('import-file-input').click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        UI.showConfirm({
          title: '导入数据',
          message: '导入将覆盖当前所有数据，确定继续吗？',
          onConfirm: async () => {
            UI.showToast('正在导入...', 'info');
            const res = await Storage.importAll(data);
            if (res && res.ok) {
              UI.showToast(`数据导入成功（${res.conversations} 个故事）`, 'success');
            } else {
              const detail = res && res.error ? res.error : '';
              const failed = res && res.failed ? `，${res.failed} 个条目写入失败` : '';
              UI.showToast(`导入未完成：${detail || '没有可导入的数据'}${failed}`, 'error');
            }
            loadConversations();
          },
        });
      } catch {
        UI.showToast('文件格式无效', 'error');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // ── Boot ───────────────────────────────────────
  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
