/**
 * Render AI message content with proper handling of <details> blocks.
 * Strategy:
 *   1. Clean MVU/story_setting code blocks from text
 *   2. Separate the abstract (<details>) from the story body
 *   3. Render story body through renderMarkdown (which escapes HTML)
 *   4. Append abstract as raw trusted HTML
 */
function renderAiContent(rawContent) {
  if (!rawContent) return '';
  const hideReasoning = MVU.shouldHideReasoning();
  // Extract <thinking> block as collapsible
  const thinking = hideReasoning ? null : MVU.parseThinking(rawContent);
  let thinkingHtml = '';
  if (thinking) {
    const thinkEscaped = Utils.escapeHtml(thinking).replace(/\n/g, '<br>');
    thinkingHtml = `<details class="thinking-block"><summary>思考过程</summary><div class="thinking-content">${thinkEscaped}</div></details>`;
  }
  // Extract story content with refine applied
  const storyText = Utils.extractStoryContent(hideReasoning ? MVU.stripThinking(rawContent) : rawContent, true);
  // Check if refine was applied (for indicator)
  const refineArr = MVU.parseRefine(rawContent);
  let refineHtml = '';
  if (refineArr && refineArr.length > 0) {
    refineHtml = `<div class="refine-indicator" title="AI 自动润色了 ${refineArr.length} 处表述">* 已润色 ${refineArr.length} 处</div>`;
  }
  return thinkingHtml + Utils.renderMarkdown(storyText) + refineHtml;
}

const MSG_PAGE_SIZE = 20;
let _renderedFromIdx = 0; // tracks how far back we've rendered

function renderAllMessages() {
  const list = document.getElementById('messagesList');
  list.innerHTML = '';

  if (conversation.messages.length === 0) {
    const startLabel = conversation.phase === 'init' ? '直接开始' : '开始';
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-quill">${Icons.book}</div>
        <span class="empty-ornament"></span>
        <div class="empty-title">Begin Your Story</div>
        <p class="empty-desc">${conversation.phase === 'init'
          ? '请输入「详细定制」，AI 会陪你逐步打磨世界观、角色设定等。你也可以输入「快速开始」，AI 会协助你快速构建想要的世界。如果没想好玩什么，输入「直接开始」即可完全随机生成。'
          : '输入「开始」，AI 将根据设定为你展开第一幕故事。'}</p>
        <button class="btn btn-primary empty-cta" onclick="quickFillInput('${startLabel}')">✦ ${startLabel}</button>
      </div>`;
    _renderedFromIdx = 0;
    return;
  }

  const total = conversation.messages.length;
  _renderedFromIdx = Math.max(0, total - MSG_PAGE_SIZE);

  // Insert load-more sentinel if there are older messages
  if (_renderedFromIdx > 0) {
    const sentinel = document.createElement('div');
    sentinel.id = 'loadMoreSentinel';
    sentinel.className = 'load-more-sentinel';
    sentinel.textContent = `↑ 加载更早的消息 (${_renderedFromIdx} 条)`;
    sentinel.onclick = () => loadOlderMessages();
    list.appendChild(sentinel);
  }

  for (let i = _renderedFromIdx; i < total; i++) {
    const msg = conversation.messages[i];
    const el = createMessageElement(msg, i);
    list.appendChild(el);
  }

  scrollToBottom(false);
  _setupScrollLoadMore();
}

let _loadingOlder = false;
function loadOlderMessages() {
  if (_renderedFromIdx <= 0 || _loadingOlder) return;
  _loadingOlder = true;

  const list = document.getElementById('messagesList');
  const area = document.getElementById('messagesArea');
  const prevScrollHeight = area.scrollHeight;

  const loadTo = Math.max(0, _renderedFromIdx - MSG_PAGE_SIZE);
  const fragment = document.createDocumentFragment();

  for (let i = loadTo; i < _renderedFromIdx; i++) {
    const msg = conversation.messages[i];
    const el = createMessageElement(msg, i);
    fragment.appendChild(el);
  }

  const sentinel = document.getElementById('loadMoreSentinel');
  if (sentinel) {
    sentinel.after(fragment);
    if (loadTo <= 0) {
      sentinel.remove();
    } else {
      sentinel.textContent = `↑ 加载更早的消息 (${loadTo} 条)`;
    }
  } else {
    list.prepend(fragment);
  }

  _renderedFromIdx = loadTo;

  // overflow-anchor handles scroll position automatically
  setTimeout(() => { _loadingOlder = false; }, 100);
}

function _setupScrollLoadMore() {
  const area = document.getElementById('messagesArea');
  if (area._scrollLoadHandler) return; // already set up
  // Delay binding to avoid triggering during initial scroll-to-bottom
  setTimeout(() => {
    area._scrollLoadHandler = () => {
      if (area.scrollTop < 100 && _renderedFromIdx > 0) {
        loadOlderMessages();
      }
    };
    area.addEventListener('scroll', area._scrollLoadHandler, { passive: true });
  }, 500);
}

function createMessageElement(msg, idx) {
  const wrapper = document.createElement('div');
  wrapper.className = `message ${msg.role}${msg.hidden ? ' hidden-msg' : ''}`;
  wrapper.id = `msg-${msg.id || idx}`;
  wrapper.dataset.msgIdx = idx;

  // Build action buttons
  const msgIdAttr = msg.id || idx;
  const actionsHtml = `
    <div class="message-actions">
      <button class="btn-icon" title="复制" onclick="copyMessage('${msgIdAttr}')">
        <span class="icon" style="width:14px;height:14px;">${Icons.copy}</span>
      </button>
      <button class="btn-icon" title="编辑" onclick="editMessage('${msgIdAttr}')">
        <span class="icon" style="width:14px;height:14px;">${Icons.edit}</span>
      </button>
      ${msg.role === 'user' ? `<button class="btn-icon" title="重新发送" onclick="retryMessage('${msgIdAttr}')">
        <span class="icon" style="width:14px;height:14px;">${Icons.retry}</span>
      </button>` : ''}
      ${conversation.phase === 'rp' ? `<button class="btn-icon" title="回档到此" onclick="revertToMessage('${msgIdAttr}')">
        <span class="icon" style="width:14px;height:14px;">${Icons.rewind}</span>
      </button>` : ''}
      <button class="btn-icon" title="删除" onclick="deleteMessage('${msgIdAttr}')">
        <span class="icon" style="width:14px;height:14px;">${Icons.trash}</span>
      </button>
    </div>`;

  const timeStr = msg.timestamp ? Utils.formatTime(msg.timestamp) : '';
  const timeHtml = timeStr ? `<div class="message-time">${timeStr}</div>` : '';

  if (msg.role === 'assistant') {
    const rendered = renderAiContent(msg.content);
    wrapper.innerHTML = `
      ${actionsHtml}
      <div class="message-content novel-prose-block">${rendered}</div>
      ${renderMessageImages(msg)}
      ${timeHtml}`;
  } else {
    const escaped = Utils.escapeHtml(msg.content);
    wrapper.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:flex-end;width:100%;">
        ${actionsHtml}
        <div class="message-bubble">${escaped.replace(/\n/g, '<br>')}</div>
        ${timeHtml}
      </div>`;
  }

  return wrapper;
}

let _lbState = { msgId: null, index: 0 };
let _imgPanelOpen = false;
let _imgGalleryMode = false; // 生图面板停留视图：false=生成表单，true=配图画廊

/** 渲染某条消息的图片区（已生成图 + 生成中/失败占位） */
function renderMessageImages(msg) {
  if (!msg) return '';
  const imgs = Array.isArray(msg.images) ? msg.images : [];
  const pending = (typeof AgnesGen !== 'undefined') ? AgnesGen.pendingFor(msg.id) : [];
  if (!imgs.length && !pending.length) return '';

  const cards = [];
  imgs.forEach((im, i) => {
    cards.push(
      `<div class="msg-image-card gallery-art-card" onclick="openLightbox('${msg.id}', ${i})">
        <img src="${im.dataUrl}" alt="配图 ${i + 1}" loading="lazy">
        <span class="img-idx">${i + 1}</span>
        ${im.source === 'auto' ? '<span class="img-badge">AI 配图</span>' : ''}
        ${renderArtOverlayMeta(im)}
        <div class="img-actions">
          <button title="下载" onclick="event.stopPropagation();downloadMessageImage('${msg.id}',${i})"><span class="icon" style="width:13px;height:13px;">${Icons.download}</span></button>
          <button title="删除" onclick="event.stopPropagation();deleteMessageImage('${msg.id}',${i})"><span class="icon" style="width:13px;height:13px;">${Icons.trash}</span></button>
        </div>
      </div>`
    );
  });
  pending.forEach(t => {
    if (t.status === 'error') {
      cards.push(
        `<div class="msg-image-card placeholder error">
          <div class="art-bg-simulated art-bg-2"></div>
          <div class="ph-text">生图失败<br>${Utils.escapeHtml(String(t.error || '').slice(0, 80))}</div>
        </div>`
      );
    } else {
      cards.push(
        `<div class="msg-image-card placeholder">
          <div class="art-bg-simulated art-bg-1"></div>
          <div class="ph-spinner"></div>
          <div class="ph-text">绘制中…<br>${Utils.escapeHtml(String(t.prompt || '').slice(0, 36))}</div>
        </div>`
      );
    }
  });
  return `<div class="msg-images gallery-masonry${cards.length === 1 ? ' single' : ''}">${cards.join('')}</div>`;
}

/**
 * 图片卡叠加信息层（方案 .art-overlay-meta）
 * 标题取提示词前 14 个字；比例取 im.ratio；风格优先取 STYLE_PRESETS 的标签名，
 * 否则回退到 im.style / im.revised 的片段。两者都没有就只显示比例。
 * 纯展示、pointer-events:none，不影响卡片点击放大。
 */
function renderArtOverlayMeta(im) {
  const rawPrompt = String((im && im.prompt) || '').trim();
  const title = rawPrompt ? rawPrompt.slice(0, 14) : '';

  const ratio = String((im && im.ratio) || '').trim();
  const rawStyle = String((im && (im.style || im.revised)) || '').trim();
  let style = '';
  if (rawStyle) {
    const presets = (typeof AgnesAPI !== 'undefined' && Array.isArray(AgnesAPI.STYLE_PRESETS))
      ? AgnesAPI.STYLE_PRESETS : [];
    const hit = presets.find(p => p && p.value === rawStyle);
    style = hit ? hit.label : rawStyle.slice(0, 8);
  }
  const pill = [ratio, style].filter(Boolean).join(' · ');

  if (!title && !pill) return '';
  return `<div class="art-overlay-meta">${title ? `<div class="art-title">${Utils.escapeHtml(title)}</div>` : ''}${pill ? `<span class="art-ratio-pill">${Utils.escapeHtml(pill)}</span>` : ''}</div>`;
}

/** 局部刷新某条消息的图片区（不重建整条消息，避免打断流式渲染） */
function refreshMessageImages(msgId) {
  const wrapper = document.getElementById(`msg-${msgId}`);
  if (!wrapper) return;
  const msg = (conversation.messages || []).find(m => m.id === msgId);
  if (!msg) return;
  const old = wrapper.querySelector('.msg-images');
  const html = renderMessageImages(msg);
  if (!html) { if (old) old.remove(); return; }

  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const fresh = tmp.firstElementChild;
  if (old) {
    old.replaceWith(fresh);
  } else {
    const timeEl = wrapper.querySelector('.message-time');
    if (timeEl) wrapper.insertBefore(fresh, timeEl);
    else wrapper.appendChild(fresh);
  }
  // 画廊视图开着时同步增量（生成完成回调会走到这里）
  if (_imgPanelOpen && _imgGalleryMode) renderImageGallery();
}

function _findMessageById(msgId) {
  return (conversation.messages || []).find(m => m.id === msgId) || null;
}

// ---- 灯箱 ----
function openLightbox(msgId, index) {
  const msg = _findMessageById(msgId);
  if (!msg || !Array.isArray(msg.images) || !msg.images.length) return;
  _lbState = { msgId, index: Math.max(0, Math.min(index, msg.images.length - 1)) };
  document.getElementById('imgLightbox').classList.add('show');
  renderLightbox();
}

function closeLightbox() {
  document.getElementById('imgLightbox').classList.remove('show');
  _lbState = { msgId: null, index: 0 };
}

function onLightboxBackdrop(e) {
  if (e.target && e.target.id === 'imgLightbox') closeLightbox();
}

function renderLightbox() {
  const msg = _findMessageById(_lbState.msgId);
  if (!msg || !Array.isArray(msg.images) || !msg.images.length) { closeLightbox(); return; }
  const i = Math.max(0, Math.min(_lbState.index, msg.images.length - 1));
  _lbState.index = i;
  const im = msg.images[i];

  document.getElementById('lbImage').src = im.dataUrl;
  document.getElementById('lbTitle').textContent = `配图 ${i + 1} / ${msg.images.length}`;
  document.getElementById('lbPrompt').textContent = im.revised
    ? `提示词：${im.prompt}\n模型改写：${im.revised}`
    : `提示词：${im.prompt || ''}`;
  document.getElementById('lbPrompt').style.whiteSpace = 'pre-wrap';

  const multi = msg.images.length > 1;
  document.getElementById('lbPrev').style.display = multi ? 'flex' : 'none';
  document.getElementById('lbNext').style.display = multi ? 'flex' : 'none';
  document.getElementById('lbPrev').disabled = i <= 0;
  document.getElementById('lbNext').disabled = i >= msg.images.length - 1;

  const thumbs = document.getElementById('lbThumbs');
  if (multi) {
    thumbs.style.display = 'flex';
    thumbs.innerHTML = msg.images.map((t, k) =>
      `<img src="${t.dataUrl}" class="${k === i ? 'active' : ''}" onclick="jumpLightbox(${k})" alt="缩略图 ${k + 1}">`
    ).join('');
  } else {
    thumbs.style.display = 'none';
    thumbs.innerHTML = '';
  }
}

function stepLightbox(delta) {
  const msg = _findMessageById(_lbState.msgId);
  if (!msg || !msg.images) return;
  const next = _lbState.index + delta;
  if (next < 0 || next >= msg.images.length) return;
  _lbState.index = next;
  renderLightbox();
}

function jumpLightbox(k) { _lbState.index = k; renderLightbox(); }

function _downloadDataUrl(dataUrl, filename) {
  try {
    const blob = (typeof AgnesImage !== 'undefined')
      ? AgnesImage.dataUrlToBlob(dataUrl)
      : null;
    if (!blob) return false;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {
    log('download image failed:', e && e.message);
    return false;
  }
}

function downloadLightboxImage() {
  const msg = _findMessageById(_lbState.msgId);
  if (!msg || !msg.images || !msg.images[_lbState.index]) return;
  const im = msg.images[_lbState.index];
  const ok = _downloadDataUrl(im.dataUrl, `入卷配图-${_lbState.index + 1}-${im.id || Date.now()}.jpg`);
  if (ok) UI.showToast('图片已开始下载', 'success');
  else UI.showToast('当前环境不支持直接下载，请长按图片保存', 'info');
}

function downloadMessageImage(msgId, index) {
  const msg = _findMessageById(msgId);
  if (!msg || !msg.images || !msg.images[index]) return;
  const im = msg.images[index];
  const ok = _downloadDataUrl(im.dataUrl, `入卷配图-${index + 1}-${im.id || Date.now()}.jpg`);
  if (ok) UI.showToast('图片已开始下载', 'success');
  else UI.showToast('当前环境不支持直接下载，请长按图片保存', 'info');
}

function deleteMessageImage(msgId, index) {
  const msg = _findMessageById(msgId);
  if (!msg || !msg.images || !msg.images[index]) return;
  msg.images.splice(index, 1);
  if (!msg.images.length) delete msg.images;
  Storage.saveConversation(conversation);
  refreshMessageImages(msgId);
  if (_lbState.msgId === msgId) {
    if (msg.images && msg.images.length) renderLightbox();
    else closeLightbox();
  }
  UI.showToast('已删除该配图', 'success');
}

// 键盘：ESC 关灯箱 / 左右切换
document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('imgLightbox');
  if (!lb || !lb.classList.contains('show')) return;
  if (e.key === 'Escape') { closeLightbox(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { stepLightbox(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { stepLightbox(1); e.preventDefault(); }
});

// ---- 生图面板 ----
function toggleImagePanel() { _imgPanelOpen ? closeImagePanel() : openImagePanel(); }

function openImagePanel() {
  if (typeof AgnesAPI === 'undefined') { UI.showToast('生图模块未加载', 'error'); return; }
  if (!AgnesAPI.isEnabled()) { UI.showToast('生图功能已在设置中关闭', 'info'); return; }

  buildImagePanelOptions();

  // 输入框里已有文字 → 顺手当作画面描述带进来；否则用设置里保存的手动提示词
  const ta = document.getElementById('inputTextarea');
  const promptEl = document.getElementById('imgGenPrompt');
  if (promptEl && !promptEl.value.trim()) {
    const fromInput = ta && ta.value.trim();
    const fromSettings = String((Storage.getSettings().imageManualPrompt) || '').trim();
    if (fromInput) promptEl.value = fromInput;
    else if (fromSettings) promptEl.value = fromSettings;
  }

  document.getElementById('imgGenPanel').classList.add('open');
  document.getElementById('imgGenOverlay').classList.add('show');
  _imgPanelOpen = true;
  applyImageGalleryMode(); // 恢复上次停留的视图（生成表单 / 配图画廊）
  updateImagePanelHint();
  if (!_imgGalleryMode) setTimeout(() => { try { promptEl.focus(); } catch {} }, 280);
}

function closeImagePanel() {
  document.getElementById('imgGenPanel').classList.remove('open');
  document.getElementById('imgGenOverlay').classList.remove('show');
  _imgPanelOpen = false;
}

// ---- 配图画廊：浏览本卷全部生成图，点图进灯箱 ----
function collectConversationImages() {
  const out = [];
  (conversation.messages || []).forEach(msg => {
    (Array.isArray(msg.images) ? msg.images : []).forEach((im, i) => {
      if (im && im.dataUrl) out.push({ msgId: msg.id, idx: i, im });
    });
  });
  return out.reverse(); // 最新优先
}

function renderImageGallery() {
  const view = document.getElementById('imgGalleryView');
  if (!view) return;
  const items = collectConversationImages();
  if (!items.length) {
    view.innerHTML = `
      <div class="img-gallery-empty">
        <span class="icon">${Icons.image}</span>
        <p>本卷还没有生成过配图</p>
        <span class="sub">在「生成配图」里描述画面，或让 AI 在故事中自动配图</span>
      </div>`;
    return;
  }
  view.innerHTML = items.map(it => `
    <div class="img-gallery-cell" title="${Utils.escapeHtml(String(it.im.prompt || '').slice(0, 60))}"
         onclick="openGalleryImage('${it.msgId}', ${it.idx})">
      <img src="${it.im.dataUrl}" alt="配图" loading="lazy">
    </div>`).join('');
}

function applyImageGalleryMode() {
  const form = document.getElementById('imgGenFormView');
  const view = document.getElementById('imgGalleryView');
  const btn = document.getElementById('imgGalleryBtn');
  const title = document.getElementById('imgGenTitle');
  if (!form || !view) return;
  if (_imgGalleryMode) renderImageGallery();
  form.style.display = _imgGalleryMode ? 'none' : '';
  view.style.display = _imgGalleryMode ? '' : 'none';
  if (btn) btn.classList.toggle('active', _imgGalleryMode);
  if (title) title.textContent = _imgGalleryMode ? '配图画廊' : '生成配图';
}

function toggleImageGallery() {
  _imgGalleryMode = !_imgGalleryMode;
  applyImageGalleryMode();
}

// 灯箱(z 1200)低于面板(z 2000)：先收面板再开灯箱，关闭后重开面板仍停留在画廊
function openGalleryImage(msgId, idx) {
  closeImagePanel();
  openLightbox(msgId, idx);
}

function buildImagePanelOptions() {
  const cfg = AgnesAPI.cfg();
  const s = Storage.getSettings();

  const sizeSel = document.getElementById('imgGenSize');
  if (sizeSel && !sizeSel.options.length) {
    sizeSel.innerHTML = AgnesAPI.SIZES.map(v => `<option value="${v}">${v}</option>`).join('');
  }
  const ratioSel = document.getElementById('imgGenRatio');
  if (ratioSel && !ratioSel.options.length) {
    ratioSel.innerHTML = AgnesAPI.RATIOS.map(v => `<option value="${v}">${v}</option>`).join('');
  }
  const styleSel = document.getElementById('imgGenStyle');
  if (styleSel && !styleSel.options.length) {
    const presets = (typeof AgnesPrompt !== 'undefined' && AgnesPrompt.STYLE_PRESETS) || [];
    styleSel.innerHTML = `<option value="">不使用风格后缀</option>`
      + presets.map(p => `<option value="${Utils.escapeHtml(p.value)}">${Utils.escapeHtml(p.label)}</option>`).join('');
  }

  if (sizeSel) sizeSel.value = cfg.size;
  if (ratioSel) ratioSel.value = cfg.ratio;
  if (styleSel) styleSel.value = cfg.style || '';

  const chips = document.getElementById('imgGenStyleChips');
  if (chips) {
    const presets = (typeof AgnesPrompt !== 'undefined' && AgnesPrompt.STYLE_PRESETS) || [];
    chips.innerHTML = presets.map(p =>
      `<button type="button" class="img-gen-chip" data-style="${Utils.escapeHtml(p.value)}" onclick="pickImageStyle(this)">${Utils.escapeHtml(p.label)}</button>`
    ).join('') + `<button type="button" class="img-gen-chip" onclick="pickImageStyle(this, '')">清除风格</button>`;
    _syncStyleChips();
  }

  // 比例跟随默认值（面板未手动改过时）
  if (ratioSel && !ratioSel.dataset.touched) ratioSel.value = cfg.ratio;
}

function _syncStyleChips() {
  const styleSel = document.getElementById('imgGenStyle');
  const cur = styleSel ? styleSel.value : '';
  document.querySelectorAll('#imgGenStyleChips .img-gen-chip').forEach(c => {
    c.classList.toggle('active', !!c.dataset.style && c.dataset.style === cur);
  });
}

function pickImageStyle(btn, forced) {
  const styleSel = document.getElementById('imgGenStyle');
  if (!styleSel) return;
  const val = forced !== undefined ? forced : (btn.dataset.style || '');
  // 再次点击同一风格 = 取消
  styleSel.value = (forced === undefined && styleSel.value === val) ? '' : val;
  _syncStyleChips();
  updateImagePanelHint();
}

function updateImagePanelHint() {
  const hint = document.getElementById('imgGenHint');
  if (!hint) return;
  const cfg = AgnesAPI.cfg();
  const station = (typeof AgnesAPI.stationOf === 'function') ? AgnesAPI.stationOf(cfg.endpoint) : '';
  const stationTip = station ? `当前站点：${station}。` : '';
  if (!cfg.apiKey) {
    hint.className = 'img-gen-hint warn';
    hint.textContent = '尚未填写生图 API Key，请到「设置 → 生图设置」中填入。';
    return;
  }
  hint.className = 'img-gen-hint';
  let stats = { count: 0, bytes: 0 };
  try { stats = AgnesGen.stats(); } catch {}
  const mb = (stats.bytes / 1048576).toFixed(2);
  const cap = cfg.maxPerConv;
  hint.textContent = `${stationTip}本会话已有 ${stats.count} 张配图（约 ${mb} MB），上限 ${cap} 张，超出后自动淘汰最旧的。`;
}

async function submitImageGen() {
  const btn = document.getElementById('imgGenSubmit');
  const btnText = document.getElementById('imgGenSubmitText');
  const prompt = (document.getElementById('imgGenPrompt').value || '').trim();
  if (!prompt) { UI.showToast('请先写下画面描述', 'info'); return; }
  if (!AgnesAPI.isConfigured()) {
    UI.showToast('尚未配置生图 API Key（设置 → 生图设置）', 'error');
    return;
  }
  if (!AgnesGen.resolveTargetMessage(null)) {
    UI.showToast('还没有可挂载配图的 AI 消息，先开始一段故事吧', 'info');
    return;
  }

  const ratio = document.getElementById('imgGenRatio').value;
  const size = document.getElementById('imgGenSize').value;
  const style = document.getElementById('imgGenStyle').value;

  btn.disabled = true;
  if (btnText) btnText.textContent = '绘制中…';
  const trig = document.getElementById('imgTriggerBtn');
  if (trig) trig.classList.add('busy');

  try {
    await AgnesGen.run(null, prompt, { ratio, size, style, source: 'manual' });
    UI.showToast('配图已生成', 'success');
    closeImagePanel();
  } catch (e) {
    UI.showToast('生图失败：' + ((e && e.message) || '未知错误'), 'error');
  } finally {
    btn.disabled = false;
    if (btnText) btnText.textContent = '生成';
    if (trig) trig.classList.remove('busy');
    updateImagePanelHint();
  }
}

/** AI 回复落地后，按其中的配图指令自动生图（不阻塞正文渲染） */
function triggerAutoImageGen(fullText, aiMsg) {
  if (typeof AgnesGen === 'undefined' || typeof AgnesAPI === 'undefined') return;
  if (!AgnesAPI.isEnabled() || !AgnesAPI.isConfigured()) return;
  const s = Storage.getSettings();
  if (s.imageAutoTrigger === false) return;
  if (!AgnesPrompt.parseRequests(fullText).length) return;

  // 让 UI 先把正文和占位渲染完，再发请求
  setTimeout(() => {
    AgnesGen.processAutoRequests(fullText, aiMsg).catch(e => log('自动配图异常:', e && e.message));
  }, 60);
}

function updateAssistantBubble(msgId, content, streaming) {
  const wrapper = document.getElementById(`msg-${msgId}`);
  if (!wrapper) return;
  const contentEl = wrapper.querySelector('.message-content');
  if (!contentEl) return;

  if (editMvuMode) {
    // Edit mode: show full response (code blocks cleaned for display)
    const cleaned = MVU.cleanText(content);
    contentEl.innerHTML = Utils.renderMarkdown(cleaned);
    if (streaming && cleaned) contentEl.classList.add('streaming-cursor');
    else contentEl.classList.remove('streaming-cursor');
  } else if (streaming) {
    // During streaming: show <thinking> as collapsible + <story> content
    // Detect thinking block (complete or partial) — supports <thinking>, <think>, <deep_thinking>
    // 「隐藏思考内容」开启时先剥掉思考块，后面的检测自然落到"无思考块"分支
    if (MVU.shouldHideReasoning()) content = MVU.stripThinking(content);
    let thinkOpen = content.indexOf('<thinking>');
    let thinkClose = content.indexOf('</thinking>');
    let tagLen = 10; // '<thinking>'.length
    if (thinkOpen === -1) {
      thinkOpen = content.indexOf('<think>');
      thinkClose = content.indexOf('</think>');
      tagLen = 7; // '<think>'.length
    }
    if (thinkOpen === -1) {
      thinkOpen = content.indexOf('<deep_thinking>');
      thinkClose = content.indexOf('</deep_thinking>');
      tagLen = 15; // '<deep_thinking>'.length
    }

    // Get or create the thinking block element (avoid full rebuild each chunk)
    let thinkEl = contentEl.querySelector('.thinking-block');
    let storyEl = contentEl.querySelector('.streaming-story');

    if (thinkClose !== -1) {
      // Complete thinking — render collapsed, only rebuild if not already finalized
      if (!thinkEl || !thinkEl.dataset.finalized) {
        const thinkText = content.substring(thinkOpen + tagLen, thinkClose).trim();
        const thinkEscaped = Utils.escapeHtml(thinkText).replace(/\n/g, '<br>');
        if (!thinkEl) {
          thinkEl = document.createElement('details');
          thinkEl.className = 'thinking-block';
          contentEl.prepend(thinkEl);
        }
        thinkEl.removeAttribute('open');
        thinkEl.dataset.finalized = '1';
        thinkEl.innerHTML = `<summary>思考过程</summary><div class="thinking-content">${thinkEscaped}</div>`;
      }
      // Update story part only
      const storyText = Utils.extractStoryContent(content);
      if (!storyEl) {
        storyEl = document.createElement('div');
        storyEl.className = 'streaming-story';
        contentEl.appendChild(storyEl);
      }
      storyEl.innerHTML = Utils.renderMarkdown(storyText);
      if (storyText) contentEl.classList.add('streaming-cursor');
    } else if (thinkOpen !== -1) {
      // Partial thinking — still streaming thought, update content in place
      const thinkText = content.substring(thinkOpen + tagLen).trim();
      const thinkEscaped = Utils.escapeHtml(thinkText).replace(/\n/g, '<br>');
      if (!thinkEl) {
        contentEl.innerHTML = '';
        thinkEl = document.createElement('details');
        thinkEl.className = 'thinking-block';
        thinkEl.setAttribute('open', '');
        contentEl.appendChild(thinkEl);
      }
      thinkEl.innerHTML = `<summary>思考中…</summary><div class="thinking-content">${thinkEscaped}</div>`;
      contentEl.classList.add('streaming-cursor');
    } else {
      // No thinking block — just story content
      const storyText = Utils.extractStoryContent(content);
      contentEl.innerHTML = Utils.renderMarkdown(storyText);
      if (storyText) contentEl.classList.add('streaming-cursor');
    }
  } else {
    // Final render
    contentEl.innerHTML = renderAiContent(content);
    contentEl.classList.remove('streaming-cursor');
  }
}

function renderOptionsBar(rawContent) {
  const bar = document.getElementById('optionsBar');
  if (!bar) return;

  const options = MVU.parseOptions(rawContent);
  if (!options || options.length === 0 || conversation.phase === 'init') {
    bar.style.display = 'none';
    bar.innerHTML = '';
    _optionActions = [];
    return;
  }

  _optionActions = [];
  const optionsHtml = options.map((opt, i) => {
    const seal = `<span class="choice-num-seal">${NUM_SEALS[i] || (i + 1)}</span>`;
    const match = opt.match(/^\d+\.\s*\(([^)]+)\)\s*[：:]\s*(.+)$/);
    if (match) {
      _optionActions.push(match[2]);
      return `<button class="option-tag choice-card-node" onclick="selectOption(${i})">
        ${seal}
        <span class="option-type">${Utils.escapeHtml(match[1])}</span>
        <span class="option-text">${Utils.escapeHtml(match[2])}</span>
      </button>`;
    }
    const plain = opt.replace(/^\d+\.\s*/, '');
    _optionActions.push(plain);
    return `<button class="option-tag choice-card-node" onclick="selectOption(${i})">
      ${seal}
      <span class="option-text">${Utils.escapeHtml(plain)}</span>
    </button>`;
  }).join('');

  // Desktop: show in options bar
  bar.innerHTML = `<div class="choice-card-list">${optionsHtml}</div>`;
  bar.style.display = 'flex';

  // Mobile FAB: populate panel and show icon
  const fab = document.getElementById('optionsFab');
  const panel = document.getElementById('optionsFabPanel');
  if (fab && panel) {
    panel.innerHTML = optionsHtml;
    fab.classList.add('has-options');
    fab.classList.remove('pulse');
    void fab.offsetWidth; // force reflow
    fab.classList.add('pulse');
  }
}

function selectOption(idx) {
  const text = _optionActions[idx];
  if (!text) return;
  // Close mobile panel if open
  const panel = document.getElementById('optionsFabPanel');
  if (panel) panel.classList.remove('open');
  const textarea = document.getElementById('inputTextarea');
  if (!textarea) return;

  if (getOptionsFabSendMode() === 'append') {
    appendOptionToTextarea(textarea, text);
    UI.showToast('选项已追加到输入框', 'info');
    return;
  }

  textarea.value = text;
  handleSend();
}

function clearOptionsBar() {
  const bar = document.getElementById('optionsBar');
  if (bar) { bar.style.display = 'none'; bar.innerHTML = ''; }

// Mobile options FAB toggle & drag
function toggleOptionsFabPanel() {
  if (_optionsFabSuppressClick) {
    _optionsFabSuppressClick = false;
    return;
  }
  if (_optionsFabMoved) return;
  const panel = document.getElementById('optionsFabPanel');
  if (panel) panel.classList.toggle('open');
}

(function setupOptionsFabDrag() {
  document.addEventListener('DOMContentLoaded', () => {
    const fab = document.getElementById('optionsFab');
    if (!fab) return;
    let dragging = false, startX, startY, fabX, fabY;

    const clearLongPress = () => {
      if (_optionsFabLongPressTimer) {
        clearTimeout(_optionsFabLongPressTimer);
        _optionsFabLongPressTimer = null;
      }
    };

    const startLongPress = () => {
      clearLongPress();
      _optionsFabLongPressTimer = setTimeout(() => {
        dragging = false;
        _optionsFabSuppressClick = true;
        openOptionsFabSettings();
      }, OPTIONS_FAB_LONG_PRESS_MS);
    };

    fab.addEventListener('touchstart', (e) => {
      dragging = true;
      _optionsFabMoved = false;
      const t = e.touches[0];
      const rect = fab.getBoundingClientRect();
      startX = t.clientX;
      startY = t.clientY;
      fabX = rect.left;
      fabY = rect.top;
      fab.style.transition = 'none';
      startLongPress();
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) _optionsFabMoved = true;
      if (_optionsFabMoved) clearLongPress();
      if (!_optionsFabMoved) return;
      const newX = Math.max(0, Math.min(window.innerWidth - 44, fabX + dx));
      const newY = Math.max(0, Math.min(window.innerHeight - 44, fabY + dy));
      fab.style.left = newX + 'px';
      fab.style.top = newY + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
    }, { passive: true });

    document.addEventListener('touchend', () => {
      clearLongPress();
      if (!dragging) return;
      dragging = false;
      fab.style.transition = '';
      if (_optionsFabMoved) {
        const rect = fab.getBoundingClientRect();
        const midX = rect.left + 22;
        if (midX < window.innerWidth / 2) {
          fab.style.left = '16px';
          fab.style.right = 'auto';
        } else {
          fab.style.left = 'auto';
          fab.style.right = '16px';
        }
      }
    });

    fab.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      _optionsFabMoved = false;
      startLongPress();
    });

    fab.addEventListener('mouseup', clearLongPress);
    fab.addEventListener('mouseleave', clearLongPress);
    fab.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      clearLongPress();
      _optionsFabSuppressClick = true;
      openOptionsFabSettings();
    });
  });
})();

function renderPromptDrawer() {
  const settings = Storage.getSettings();
  const presetId = settings.activePresetId || 'default';
  const preset = settings.promptPresets?.[presetId];
  const list = document.getElementById('promptDrawerList');
  const meta = document.getElementById('promptDrawerMeta');
  if (!preset || !Array.isArray(preset.entries)) {
    list.innerHTML = '<div style="color:var(--text-muted);font-style:italic;text-align:center;padding:20px;font-size: var(--fs-sm);">当前预设无 entries</div>';
    meta.textContent = '';
    return;
  }
  const onCount = preset.entries.filter(e => e.enabled).length;
  meta.textContent = `预设：${preset.name || presetId} · ${onCount}/${preset.entries.length} 启用`;
  list.innerHTML = preset.entries.map((e, i) => {
    const onClass = e.enabled ? ' is-on' : '';
    const name = (e.name || e.slot || e.id || '(无名)').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    return `<div class="prompt-drawer-row${onClass}" onclick="togglePromptEntry(${i})">
      <div class="prompt-drawer-toggle"></div>
      <div class="prompt-drawer-name">${name}</div>
    </div>`;
  }).join('');
}

function togglePromptEntry(idx) {
  const settings = Storage.getSettings();
  const presetId = settings.activePresetId || 'default';
  const preset = settings.promptPresets?.[presetId];
  if (!preset || !preset.entries[idx]) return;
  preset.entries[idx].enabled = !preset.entries[idx].enabled;
  Storage.saveSettings(settings);
  renderPromptDrawer();
}

function getAbstracts() {
  const abstracts = [];
  let counter = 1;
  for (const msg of (conversation?.messages || [])) {
    if (msg.role === 'assistant' && msg.abstract) {
      const code = 'ab' + String(counter).padStart(2, '0');
      const content = Summary.extractAbstractContent(msg.abstract) || msg.abstract;
      abstracts.push({ code, content, timestamp: msg.timestamp });
      counter++;
    }
  }
  return abstracts;
}

/** 作者注 / 上帝指令：写入 conversation.writingNote（走 @Depth 注入） */
function onWritingNoteChange() {
  const enabled = document.getElementById('writingNoteEnabled')?.checked ?? true;
  const text = document.getElementById('writingNoteText')?.value || '';
  const depth = Number(document.getElementById('writingNoteDepth')?.value) || 0;
  const oneShot = !!document.getElementById('writingNoteOneShot')?.checked;
  conversation.writingNote = { enabled, text, depth: Math.max(0, depth), role: 'user', oneShot };
  // 迁移到新字段，避免两套并存导致重复注入
  if (conversation.writingAdvice) delete conversation.writingAdvice;
  Storage.saveConversation(conversation);
}

/** 记忆长度条：把「上下文被谁占了」变成看得见的比例 */
function renderMemoryBar() {
  let stats;
  try {
    stats = Memory.getMemoryStats(conversation);
  } catch (e) {
    log('renderMemoryBar failed:', e);
    return '';
  }
  const segs = [
    { label: '对话历史', color: '#6d91ba', value: stats.dialogue.tokens, count: stats.dialogue.count },
    { label: '世界书 / 作者注', color: '#d6b25f', value: stats.worldBook.tokens, count: stats.worldBook.count },
    { label: '近期摘要', color: '#78c091', value: stats.recent.tokens, count: stats.recent.count },
    { label: '合并摘要', color: '#b485d4', value: stats.merged.tokens, count: stats.merged.count },
    { label: '往事纪要', color: '#d46556', value: stats.archive.tokens, count: stats.archive.count },
  ];
  const total = stats.totalTokens || 0;
  const shown = segs.filter(s => s.value > 0);
  const bar = total > 0
    ? shown.map(s => `<div style="width:${(s.value / total * 100).toFixed(2)}%;background:${s.color};" title="${s.label} ≈ ${s.value} tokens"></div>`).join('')
    : '<div style="width:100%;background:var(--border);"></div>';

  const legend = shown.map(s => `
    <div style="display:flex;align-items:center;gap:6px;font-size: var(--fs-xs);color:var(--text-muted);line-height:1.6;">
      <span style="width:8px;height:8px;border-radius:2px;background:${s.color};flex:0 0 auto;"></span>
      <span style="flex:1;">${s.label}</span>
      <span>${s.count} 条 · ${s.value}t</span>
    </div>`).join('');

  const pending = stats.pendingMerge || 0;
  const interval = stats.mergeInterval || 80;
  const mergeHint = pending > 0
    ? `<div style="font-size: var(--fs-xs);color:var(--text-muted);margin-top:6px;">待合并 ${pending} / ${interval} 条</div>`
    : '';

  return `
    <div style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg-surface);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span style="font-size: var(--fs-base);color:var(--text-secondary);">记忆占用</span>
        <span style="font-size: var(--fs-xs);color:var(--text-muted);">约 ${total.toLocaleString()} tokens</span>
      </div>
      <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px;">${bar}</div>
      <div style="margin-top:8px;">${legend}</div>
      ${mergeHint}
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-secondary" style="flex:1;justify-content:center;font-size: var(--fs-sm);" onclick="exportMemoryText()">导出记忆</button>
        <button class="btn btn-secondary" style="flex:1;justify-content:center;font-size: var(--fs-sm);" onclick="openMemoryImport()">粘贴记忆</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-secondary" style="flex:1;justify-content:center;font-size: var(--fs-sm);" onclick="saveToMemoryLibrary()">存到记忆库</button>
        <button class="btn btn-secondary" style="flex:1;justify-content:center;font-size: var(--fs-sm);" onclick="openMemoryLibraryPicker()">从记忆库载入</button>
      </div>
      <div style="font-size: var(--fs-xs);color:var(--text-muted);margin-top:6px;line-height:1.5;">
        token 为量级估算（中日韩 1 字 ≈ 1，其余 4 字符 ≈ 1），不是精确计费值。
      </div>
    </div>`;
}

        <button class="btn btn-secondary" type="button" id="panelAiBtn" style="white-space:nowrap;" onclick="aiRewriteChatPanel()">AI 帮我写</button>
      </div>
      ${fields}`,
    buttons: [
      { text: '取消', class: 'btn-secondary', onclick: 'UI.closeModal()' },
      { text: '保存', class: 'btn-primary', onclick: 'saveChatPanel()' },
    ],
  });
}

function saveChatPanel() {
  const panel = Panel.empty();
  for (const f of Panel.FIELDS) {
    const el = document.getElementById(`panelEdit-${f.key}`);
    if (el) panel[f.key] = String(el.value || '').trim();
  }
  conversation.panel = Panel.isEmpty(panel) ? undefined : panel;
  Storage.saveConversation(conversation);
  UI.closeModal();
  UI.showToast('面板已保存，下一轮生效', 'success');
}

function readChatPanelForm() {
  const panel = Panel.empty();
  for (const f of Panel.FIELDS) {
    const el = document.getElementById(`panelEdit-${f.key}`);
    if (el) panel[f.key] = String(el.value || '').trim();
  }
  return panel;
}

function writeChatPanelForm(panel) {
  for (const f of Panel.FIELDS) {
    const el = document.getElementById(`panelEdit-${f.key}`);
    if (el) el.value = String(panel?.[f.key] ?? '');
  }
}

async function aiRewriteChatPanel() {
  const desc = (document.getElementById('panelAiInput')?.value || '').trim();
  if (!desc) { UI.showToast('先写一句描述', 'error'); return; }
  const settings = Storage.getSettings();
  const apiProfileId = settings.defaultApiProfileId;
  if (!apiProfileId) { UI.showToast('请先配置 API', 'error'); return; }
  const btn = document.getElementById('panelAiBtn');
  const original = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '生成中…'; btn.disabled = true; }
  try {
    const { systemPrompt, messages } = Panel.buildAiRewriteMessages(desc, readChatPanelForm());
    const res = await API.sendChat({ apiProfileId, model: settings.defaultModel || '', systemPrompt, messages });
    if (!res.success) throw new Error(res.error || '请求失败');
    const parsed = Panel.parseAiRewrite(res.content || '');
    if (!parsed.ok) throw new Error(parsed.error);
    writeChatPanelForm(parsed.panel);
    UI.showToast('已生成，可自行修改后保存', 'success');
  } catch (e) {
    UI.showToast('生成失败：' + e.message, 'error');
  } finally {
    if (btn) { btn.textContent = original; btn.disabled = false; }
  }
}

/** 快捷指令栏：骰子 + 文本插入 + 硬核开关 */
function renderQuickReplyBar() {
  const bar = document.getElementById('quickReplyBar');
  if (!bar) return;
  const items = QuickReply.list();
  const rolled = (conversation?.pendingDice || []).length > 0;
  const hardcore = !!conversation?.hardcoreDice;

  let html = items.map(q => {
    if (q.type === 'dice') {
      return `<button class="qr-chip qr-dice"${rolled ? ' disabled' : ''} onclick="rollDice('${Utils.escapeHtml(q.payload)}')"
        title="${rolled ? '本回合已掷过' : '掷 ' + Utils.escapeHtml(q.payload)}">🎲 ${Utils.escapeHtml(q.label)}</button>`;
    }
    return `<button class="qr-chip" onclick="insertQuickText('${Utils.escapeHtml(q.id)}')">${Utils.escapeHtml(q.label)}</button>`;
  }).join('');

  html += `<button class="qr-chip ${hardcore ? 'qr-hardcore' : ''}" onclick="toggleHardcoreDice()"
    title="硬核模式：骰子结果不可更改，模型必须照此续写">硬核${hardcore ? ' 开' : ''}</button>`;
  html += `<button class="qr-chip qr-edit" onclick="openQuickReplyEditor()" title="编辑快捷指令">⚙</button>`;

  if (rolled) {
    const text = conversation.pendingDice.map(r => Utils.escapeHtml(Dice.formatRoll(r))).join(' · ');
    html += `<span style="flex:0 0 auto;font-size: var(--fs-xs);color:var(--text-muted);white-space:nowrap;">${text}</span>`;
  }
  bar.innerHTML = html;
}

function rollDice(spec) {
  if (!conversation) return;
  if ((conversation.pendingDice || []).length > 0) {
    UI.showToast('本回合已经掷过了', 'error');
    return;
  }
  const r = Dice.roll(spec);
  if (!r.ok) { UI.showToast(r.error, 'error'); return; }
  conversation.pendingDice = [r];
  Storage.saveConversation(conversation);
  renderQuickReplyBar();
  showDiceCheck(r);
}

/**
 * 掷骰后的戏剧化判定卡。
 * 判定用语刻意只描述"这一掷落在自己取值区间的哪一段"（上签/中签/下签 + 满值/最小值），
 * 不臆造 DC 成败——成败与否由模型结合属性与难度在正文里给出。
 */
function showDiceCheck(r) {
  const overlay = document.getElementById('diceCheckOverlay');
  if (!overlay || !r?.ok) return;

  const single = r.count === 1;
  const face = single ? r.rolls[0] : r.total;
  const ratio = single ? (face - 1) / Math.max(1, r.sides - 1) : 0.5;

  document.getElementById('diceCheckSpec').textContent = r.spec;
  document.getElementById('diceCheckNum').textContent = single ? face : r.total;

  // 判定横幅
  const banner = document.getElementById('diceCheckBanner');
  banner.className = 'check-result-banner';
  let label;
  if (single && face === r.sides) {
    label = '满 值 · 大 吉';
    banner.classList.add('result-badge-success');
  } else if (single && face === 1) {
    label = '最 小 值 · 大 凶';
    banner.classList.add('result-badge-fail');
  } else if (ratio >= 0.7) {
    label = '上 签';
    banner.classList.add('result-badge-success');
  } else if (ratio <= 0.3) {
    label = '下 签';
    banner.classList.add('result-badge-fail');
  } else {
    label = '中 签';
  }
  banner.textContent = label;

  // 计算过程：点数明细 + 修正值 = 总计
  const calc = document.getElementById('diceCheckCalc');
  const parts = [];
  if (single) {
    parts.push(`<span class="check-calc-part">${Utils.escapeHtml(r.spec)}</span>`);
  } else {
    parts.push(`<span class="check-calc-part">${r.rolls.join(' + ')}</span>`);
    if (r.modifier) {
      parts.push(`<span class="check-calc-eq">${r.modifier > 0 ? '+' : '−'}</span>`);
      parts.push(`<span class="check-calc-part">${Math.abs(r.modifier)}</span>`);
    }
    parts.push(`<span class="check-calc-eq">=</span>`);
  }
  parts.push(`<span class="check-calc-part check-calc-total">${r.total}</span>`);
  calc.innerHTML = parts.join('');

  const hint = document.getElementById('diceCheckHint');
  hint.textContent = conversation?.hardcoreDice
    ? '硬核模式：结果不可更改，模型将严格照此续写'
    : '结果已注入本回合，点击任意处关闭';

  overlay.classList.add('show');
}

function closeDiceCheck() {
  document.getElementById('diceCheckOverlay')?.classList.remove('show');
}

function toggleHardcoreDice() {
  if (!conversation) return;
  conversation.hardcoreDice = !conversation.hardcoreDice;
  Storage.saveConversation(conversation);
  renderQuickReplyBar();
  UI.showToast(conversation.hardcoreDice ? '硬核模式已开启：骰子结果不可更改' : '硬核模式已关闭', 'success');
}

function insertQuickText(id) {
  const item = QuickReply.list().find(q => q.id === id);
  if (!item) return;
  const ta = document.getElementById('inputTextarea');
  if (!ta) return;
  const text = item.payload || '';
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? ta.value.length;
  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
  ta.focus();
  const pos = start + text.length;
  try { ta.setSelectionRange(pos, pos); } catch {}
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

// 空态 CTA 用：把起步指令填入输入框并聚焦（不自动发送，交由用户确认后发出）
function quickFillInput(text) {
  const ta = document.getElementById('inputTextarea');
  if (!ta) return;
  ta.value = text;
  ta.focus();
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

        类型「骰子」的指令，其内容写成 <code>NdM</code>（如 1d20、2d6+1）；<br>

function updateQuickReply(id, field, value) {
  const list = QuickReply.list();
  const item = list.find(q => q.id === id);
  if (!item) return;
  item[field] = String(value || '').trim();
  QuickReply.save(list);
  renderQuickReplyBar();
}

function deleteQuickReply(id) {
  QuickReply.remove(id);
  openQuickReplyEditor();
  renderQuickReplyBar();
}

function addQuickReply() {
  const type = document.getElementById('qrNewType')?.value || 'dice';
  const label = (document.getElementById('qrNewLabel')?.value || '').trim();
  const payload = (document.getElementById('qrNewPayload')?.value || '').trim();
  if (!label || !payload) { UI.showToast('显示名和内容都要填', 'error'); return; }
  if (type === 'dice' && !Dice.parse(payload).ok) { UI.showToast(Dice.parse(payload).error, 'error'); return; }
  QuickReply.add({ label, type, payload });
  openQuickReplyEditor();
  renderQuickReplyBar();
}

function resetQuickReply() {
  QuickReply.reset();
  openQuickReplyEditor();
  renderQuickReplyBar();
}

/** 回合结束：清掉一次性的注入内容（骰子结果 / 只生效一次的作者注） */
function consumeTurnState() {
  let changed = false;
  if ((conversation.pendingDice || []).length > 0) {
    conversation.pendingDice = [];
    changed = true;
  }
  const note = conversation.writingNote;
  if (note && note.oneShot && String(note.text || '').trim()) {
    note.text = '';
    changed = true;
  }
  if (!changed) return;
  Storage.saveConversation(conversation);
  renderQuickReplyBar();
  if (summaryPanelOpen) renderSummaryPanel();
}

function renderSummaryPanel() {
  const container = document.getElementById('summaryContent');
  let html = '';

  // ── 作者注 / 上帝指令：走 @Depth 注入，直接作用于「当下」这一轮 ──
  const note = conversation.writingNote || {};
  const noteEnabled = note.enabled !== false;
  const noteText = note.text !== undefined ? note.text : (conversation.writingAdvice || '');
  const noteDepth = Number.isFinite(Number(note.depth)) ? Number(note.depth) : 1;
  html += `
    <details style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg-surface);" ${noteText ? 'open' : ''}>
      <summary style="cursor:pointer;font-size: var(--fs-base);color:var(--text-secondary);">
        作者注 · 上帝指令
        <span style="font-size: var(--fs-xs);color:var(--text-muted);margin-left:6px;">@Depth ${noteDepth}</span>
      </summary>
      <div style="margin-top:10px;">
        <label style="display:flex;align-items:center;gap:8px;font-size: var(--fs-sm);color:var(--text-muted);cursor:pointer;">
          <input type="checkbox" id="writingNoteEnabled" ${noteEnabled ? 'checked' : ''} onchange="onWritingNoteChange()" style="width:auto;">
          启用（每轮注入）
        </label>
        <textarea id="writingNoteText" rows="4" placeholder="例：这一节多写环境描写，节奏放慢，让对话留白。" onchange="onWritingNoteChange()" style="width:100%;margin-top:8px;font-size: var(--fs-base);">${Utils.escapeHtml(noteText)}</textarea>
        <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;">
          <label style="font-size: var(--fs-sm);color:var(--text-muted);">注入深度</label>
          <input type="number" min="0" step="1" id="writingNoteDepth" value="${noteDepth}" onchange="onWritingNoteChange()" style="width:70px;">
          <label style="display:flex;align-items:center;gap:6px;font-size: var(--fs-sm);color:var(--text-muted);cursor:pointer;">
            <input type="checkbox" id="writingNoteOneShot" ${note.oneShot ? 'checked' : ''} onchange="onWritingNoteChange()" style="width:auto;">
            只生效一次
          </label>
        </div>
        <div style="font-size: var(--fs-xs);color:var(--text-muted);margin-top:6px;line-height:1.5;">
          深度 1 = 紧贴最后一条消息之前（最贴近「当下」，推荐）；0 = 追加到最末尾。
        </div>
      </div>
    </details>`;

  // ── 记忆长度条：上下文到底被谁占了 ──
  html += renderMemoryBar();

  // 手动合并入口（网络波动错过自动合并时的兜底）
  const pendingCount = Summary.countUnmergedAbstracts(conversation);
  if (conversation.phase === 'rp') {
    // 诊断：RP 阶段若已有 AI 回复却一条摘要都没抓到，说明模型没有按格式输出 <details> 摘要块
    // （旧版解析正则过严也会导致这里为空）。明确提示，避免"记忆静默不工作"。
    const aiReplyCount = (conversation.messages || []).filter(m => m.role === 'assistant' && !m.hidden && (m.content || '').trim()).length;
    const abstractTotal = (conversation.messages || []).filter(m => m.role === 'assistant' && m.abstract).length;
    if (aiReplyCount > 0 && abstractTotal === 0) {
      html += `<div style="margin-bottom:12px;padding:10px;border:1px solid var(--cinnabar-dim);border-radius:8px;background:rgba(201,106,90,0.1);font-size: var(--fs-sm);line-height:1.6;color:var(--text-secondary);">
        <b style="color:var(--danger);">记忆未生效</b><br>
        已有 ${aiReplyCount} 条 AI 回复，但<strong>没有抓到任何摘要块</strong>。<br>
        逐层记忆依赖模型在正文末尾输出 <code>&lt;details&gt;&lt;summary&gt;Abstract&lt;/summary&gt;…&lt;/details&gt;</code>。<br>
        请检查当前预设是否包含「摘要格式」条目（<code>abstract_req</code>），或换用默认预设后重试。
      </div>`;
    }
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:12px;" onclick="checkBigSummaryTrigger(true)">立即合并摘要${pendingCount ? `（待合并 ${pendingCount} 条）` : ''}</button>`;
  }

  // Archive entries (L2 远期档案)
  const archiveEntries = conversation.summary?.archive || [];
  if (archiveEntries.length > 0) {
    html += '<div class="summary-abstracts-title">往事纪要 (Archive)</div>';
    for (const ar of archiveEntries) {
      html += `<div class="summary-abstract-block summary-merged">
        <span class="summary-abstract-code summary-sm-code">${ar.code}</span>
        <div class="summary-abstract-content">${Utils.escapeHtml(ar.content).replace(/\n/g, '<br>')}</div>
      </div>`;
    }
  }

  // Merged summaries (sm entries)
  const mergedSm = conversation.summary?.mergedSummaries || [];
  if (mergedSm.length > 0) {
    html += '<div class="summary-abstracts-title">Merged Summaries</div>';
    for (const sm of mergedSm) {
      html += `<div class="summary-abstract-block summary-merged">
        <span class="summary-abstract-code summary-sm-code">${sm.code}</span>
        <div class="summary-abstract-content">${Utils.escapeHtml(sm.content).replace(/\n/g, '<br>')}</div>
      </div>`;
    }
  }

  // Unmerged abstracts
  const abstracts = getAbstracts();
  const lastMergedIdx = conversation.summary?.lastMergedIdx || 0;
  let mergedAbCount = 0;
  for (let i = 0; i < lastMergedIdx; i++) {
    if ((conversation.messages[i] || {}).role === 'assistant' && (conversation.messages[i] || {}).abstract) mergedAbCount++;
  }
  const unmerged = abstracts.slice(mergedAbCount);
  if (unmerged.length > 0) {
    html += `<div class="summary-abstracts-title">Unmerged Abstracts (${unmerged.length})</div>`;
    for (const ab of unmerged) {
      html += `<div class="summary-abstract-block">
        <span class="summary-abstract-code">${ab.code}</span>
        <div class="summary-abstract-content">${Utils.escapeHtml(ab.content).replace(/\n/g, '<br>')}</div>
      </div>`;
    }
  }

  if (!html) {
    html = `<div class="summary-empty">
      <div class="icon" style="width:32px;height:32px;display:block;margin:0 auto 12px;">${Icons.book}</div>
      暂无摘要<br><span style="font-size: var(--fs-xs);opacity:0.7;">AI 每次回复都会生成一条摘要</span>
    </div>`;
  }

  container.innerHTML = html;
}
