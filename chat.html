function readMvuCharacterEditor() {
  const value = (id) => document.getElementById(id)?.value?.trim() || '';
  const affectionText = value('mvuCharAffection');
  const affectionNum = Number(affectionText);
  return {
    name: value('mvuCharName'),
    profile: value('mvuCharProfile'),
    outfit: value('mvuCharOutfit'),
    affection: Number.isFinite(affectionNum) ? affectionNum : affectionText,
    relation: value('mvuCharRelation'),
    personality: value('mvuCharPersonality'),
    attitude: value('mvuCharAttitude'),
    thoughts: value('mvuCharThoughts'),
    location: value('mvuCharLocation'),
  };
}

function saveMvuCharacterEditor() {
  const characters = ensureMvuCharactersField();
  if (!characters) return;
  const next = readMvuCharacterEditor();
  if (!next.name) {
    UI.showToast('请先填写角色姓名', 'info');
    return;
  }
  const beforeState = cloneMvuState();
  if (editingMvuCharacterIndex >= 0 && characters[editingMvuCharacterIndex]) {
    const previous = characters[editingMvuCharacterIndex] && typeof characters[editingMvuCharacterIndex] === 'object'
      ? characters[editingMvuCharacterIndex]
      : {};
    characters[editingMvuCharacterIndex] = { ...previous, ...next, id: previous.id || slugifyMvuCharacterId(next.name) };
  } else {
    characters.push({ ...getDefaultMvuCharacter(), ...next, id: slugifyMvuCharacterId(next.name) });
  }
  finishMvuCharacterChange('角色档案已保存', beforeState);
}

function deleteMvuCharacter() {
  const characters = ensureMvuCharactersField();
  if (!characters || editingMvuCharacterIndex < 0 || !characters[editingMvuCharacterIndex]) return;
  const beforeState = cloneMvuState();
  characters.splice(editingMvuCharacterIndex, 1);
  finishMvuCharacterChange('角色已删除', beforeState);
}

function finishMvuCharacterChange(message, beforeState = null) {
  editingMvuCharacterIndex = -1;
  markMvuFieldsChanged(['characters']);
  if (beforeState) recordMvuChanges(beforeState, ['characters'], 'manual');
  syncMvuHtmlWithState();
  Storage.saveConversation(conversation);
  closeMvuCharacterEditor();
  renderMvuSidebar();
  UI.showToast(message, 'success');
}

function closeMvuCharacterEditor() {
  document.getElementById('mvuCharacterEditOverlay')?.classList.remove('visible');
}

function slugifyMvuCharacterId(name) {
  const base = String(name || 'character').trim().toLowerCase()
    .replace(/\s+/g, '_')
    .replace(/[^\w\u4e00-\u9fa5-]/g, '')
    .slice(0, 24) || 'character';
  const existing = new Set((conversation?.mvu?.state?.characters || []).map(char => String(char?.id || '')));
  let id = base;
  let i = 2;
  while (existing.has(id)) id = `${base}_${i++}`;
  return id;
}

function jumpToMvuField(field) {
  closeMvuDetail();
  mvuViewMode = 'data';
  mvuSearchQuery = field || '';
  renderMvuSidebar();
}

function jumpToMvuFieldFromDetail() {
  jumpToMvuField(document.getElementById('mvuDetailOverlay')?.dataset.field || '');
}

// ============================================================
// Input Handling
// ============================================================
function handleInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
}

async function handleSend() {
  if (isStreaming) {
    stopStreaming();
    return;
  }

  const textarea = document.getElementById('inputTextarea');
  const text = textarea.value.trim();
  if (!text) return;

  // Validate API profile exists
  const settings = Storage.getSettings();
  const apiProfileId = settings.defaultApiProfileId;
  if (!apiProfileId) {
    UI.showToast('请先在设置中配置 API', 'error');
    return;
  }
  const profile = Storage.getApiProfile(apiProfileId);
  if (!profile) {
    UI.showToast('API 配置不存在，请检查设置', 'error');
    return;
  }

  // Clear input and options
  textarea.value = '';
  resetTextareaHeight();
  clearOptionsBar();
  // Temporarily remove init confirm bar during streaming (will re-show in onDone)
  const confirmBar = document.querySelector('.mvu-confirm-bar');
  if (confirmBar) confirmBar.remove();

  // User just sent a message, reset scroll state so we follow the new output
  userScrolledUp = false;

  // Push user message
  const userMsg = {
    id: Utils.generateId('msg'),
    role: 'user',
    content: text,
    timestamp: Date.now(),
    hidden: false,
  };
  if (editMvuMode) {
    editMvuMessages.push(userMsg);
  } else {
    conversation.messages.push(userMsg);
    Storage.saveConversation(conversation);
  }
  appendMessageElement(userMsg);

  // Stream AI response
  await streamAIResponse();
}

// ============================================================
// Stream Status Indicator
// ============================================================
function showStreamStatus(state, detail = '') {
  removeStreamStatus();
  const list = document.getElementById('messagesList');
  const el = document.createElement('div');
  el.className = `stream-status ${state}`;
  el.id = 'streamStatusIndicator';

  const labels = { connecting: '连接中...', streaming: '生成中', retrying: '重试中' };
  let label = labels[state] || state;
  if (detail) label += ' ' + detail;

  el.innerHTML = `<span class="status-dot"></span><span class="status-text">${label}</span><span class="status-timer" id="statusTimer"></span>`;
  list.appendChild(el);
  scrollToBottom(false);

  // Start elapsed timer
  streamStartTime = Date.now();
  if (streamStatusTimer) clearInterval(streamStatusTimer);
  streamStatusTimer = setInterval(updateStatusTimer, 1000);
}

function updateStreamStatusText(text) {
  const el = document.querySelector('#streamStatusIndicator .status-text');
  if (el) el.textContent = text;
}

function updateStatusTimer() {
  const el = document.getElementById('statusTimer');
  if (!el) return;
  const elapsed = Math.floor((Date.now() - streamStartTime) / 1000);
  el.textContent = elapsed + 's';
}

function removeStreamStatus() {
  const el = document.getElementById('streamStatusIndicator');
  if (el) el.remove();
  if (streamStatusTimer) { clearInterval(streamStatusTimer); streamStatusTimer = null; }
}

function finalizeStreamCleanup() {
  isStreaming = false;
  streamAborted = false;
  streamStopRequested = false;
  currentAbortController = null;
  updateSendButton();
  if (pendingMvuInit && conversation.phase === 'init') {
    showMvuInitConfirmation();
  }
}

function removeAiPlaceholderMessage(aiMsg) {
  if (editMvuMode) {
    editMvuMessages = editMvuMessages.filter(m => m.id !== aiMsg.id);
  } else {
    conversation.messages = conversation.messages.filter(m => m.id !== aiMsg.id);
    Storage.saveConversation(conversation);
  }
  const el = document.getElementById(`msg-${aiMsg.id}`);
  if (el) el.remove();
}

function handleEmptyAiResponse(aiMsg) {
  log('onDone with empty response, removing placeholder');
  cancelAiStreamingNotification();
  removeAiPlaceholderMessage(aiMsg);
  UI.showToast('AI 返回空响应', 'error');
  finalizeStreamCleanup();
}

function compactWorldBookPromptSnapshot(promptSnapshot) {
  if (!promptSnapshot) return null;
  const compactEntry = entry => ({
    uid: entry.uid,
    _matchKind: entry._matchKind,
    _activationMode: entry._activationMode,
    _pendingFirstMatchTurn: entry._pendingFirstMatchTurn,
  });
  return {
    activeWorldBookEntries: (promptSnapshot.activeWorldBookEntries || []).map(compactEntry),
    blockedWorldBookEntries: (promptSnapshot.blockedWorldBookEntries || []).map(compactEntry),
  };
}

function attachWorldBookSnapshotToAiMsg(aiMsg, promptSnapshot) {
  if (!aiMsg || editMvuMode) return;
  const snapshot = compactWorldBookPromptSnapshot(promptSnapshot);
  if (snapshot) aiMsg.worldBookPromptSnapshot = snapshot;
}

function commitWorldBookSnapshotForAiMsg(aiMsg) {
  if (!aiMsg || editMvuMode) return;
  const snapshot = aiMsg.worldBookPromptSnapshot || _lastBuiltPrompt;
  if (!snapshot) return;
  WorldBook.commitPromptSnapshot(conversation, snapshot);
  delete aiMsg.worldBookPromptSnapshot;
}

function applyCompletedAiResponse(aiMsg, fullText) {
  aiMsg.content = fullText;
  aiMsg.timestamp = Date.now();
  updateAssistantBubble(aiMsg.id, fullText, false);

  if (editMvuMode) {
    processEditMvuResponse(fullText);
  } else {
    const abstract = Summary.parseAbstract(fullText);
    if (abstract) aiMsg.abstract = abstract;

    const refineArr = MVU.parseRefine(fullText);
    if (refineArr && refineArr.length > 0) {
      const originalStory = Utils.extractStoryContent(fullText);
      const refinedStory = MVU.applyRefine(originalStory, refineArr);
      if (refinedStory !== originalStory) {
        fullText = fullText.replace(
          /(<story>)([\s\S]*?)(<\/story>)/,
          (m, open, content, close) => open + MVU.applyRefine(content, refineArr) + close
        );
        aiMsg.content = fullText;
        updateAssistantBubble(aiMsg.id, fullText, false);
        log('[Refine] Applied', refineArr.length, 'replacements');
      }
    }

    processMvuFromResponse(fullText, aiMsg);
    processWritingAdvice(fullText);
    commitWorldBookSnapshotForAiMsg(aiMsg);
    Storage.saveConversation(conversation);
    renderOptionsBar(fullText);
    if (summaryPanelOpen) renderSummaryPanel();
    checkBigSummaryTrigger();
    triggerAutoImageGen(fullText, aiMsg);
    lastFailedUserMsgId = null;
    removeRetryBar();
  }

  scrollToBottom(false);
}

function handleNativeStreamError(aiMsg, state) {
  removeStreamStatus();
  clearNativeStreamState(state.sessionId);
  clearNativeStreamTracking();
  removeAiPlaceholderMessage(aiMsg);

  const httpStatus = Number(state.httpStatus || 0);
  const rawError = state.error || 'Unknown error';
  const classified = API.classifyError(httpStatus, rawError);
  const errDetail = `[${classified.type}] ${rawError}${httpStatus ? ' (HTTP ' + httpStatus + ')' : ''}`;

  const lastUserMsg = [...conversation.messages].reverse().find(m => m.role === 'user');
  if (lastUserMsg) {
    lastFailedUserMsgId = lastUserMsg.id;
    showRetryBar(lastUserMsg.id, `${classified.userMessage} | ${errDetail}`);
  } else {
    UI.showToast(classified.userMessage || rawError, 'error');
  }

  Storage.saveConversation(conversation);
  finalizeStreamCleanup();
}

function handleNativeStreamCancelled(aiMsg, state) {
  // 先落盘再删流状态：state 文件（和 last_session_id 指针）是这次生成唯一的
  // 持久化副本，先删会让进程被杀时整段回复无法恢复。
  clearNativeStreamTracking();
  removeStreamStatus();
  aiMsg.content = Utils.cleanNullFlood(state.fullText || '');
  handleStreamStopped(aiMsg);
  clearNativeStreamState(state.sessionId);
}

function handleNativeStreamCompleted(aiMsg, state) {
  clearNativeStreamTracking();
  removeStreamStatus();
  const fullText = Utils.cleanNullFlood(state.fullText || '');
  if (!fullText.trim()) {
    handleEmptyAiResponse(aiMsg);
    clearNativeStreamState(state.sessionId);
    return;
  }
  applyCompletedAiResponse(aiMsg, fullText);
  // 本轮已成功生成 → 清掉「只生效一次」的作者注
  consumeTurnState();
  finalizeStreamCleanup();
  // 正文已经写进会话文件，这里才允许丢弃流状态
  clearNativeStreamState(state.sessionId);
}

function updateNativeStreamUi(aiMsg, state) {
  const fullText = Utils.cleanNullFlood(state.fullText || '');
  aiMsg.content = fullText;
  updateAssistantBubble(aiMsg.id, fullText, state.status !== 'completed');
  if (state.status === 'starting') {
    showStreamStatus('connecting');
  } else if (state.status === 'streaming') {
    showStreamStatus('streaming');
    updateStreamStatusText(`生成中 (${fullText.length}字)`);
  }
}

function pollNativeStreamState(aiMsg) {
  if (!nativeStreamSessionId) return;
  const state = getNativeStreamState(nativeStreamSessionId);
  if (!state) return;
  if (state.conversationId && conversation?.id && state.conversationId !== conversation.id) return;
  if (streamStopRequested && !['completed', 'cancelled', 'error'].includes(state.status)) return;

  if ((state.fullText || '') !== nativeStreamLastText || state.status === 'starting' || state.status === 'streaming') {
    nativeStreamLastText = state.fullText || '';
    updateNativeStreamUi(aiMsg, state);
  }

  if (state.status === 'completed') {
    handleNativeStreamCompleted(aiMsg, state);
  } else if (state.status === 'cancelled') {
    handleNativeStreamCancelled(aiMsg, state);
  } else if (state.status === 'error') {
    handleNativeStreamError(aiMsg, state);
  }
}

function startNativeStreamPolling(aiMsg) {
  clearNativeStreamPolling();
  nativeStreamAiMsgId = aiMsg.id;
  nativeStreamLastText = '';
  pollNativeStreamState(aiMsg);
  nativeStreamPollTimer = setInterval(() => pollNativeStreamState(aiMsg), 500);
}

function resumeNativeStreamIfNeeded() {
  if (!canUseNativeBackgroundStreaming()) return;
  let state = null;
  try {
    const activeRaw = window.AndroidBridge?.getActiveNativeAiStream?.();
    const latestRaw = !activeRaw ? window.AndroidBridge?.getLatestNativeAiStream?.() : null;
    state = activeRaw ? JSON.parse(activeRaw) : (latestRaw ? JSON.parse(latestRaw) : null);
  } catch (e) {
    log('resumeNativeStreamIfNeeded failed:', e);
    return;
  }

  if (!state || state.conversationId !== conversation?.id || !state.sessionId) return;

  let aiMsg = findMessage(state.aiMsgId);
  if (!aiMsg) {
    aiMsg = {
      id: state.aiMsgId || Utils.generateId('msg'),
      role: 'assistant',
      content: state.fullText || '',
      timestamp: Date.now(),
      hidden: false,
      abstract: null,
    };
    conversation.messages.push(aiMsg);
    appendMessageElement(aiMsg);
    Storage.saveConversation(conversation);
  }

  nativeStreamSessionId = state.sessionId;
  setNativeAbortController(state.sessionId);
  isStreaming = !['completed', 'cancelled', 'error'].includes(state.status);
  streamAborted = false;
  updateSendButton();

  if (state.status === 'completed') {
    handleNativeStreamCompleted(aiMsg, state);
  } else if (state.status === 'cancelled') {
    handleNativeStreamCancelled(aiMsg, state);
  } else if (state.status === 'error') {
    handleNativeStreamError(aiMsg, state);
  } else {
    startNativeStreamPolling(aiMsg);
  }
}

async function streamAIResponseNative(retryAttempt = 0) {
  isStreaming = true;
  streamAborted = false;
  streamStopRequested = false;
  clearNativeStreamTracking();
  updateSendButton();

  const settings = Storage.getSettings();
  _lastBuiltPrompt = PromptBuilder.buildMessages(conversation);
  const { systemPrompt, messages } = _lastBuiltPrompt;
  const activePreset = _lastBuiltPrompt.preset || null;

  const aiMsg = {
    id: Utils.generateId('msg'),
    role: 'assistant',
    content: '',
    timestamp: Date.now(),
    hidden: false,
    abstract: null,
  };
  attachWorldBookSnapshotToAiMsg(aiMsg, _lastBuiltPrompt);
  conversation.messages.push(aiMsg);
  appendMessageElement(aiMsg);
  Storage.saveConversation(conversation);

  showStreamStatus('connecting');

  const apiProfileId = settings.defaultApiProfileId;
  const model = settings.defaultModel;
  const apiProfile = Storage.getApiProfile(apiProfileId);
  if (!apiProfile) {
    removeAiPlaceholderMessage(aiMsg);
    removeStreamStatus();
    UI.showToast('API 配置不存在', 'error');
    finalizeStreamCleanup();
    return;
  }

  const payload = {
    sessionId: Utils.generateId('nstream'),
    conversationId: conversation.id,
    conversationTitle: getNativeNotificationTitle(),
    aiMsgId: aiMsg.id,
    apiProfile,
    model,
    systemPrompt,
    messages,
    // provider 映射在 JS 侧算好，原生侧只负责"照单执行"（避免两端映射表不同步）
    requestParams: API.resolveRequestParams(apiProfile, model, API._maxTokensForModel(model), activePreset),
  };

  try {
    nativeStreamSessionId = window.AndroidBridge.startNativeAiStream(JSON.stringify(payload));
  } catch (e) {
    log('startNativeAiStream failed:', e);
    nativeStreamSessionId = null;
  }

  if (!nativeStreamSessionId) {
    removeAiPlaceholderMessage(aiMsg);
    removeStreamStatus();
    UI.showToast('启动后台生成失败', 'error');
    finalizeStreamCleanup();
    return streamAIResponse(retryAttempt, false);
  }

  setNativeAbortController(nativeStreamSessionId);
  startNativeStreamPolling(aiMsg);
}

// ============================================================
// Streaming
// ============================================================
async function streamAIResponse(retryAttempt = 0, allowNativeStreaming = true) {
  if (allowNativeStreaming && canUseNativeBackgroundStreaming()) {
    return streamAIResponseNative(retryAttempt);
  }
  isStreaming = true;
  streamAborted = false;
  streamStopRequested = false;
  if (retryAttempt === 0) nativeAiNotificationStarted = false;
  updateSendButton();

  const MAX_AUTO_RETRIES = 2;
  const settings = Storage.getSettings();

  // Build prompt BEFORE adding AI placeholder
  let systemPrompt, messages;
  let activePreset = null;
  if (editMvuMode) {
    ({ systemPrompt, messages } = buildEditMvuPrompt());
  } else {
    _lastBuiltPrompt = PromptBuilder.buildMessages(conversation);
    ({ systemPrompt, messages } = _lastBuiltPrompt);
    activePreset = _lastBuiltPrompt.preset || null;
  }

  // Create AI placeholder message
  const aiMsg = {
    id: Utils.generateId('msg'),
    role: 'assistant',
    content: '',
    timestamp: Date.now(),
    hidden: false,
    abstract: null,
  };
  if (!editMvuMode) attachWorldBookSnapshotToAiMsg(aiMsg, _lastBuiltPrompt);
  if (editMvuMode) {
    editMvuMessages.push(aiMsg);
  } else {
    conversation.messages.push(aiMsg);
  }
  appendMessageElement(aiMsg);

  // Show connecting status
  showStreamStatus('connecting');

  const apiProfileId = settings.defaultApiProfileId;
  const model = settings.defaultModel;
  log('streamAIResponse', { phase: conversation.phase, apiProfileId, model, attempt: retryAttempt });

  currentAbortController = API.streamChat({
    apiProfileId,
    model,
    systemPrompt,
    messages,
    preset: activePreset,

    onStatus(status) {
      if (status === 'connecting') {
        showStreamStatus('connecting');
      } else if (status === 'streaming') {
        showStreamStatus('streaming');
      }
    },

    onChunk(chunk, fullText) {
      if (streamAborted) return;
      if (fullText && fullText.trim()) {
        notifyAiStreamingStart();
      }
      aiMsg.content = fullText;
      updateAssistantBubble(aiMsg.id, fullText, true);
      updateStreamStatusText(`生成中 (${fullText.length}字)`);
    },

    onDone(fullText, usage) {
      removeStreamStatus();

      if (streamAborted && !fullText) {
        fullText = aiMsg.content;
      }

      // Guard: if response is completely empty, treat as error
      if (!fullText || !fullText.trim()) {
        log('onDone with empty response, removing placeholder');
        notifyAiStreamingFailed();
        if (editMvuMode) {
          editMvuMessages = editMvuMessages.filter(m => m.id !== aiMsg.id);
        } else {
          conversation.messages = conversation.messages.filter(m => m.id !== aiMsg.id);
          Storage.saveConversation(conversation);
        }
        const el = document.getElementById(`msg-${aiMsg.id}`);
        if (el) el.remove();
        UI.showToast('AI 返回空响应', 'error');
        isStreaming = false;
        streamAborted = false;
        streamStopRequested = false;
        currentAbortController = null;
        updateSendButton();
        return;
      }

      aiMsg.content = fullText;
      aiMsg.timestamp = Date.now();
      // 本轮已成功生成 → 清掉「只生效一次」的作者注
      consumeTurnState();
      updateAssistantBubble(aiMsg.id, fullText, false);

      if (editMvuMode) {
        processEditMvuResponse(fullText);
      } else {
        const abstract = Summary.parseAbstract(fullText);
        if (abstract) aiMsg.abstract = abstract;

        // Apply refine: store refined story content back into the message
        const refineArr = MVU.parseRefine(fullText);
        if (refineArr && refineArr.length > 0) {
          // Replace the <story> content in fullText with refined version
          const originalStory = Utils.extractStoryContent(fullText);
          const refinedStory = MVU.applyRefine(originalStory, refineArr);
          if (refinedStory !== originalStory) {
            // Rebuild fullText with refined story (replace first <story> block)
            fullText = fullText.replace(
              /(<story>)([\s\S]*?)(<\/story>)/,
              (m, open, content, close) => open + MVU.applyRefine(content, refineArr) + close
            );
            aiMsg.content = fullText;
            updateAssistantBubble(aiMsg.id, fullText, false);
            log('[Refine] Applied', refineArr.length, 'replacements');
          }
        }

        processMvuFromResponse(fullText, aiMsg);
        processWritingAdvice(fullText);
        commitWorldBookSnapshotForAiMsg(aiMsg);
        Storage.saveConversation(conversation);
        renderOptionsBar(fullText);
        if (summaryPanelOpen) renderSummaryPanel();
        checkBigSummaryTrigger();
        triggerAutoImageGen(fullText, aiMsg);

        // Clear failed state since we succeeded
        lastFailedUserMsgId = null;
        removeRetryBar();
      }

      notifyAiStreamingDone(fullText);

      isStreaming = false;
      streamAborted = false;
      streamStopRequested = false;
      currentAbortController = null;
      updateSendButton();
      // Re-show init confirmation if draft is ready
      if (pendingMvuInit && conversation.phase === 'init') {
        showMvuInitConfirmation();
      }
      scrollToBottom(false);
    },

    onError(error, httpStatus) {
      removeStreamStatus();

      if (streamAborted || error === 'AbortError') {
        // User-initiated stop: keep partial content
        handleStreamStopped(aiMsg);
        return;
      }

      // If we already received substantial content, treat as successful completion
      if (aiMsg.content && aiMsg.content.length > 50) {
        log('Error after content received, treating as done:', error);
        handleStreamStopped(aiMsg);
        return;
      }

      const classified = API.classifyError(httpStatus || 0, error);
      const errDetail = `[${classified.type}] ${error}${httpStatus ? ' (HTTP ' + httpStatus + ')' : ''}`;
      log('API Error:', errDetail, classified, { apiProfileId, model, phase: conversation.phase, attempt: retryAttempt });

      // Remove the failed AI placeholder
      if (editMvuMode) {
        editMvuMessages = editMvuMessages.filter(m => m.id !== aiMsg.id);
      } else {
        conversation.messages = conversation.messages.filter(m => m.id !== aiMsg.id);
      }
      const aiEl = document.getElementById(`msg-${aiMsg.id}`);
      if (aiEl) aiEl.remove();

      // Auto-retry for retryable errors
      if (classified.retryable && retryAttempt < MAX_AUTO_RETRIES) {
        const delay = Math.min(1000 * Math.pow(2, retryAttempt), 8000) * (0.5 + Math.random() * 0.5);
        showStreamStatus('retrying', `${errDetail} — (${retryAttempt + 1}/${MAX_AUTO_RETRIES}) ${Math.round(delay / 1000)}s 后重试...`);
        setTimeout(() => {
          removeStreamStatus();
          streamAIResponse(retryAttempt + 1);
        }, delay);
        return;
      }

      // All retries exhausted or non-retryable: show error retry bar
      notifyAiStreamingFailed();
      const lastUserMsg = [...conversation.messages].reverse().find(m => m.role === 'user');
      if (lastUserMsg) {
        lastFailedUserMsgId = lastUserMsg.id;
        showRetryBar(lastUserMsg.id, `${classified.userMessage} | ${errDetail}`);
      } else {
        UI.showToast(classified.userMessage, 'error');
      }

      Storage.saveConversation(conversation);
      isStreaming = false;
      streamAborted = false;
      streamStopRequested = false;
      currentAbortController = null;
      updateSendButton();
    },
  });
}

function handleStreamStopped(aiMsg) {
  cancelAiStreamingNotification();
  try {
    if (aiMsg.content) {
      // Keep partial content
      updateAssistantBubble(aiMsg.id, aiMsg.content, false);
      // Add interrupted marker
      const wrapper = document.getElementById(`msg-${aiMsg.id}`);
      if (wrapper) {
        const contentEl = wrapper.querySelector('.message-content');
        if (contentEl && !contentEl.querySelector('.stream-interrupted')) {
          contentEl.insertAdjacentHTML('beforeend', '<span class="stream-interrupted">— 已停止</span>');
        }
      }
      if (editMvuMode) {
        processEditMvuResponse(aiMsg.content);
      } else {
        aiMsg.abstract = Summary.parseAbstract(aiMsg.content);
        processMvuFromResponse(aiMsg.content, aiMsg);
        processWritingAdvice(aiMsg.content);
        commitWorldBookSnapshotForAiMsg(aiMsg);
        Storage.saveConversation(conversation);
      }
    } else {
      // No content, remove placeholder
      if (editMvuMode) {
        editMvuMessages = editMvuMessages.filter(m => m.id !== aiMsg.id);
      } else {
        conversation.messages = conversation.messages.filter(m => m.id !== aiMsg.id);
        Storage.saveConversation(conversation);
      }
      const el = document.getElementById(`msg-${aiMsg.id}`);
      if (el) el.remove();
    }
  } catch (e) {
    console.error('handleStreamStopped error:', e);
  }

  // Cleanup always runs
  isStreaming = false;
  streamAborted = false;
  streamStopRequested = false;
  currentAbortController = null;
  updateSendButton();
  // Re-show init confirmation if draft is ready
  if (pendingMvuInit && conversation.phase === 'init') {
    showMvuInitConfirmation();
  }
  UI.showToast('已停止生成', 'info');
}

function stopStreaming() {
  if (!currentAbortController || streamStopRequested) return;

  streamAborted = true;
  streamStopRequested = true;
  cancelAiStreamingNotification();
  currentAbortController.abort();
  removeStreamStatus();
  updateSendButton();
}

// ============================================================
// Error Retry Bar
// ============================================================
function showRetryBar(userMsgId, errorMsg) {
  removeRetryBar();
  const msgEl = document.getElementById(`msg-${userMsgId}`);
  if (!msgEl) return;

  const bar = document.createElement('div');
  bar.className = 'error-retry-bar';
  bar.id = 'errorRetryBar';
  bar.innerHTML = `
    <span class="error-msg"><strong>发送失败</strong>: ${Utils.escapeHtml(errorMsg)}</span>
    <button class="btn btn-primary" onclick="retryLastMessage()">重试</button>
    <button class="btn btn-secondary" onclick="editAndRetry('${userMsgId}')">编辑后重试</button>
    <button class="btn btn-ghost" onclick="deleteFailedMessage('${userMsgId}')">删除</button>
  `;
  msgEl.after(bar);
  scrollToBottom(false);
}

function removeRetryBar() {
  const bar = document.getElementById('errorRetryBar');
  if (bar) bar.remove();
}

function retryLastMessage() {
  if (isStreaming) return;
  removeRetryBar();
  lastFailedUserMsgId = null;
  streamAIResponse(0);
}

function editAndRetry(userMsgId) {
  const msg = findMessage(userMsgId);
  if (!msg) return;

  editingMsgId = userMsgId;
  const overlay = document.getElementById('editOverlay');
  const textarea = document.getElementById('editTextarea');
  textarea.value = msg.content;
  overlay.classList.add('visible');

  // Override confirm to do retry after edit
  window._editRetryMode = true;
  setTimeout(() => textarea.focus(), 100);
}

function deleteFailedMessage(userMsgId) {
  removeRetryBar();
  lastFailedUserMsgId = null;

  conversation.messages = conversation.messages.filter(m => m.id !== userMsgId);
  Storage.saveConversation(conversation);
  const el = document.getElementById(`msg-${userMsgId}`);
  if (el) {
    el.style.transition = 'opacity 0.3s ease';
    el.style.opacity = '0';
    setTimeout(() => {
      el.remove();
      if (conversation.messages.length === 0) renderAllMessages();
    }, 300);
  }
}

// ============================================================
// Offline Detection
// ============================================================
function setupOfflineDetection() {
  const banner = document.getElementById('offlineBanner');
  const updateStatus = () => {
    if (!navigator.onLine) {
      banner.classList.add('visible');
      document.getElementById('inputArea').classList.add('disabled');
    } else {
      banner.classList.remove('visible');
      document.getElementById('inputArea').classList.remove('disabled');
    }
  };
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
  updateStatus();
}

// ============================================================
// Writing Advice Processing
// ============================================================
function processWritingAdvice(text) {
  const adviceData = MVU.parseWritingAdvice(text);
  if (!adviceData) return;

  const current = conversation.writingAdvice || '';

  if (adviceData.op === 'set') {
    conversation.writingAdvice = adviceData.content || '';
  } else if (adviceData.op === 'add' && Array.isArray(adviceData.items)) {
    const lines = current ? current.split('\n').filter(l => l.trim()) : [];
    lines.push(...adviceData.items.map(i => '- ' + i));
    conversation.writingAdvice = lines.join('\n');
  } else if (adviceData.op === 'remove' && Array.isArray(adviceData.items)) {
    let updated = current;
    for (const item of adviceData.items) {
      updated = updated.split('\n').filter(l => !l.includes(item)).join('\n');
    }
    conversation.writingAdvice = updated.trim();
  }

  UI.showToast('写作建议已更新', 'success');
}

// ============================================================
// MVU Processing
// ============================================================
function processMvuFromResponse(text, aiMsg) {
  if (conversation.phase === 'init') {
    const initData = MVU.parseInit(text);
    const updateData = MVU.parseMvuUpdate(text);
    const storySetting = MVU.parseStorySetting(text);

    let changed = false;

    if (initData) {
      // Full init (first time or full replacement)
      initData._storySetting = storySetting || (pendingMvuInit?._storySetting) || '';
      // If still no story_setting, scan earlier messages
      if (!initData._storySetting) {
        for (let k = conversation.messages.length - 1; k >= 0; k--) {
          const m = conversation.messages[k];
          if (m.role !== 'assistant' || !m.content) continue;
          const ss = MVU.parseStorySetting(m.content);
          if (ss) { initData._storySetting = ss; break; }
        }
      }
      pendingMvuInit = initData;
      changed = true;
    } else if (updateData && pendingMvuInit) {
      // Incremental update — key-level merge for schema/templates, atomic for html/css
      MVU.applyMvuUpdate(pendingMvuInit, updateData);
      changed = true;
    }

    // Story setting: full replacement or incremental patch
    if (storySetting) {
      if (pendingMvuInit) {
        pendingMvuInit._storySetting = storySetting;
        changed = true;
      }
    } else {
      const storyPatch = MVU.parseStorySettingPatch(text);
      if (storyPatch && pendingMvuInit) {
        const existing = pendingMvuInit._storySetting || conversation.storySetting || '';
        pendingMvuInit._storySetting = MVU.applyStorySettingPatch(existing, storyPatch);
        changed = true;
        log('processMvuFromResponse: story_setting_patch applied', storyPatch.length, 'ops');
      }
    }

    if (changed && pendingMvuInit) {
      previewMvuInit();
      showMvuInitConfirmation();
      if (!pendingMvuInit._storySetting) {
        UI.showToast('注意：AI 未输出故事设定，建议要求补充', 'error');
      }
    }
  } else if (conversation.phase === 'rp') {
    // Check for mvu patch in response
    const patchData = MVU.parsePatch(text);
    if (patchData && conversation.mvu?.schema) {
      if (patchData.analysis) {
        log('[MVU Analysis]', patchData.analysis);
      }
      const container = document.getElementById('mvuContent');
      const beforeState = cloneMvuState();
      const touchedFields = [];
      const patchList = Array.isArray(patchData) ? patchData : (patchData.patches || []);
      for (const p of patchList) {
        if (p.op === 'addFromTemplate') {
          const tpl = conversation.mvu.templates?.[p.template];
          if (tpl?.fields) touchedFields.push(...Object.keys(tpl.fields).map(k => `${p.id}_${k}`));
        } else if (p.op === 'removeFromTemplate') {
          touchedFields.push(p.id);
        } else if (p.path) {
          touchedFields.push(String(p.path).replace(/^\//, '').split('/')[0]);
        }
      }
      // 只保留真实存在的字段，其余计入 unknownFields 供诊断使用
      const { changedFields, unknownFields } = partitionMvuFields(touchedFields);
      // Handle template ops first (addFromTemplate / removeFromTemplate)
      MVU.applyTemplateOps(conversation.mvu, patchData, container);
      // Then apply regular patches
      conversation.mvu.state = MVU.applyPatch(conversation.mvu.state, patchData, conversation.mvu.schema);
      const normalized = normalizeMvuStructure(changedFields.length ? changedFields : ['characters', 'main_quests', 'side_quests']);
      markMvuFieldsChanged(changedFields);
      recordMvuChanges(beforeState, changedFields, 'ai');
      // Snapshot state onto the AI message for revert
      if (aiMsg) {
        aiMsg.mvuSnapshot = JSON.parse(JSON.stringify(conversation.mvu.state));
        aiMsg.templateSnapshot = JSON.parse(JSON.stringify(conversation.mvu.templateInstances || []));
      }
      Storage.saveConversation(conversation);
      // 诊断：块找到了但没有任何「可见字段」真正变化——同样要可见。
      // 注意 applyPatch 会为未知路径创建字段（state 确实变了），但 schema 里没有的字段
      // 渲染不出来，用户看到的仍是"状态栏没动"，所以这里以 schema 字段为准。
      const appliedChanges = conversation.mvu._lastChanges || [];
      const schemaFields = new Set(Object.keys(conversation.mvu.schema || {}));
      const visibleChanges = appliedChanges.filter(c => schemaFields.has(c.field));
      if (!visibleChanges.length) {
        let message;
        if (!patchList.length) {
          message = 'AI 输出的状态栏指令为空';
        } else if (!changedFields.length && unknownFields.length) {
          message = `AI 写了 ${patchList.length} 条指令，但字段名不存在：${unknownFields.slice(0, 4).map(f => '/' + f).join('、')}${unknownFields.length > 4 ? ' 等' : ''}`;
        } else if (!changedFields.length) {
          message = `AI 输出了 ${patchList.length} 条状态栏指令，但没有一条匹配到现有字段`;
        } else {
          message = `AI 更新了 ${changedFields.join('、')}，但数值与当前状态相同，状态栏无变化`;
        }
        setMvuDiagnostic({
          kind: 'no-effect',
          blockCount: 1,
          patchCount: patchList.length,
          message,
          aiMsgId: aiMsg?.id || null,
        });
      } else {
        clearMvuDiagnostic();
      }
      // Update DOM
      if (mvuViewMode === 'data') {
        MVU.renderDataView(container, conversation.mvu, { query: mvuSearchQuery });
      } else if (mvuViewMode === 'changes') {
        MVU.renderChangesView(container, conversation.mvu);
      } else if (mvuViewMode === 'game') {
        MVUGameRenderer.render(container, conversation.mvu, { query: mvuSearchQuery });
        MVUInteraction.enhance(container, conversation.mvu);
        if (changedFields.length) flashMvuStreaming();
      } else if (normalized.changed) {
        renderMvuSidebar();
      } else {
        MVU.updateDOM(container, conversation.mvu.state, conversation.mvu.schema, conversation.mvu._changedFields || [], conversation.mvu._lastChanges || []);
        MVUInteraction.enhance(container, conversation.mvu);
        if (changedFields.length) flashMvuStreaming();
      }
      renderMvuToolbar();
    } else if (conversation.mvu?.schema) {
      // 没有可用的 mvu 块 —— 区分「AI 本轮确实没写」与「写了但解析失败」。
      // 历史实现在这里完全静默，用户只看到状态栏不动，无法判断原因。
      const diag = MVU.diagnoseMvuResponse(text);
      if (diag.found && !diag.parseOk) {
        setMvuDiagnostic({
          kind: 'parse-failed',
          blockCount: diag.blockCount,
          message: `检测到 ${diag.blockCount} 个状态栏代码块，但 JSON 解析失败（常见原因：尾逗号、中文引号、未转义引号、流式截断）`,
          aiMsgId: aiMsg?.id || null,
        });
      } else {
        setMvuDiagnostic({
          kind: 'no-block',
          blockCount: 0,
          message: '本轮 AI 未输出状态栏更新块',
          aiMsgId: aiMsg?.id || null,
        });
      }
      renderMvuToolbar();
      if (mvuViewMode === 'changes') {
        MVU.renderChangesView(document.getElementById('mvuContent'), conversation.mvu);
      } else if (mvuViewMode === 'game') {
        // 无块/解析失败也刷新游戏视图：字段计数等仍可能因编辑模式等来源变化
        MVUGameRenderer.render(document.getElementById('mvuContent'), conversation.mvu, { query: mvuSearchQuery });
        MVUInteraction.enhance(document.getElementById('mvuContent'), conversation.mvu);
      }
    }
  }
}

function showMvuInitConfirmation() {
  // Remove any existing confirm bar
  const existing = document.querySelector('.mvu-confirm-bar');
  if (existing) existing.remove();

  if (!pendingMvuInit || isStreaming) return;

  const list = document.getElementById('messagesList');
  const bar = document.createElement('div');
  bar.className = 'mvu-confirm-bar';
  const hasStory = pendingMvuInit?._storySetting ? true : false;
  bar.innerHTML = `
    <p>AI 已生成${hasStory ? '故事设定 + ' : ''}状态栏${!hasStory ? ' <span style="color:var(--danger);">(缺少故事设定)</span>' : ''}。确认后进入RP，或继续修改。</p>
    <button class="btn btn-secondary" onclick="rejectMvuInit()">放弃草稿</button>
    <button class="btn btn-primary" onclick="confirmMvuInit()">确认开始RP</button>
  `;
  list.appendChild(bar);
  scrollToBottom(false);
}

function previewMvuInit() {
  if (!pendingMvuInit) return;

  // Build temporary MVU data for preview
  // schema/templates 必须深拷贝：applyInitInstances 会把 <id>_<字段> 注册进 schema，
  // 若与 pendingMvuInit 共享引用，这些字段会提前泄漏到确认阶段——
  // 届时 migrateMvuExpandableCollections 在 instances 尚未应用时就据其合成 characters，
  // 角色名会被误猜成档案首句（「青云宗内门弟子」而非「林清雪」）。
  const tempMvu = {
    schema: JSON.parse(JSON.stringify(pendingMvuInit.schema || {})),
    state: {},
    html: pendingMvuInit.html,
    css: pendingMvuInit.css,
    templates: JSON.parse(JSON.stringify(pendingMvuInit.templates || {})),
    templateInstances: [],
  };

  // Initialize state from schema
  if (tempMvu.schema) {
    for (const [key, def] of Object.entries(tempMvu.schema)) {
      if (def.value !== undefined) {
        tempMvu.state[key] = def.value;
      } else if (def.type === 'list') {
        tempMvu.state[key] = [];
      } else if (def.type === 'number' || def.type === 'bar') {
        tempMvu.state[key] = def.max || 100;
      } else {
        tempMvu.state[key] = '';
      }
    }
  }

  // Instantiate declared opening characters (data layer only; render() below re-creates panels)
  MVU.applyInitInstances(tempMvu, pendingMvuInit.instances);

  // Render preview in sidebar
  const container = document.getElementById('mvuContent');
  MVU.render(container, tempMvu);

  // Open sidebar if closed
  if (!sidebarOpen) toggleSidebar();

  UI.showToast('预览模式 - 确认后生效', 'info');
}

function confirmMvuInit() {
  if (!pendingMvuInit) return;

  // Apply MVU init
  conversation.mvu = {
    schema: pendingMvuInit.schema,
    state: {},
    html: pendingMvuInit.html,
    css: pendingMvuInit.css,
    templates: pendingMvuInit.templates || {},
    templateInstances: [],
  };

  // Initialize state from schema defaults
  if (pendingMvuInit.schema) {
    for (const [key, def] of Object.entries(pendingMvuInit.schema)) {
      if (def.value !== undefined) {
        conversation.mvu.state[key] = def.value;
      } else if (def.type === 'list') {
        conversation.mvu.state[key] = [];
      } else if (def.type === 'number' || def.type === 'bar') {
        conversation.mvu.state[key] = def.max || 100;
      } else {
        conversation.mvu.state[key] = '';
      }
    }
  }
  normalizeMvuStructure(['characters', 'main_quests', 'side_quests']);

  // Instantiate declared opening characters — registers their schema fields, state values
  // and templateInstances records; renderMvuSidebar() below re-creates the panels from those
  MVU.applyInitInstances(conversation.mvu, pendingMvuInit.instances);

  // Save story setting
  if (pendingMvuInit._storySetting) {
    conversation.storySetting = pendingMvuInit._storySetting;
  }

  // Ensure summary
  if (!conversation.summary) {
    const settings = Storage.getSettings();
    conversation.summary = { mergedSummaries: [], archive: [], lastMergedIdx: 0, interval: settings.summaryInterval || 80 };
  }

  // Clear init-phase messages
  conversation.messages = [];

  // Switch to RP phase
  conversation.phase = 'rp';
  Storage.saveConversation(conversation);

  // Update UI
  renderPhaseBadge();
  renderMvuSidebar();
  renderAllMessages();

  // Open sidebar to show new panel
  if (!sidebarOpen) toggleSidebar();

  // Remove confirmation bar
  const bar = document.querySelector('.mvu-confirm-bar');
  if (bar) bar.remove();

  pendingMvuInit = null;
  UI.showToast('状态面板已初始化，故事正式开始！', 'success');
}

function rejectMvuInit() {
  pendingMvuInit = null;

  // Reset sidebar preview
  renderMvuSidebar();

  const bar = document.querySelector('.mvu-confirm-bar');
  if (bar) bar.remove();
  UI.showToast('已取消，请继续讨论设定', 'info');
}

// ============================================================
// Big Summary
// ============================================================
let _isMerging = false;
async function checkBigSummaryTrigger(force = false) {
  if (_isMerging) return;
  const needMerge = force ? Summary.countUnmergedAbstracts(conversation) > 0 : Summary.shouldTriggerMerge(conversation);
  const needPromote = Summary.shouldPromote(conversation);
  if (!needMerge && !needPromote) {
    if (force) UI.showToast('暂无待合并的摘要', 'info');
    return;
  }

  _isMerging = true;
  try {
    // 1) L0→L1：ab 合并为 sm
    if (needMerge) {
      const unmergedCount = Summary.countUnmergedAbstracts(conversation);
      log('Triggering summary merge, unmerged abstracts:', unmergedCount);
      UI.showToast(`正在合并 ${unmergedCount} 条摘要...`, 'info');
      const result = await Summary.generateMergeSummary(conversation);
      if (result) {
        conversation.summary = {
          ...conversation.summary,
          mergedSummaries: result.mergedSummaries,
          lastMergedIdx: result.lastMergedIdx,
        };
        Storage.saveConversation(conversation);
        renderSummaryPanel();
        UI.showToast(`摘要已合并为 ${result.mergedSummaries.length} 条总结`, 'success');
      } else if (force) {
        UI.showToast('摘要合并失败，可稍后重试', 'error');
      }
    }

    // 2) L1→L2：sm 超过近期上限时，最旧一批按剧情弧归档（遗忘曲线晋升）
    if (Summary.shouldPromote(conversation)) {
      log('Triggering archive promotion, sm count:', conversation.summary.mergedSummaries.length);
      UI.showToast('正在归档较早的摘要...', 'info');
      const promo = await Summary.generateArchivePromotion(conversation);
      if (promo) {
        conversation.summary = {
          ...conversation.summary,
          archive: promo.archive,
          mergedSummaries: promo.mergedSummaries,
        };
        Storage.saveConversation(conversation);
        renderSummaryPanel();
        UI.showToast(`已归档为 ${promo.archive.length} 条往事纪要`, 'success');
      }
    }

    // 3) L2 自身溢出（超长局才会发生）：对最旧档案再归档
    if ((conversation.summary?.archive || []).length > Summary.ARCHIVE_LIMIT) {
      const compacted = await Summary.generateArchiveCompaction(conversation);
      if (compacted) {
        conversation.summary = { ...conversation.summary, archive: compacted };
        Storage.saveConversation(conversation);
        renderSummaryPanel();
      }
    }
  } catch (e) {
    log('Summary merge failed:', e);
    UI.showToast('摘要合并失败', 'error');
  } finally {
    _isMerging = false;
  }
}

// ============================================================
// Message Actions
// ============================================================
function findMessage(msgId) {
  return conversation.messages.find(m => m.id === msgId);
}

function copyToClipboard(text) {
  // Modern API (works on HTTPS / localhost)
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  return Promise.resolve(false);
}

function copyFallback(text) {
  // Fallback for non-secure contexts (HTTP on mobile)
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  ta.remove();
  return ok;
}

function copyMessage(msgId) {
  const msg = findMessage(msgId);
  if (!msg) return;

  const textToCopy = msg.role === 'assistant'
    ? Summary.cleanAbstract(MVU.cleanText(msg.content))
    : msg.content;

  const onSuccess = () => {
    UI.showToast('已复制到剪贴板', 'success');
    const el = document.getElementById(`msg-${msgId}`);
    if (el) {
      el.classList.add('copy-flash');
      setTimeout(() => el.classList.remove('copy-flash'), 600);
    }
  };

  copyToClipboard(textToCopy).then(ok => {
    if (ok) { onSuccess(); return; }
    // Fallback
    if (copyFallback(textToCopy)) { onSuccess(); }
    else { UI.showToast('复制失败', 'error'); }
  });
}

function retryMessage(msgId) {
  if (isStreaming) return;
  const msgIdx = conversation.messages.findIndex(m => m.id === msgId);
  if (msgIdx < 0) return;
  const msg = conversation.messages[msgIdx];
  if (msg.role !== 'user') return;

  // Check what's after this user message
  const afterMessages = conversation.messages.slice(msgIdx + 1);

  if (afterMessages.length === 0) {
    // Nothing after — just re-send
    streamAIResponse();
  } else if (afterMessages.length === 1 && afterMessages[0].role === 'assistant') {
    // Single AI reply right after — remove it and re-send
    const aiMsg = afterMessages[0];
    const el = document.getElementById(`msg-${aiMsg.id}`);
    if (el) el.remove();
    conversation.messages = conversation.messages.filter(m => m.id !== aiMsg.id);
    Storage.saveConversation(conversation);
    streamAIResponse();
  } else {
    // Multiple turns after — revert to this user message then re-send
    conversation.messages = conversation.messages.slice(0, msgIdx + 1);

    // Restore MVU snapshot from nearest earlier AI message
    let snapshot = null;
    for (let i = msgIdx; i >= 0; i--) {
      const m = conversation.messages[i];
      if (m.role === 'assistant' && m.mvuSnapshot) {
        snapshot = { state: m.mvuSnapshot, templates: m.templateSnapshot || [] };
        break;
      }
    }
    if (snapshot) {
      conversation.mvu.state = JSON.parse(JSON.stringify(snapshot.state));
      conversation.mvu.templateInstances = JSON.parse(JSON.stringify(snapshot.templates));
    }

    if (conversation.summary && conversation.summary.lastMergedIdx > conversation.messages.length) {
      conversation.summary.lastMergedIdx = conversation.messages.length;
    }

    Storage.saveConversation(conversation);
    renderAllMessages();
    renderMvuSidebar();
    streamAIResponse();
  }
}

function editMessage(msgId) {
  const msg = findMessage(msgId);
  if (!msg) return;

  editingMsgId = msgId;
  const overlay = document.getElementById('editOverlay');
  const textarea = document.getElementById('editTextarea');
  textarea.value = msg.content;

  // Show "保存并重新发送" only for user messages
  const resendBtn = document.getElementById('editResendBtn');
  resendBtn.style.display = msg.role === 'user' ? '' : 'none';

  overlay.classList.add('visible');
  setTimeout(() => textarea.focus(), 100);
}

function closeEdit() {
  editingMsgId = null;
  window._editRetryMode = false;
  document.getElementById('editOverlay').classList.remove('visible');
}

function confirmEdit() {
  if (!editingMsgId) return;
  const msg = findMessage(editingMsgId);
  if (!msg) return;

  const textarea = document.getElementById('editTextarea');
  const newContent = textarea.value.trim();
  if (!newContent) return;

  msg.content = newContent;

  // Re-parse abstract if assistant message
  if (msg.role === 'assistant') {
    msg.abstract = Summary.parseAbstract(newContent);
  }

  Storage.saveConversation(conversation);

  // Re-render the specific message
  const el = document.getElementById(`msg-${editingMsgId}`);
  if (el) {
    const idx = conversation.messages.indexOf(msg);
    const newEl = createMessageElement(msg, idx);
    el.replaceWith(newEl);
  }

  const wasRetryMode = window._editRetryMode;
  window._editRetryMode = false;

  closeEdit();

  if (wasRetryMode) {
    // After editing a failed message, retry sending
    removeRetryBar();
    lastFailedUserMsgId = null;
    UI.showToast('消息已修改，正在重新发送', 'info');
    streamAIResponse(0);
  } else {
    UI.showToast('消息已更新', 'success');
  }
}

function confirmEditAndResend() {
  if (!editingMsgId) return;
  const msg = findMessage(editingMsgId);
  if (!msg || msg.role !== 'user') return;

  const textarea = document.getElementById('editTextarea');
  const newContent = textarea.value.trim();
  if (!newContent) return;

  // Save the edit
  msg.content = newContent;
  Storage.saveConversation(conversation);

  // Re-render the message
  const el = document.getElementById(`msg-${editingMsgId}`);
  if (el) {
    const idx = conversation.messages.indexOf(msg);
    const newEl = createMessageElement(msg, idx);
    el.replaceWith(newEl);
  }

  const savedMsgId = editingMsgId;
  closeEdit();

  // Trigger retry on the edited message
  retryMessage(savedMsgId);
}

function toggleHideMessage(msgId) {
  const msg = findMessage(msgId);
  if (!msg) return;

  msg.hidden = !msg.hidden;
  Storage.saveConversation(conversation);

  // Re-render the message
  const el = document.getElementById(`msg-${msgId}`);
  if (el) {
    const idx = conversation.messages.indexOf(msg);
    const newEl = createMessageElement(msg, idx);
    el.replaceWith(newEl);
  }

  UI.showToast(msg.hidden ? '消息已隐藏（不会发送给AI）' : '消息已恢复', 'info');
}

function deleteMessage(msgId) {
  UI.showConfirm({
    title: '删除消息',
    message: '确定要删除这条消息吗？此操作无法撤销。',
    onConfirm: () => {
      conversation.messages = conversation.messages.filter(m => m.id !== msgId);
      Storage.saveConversation(conversation);

      const el = document.getElementById(`msg-${msgId}`);
      if (el) {
        el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => {
          el.remove();
          // Show empty state if no messages left
          if (conversation.messages.length === 0) {
            renderAllMessages();
          }
        }, 300);
      }
    },
  });
}

// ============================================================
// Restart & Revert
// ============================================================

function restartGame() {
  if (conversation.phase !== 'rp') return;
  UI.showConfirm({
    title: '重新开始',
    message: '确定要重新开始吗？所有对话和状态将重置，但世界设定和状态栏结构保留。',
    onConfirm: () => {
      // Reset state from schema defaults
      if (conversation.mvu?.schema) {
        const newState = {};
        for (const [key, def] of Object.entries(conversation.mvu.schema)) {
          if (def.value !== undefined) {
            newState[key] = JSON.parse(JSON.stringify(def.value));
          } else if (def.type === 'list') {
            newState[key] = [];
          } else if (def.type === 'number' || def.type === 'bar') {
            newState[key] = def.max || 100;
          } else {
            newState[key] = '';
          }
        }
        conversation.mvu.state = newState;
      }
      // Clear template instances
      conversation.mvu.templateInstances = [];
      // Clear messages
      conversation.messages = [];
      // Reset summary
      const settings = Storage.getSettings();
      conversation.summary = { mergedSummaries: [], archive: [], lastMergedIdx: 0, interval: settings.summaryInterval || 80 };
      // Save
      Storage.saveConversation(conversation);
      // Refresh UI
      renderAllMessages();
      renderMvuSidebar();
      // Clear options bar
      const optBar = document.getElementById('optionsBar');
      if (optBar) { optBar.style.display = 'none'; optBar.innerHTML = ''; }
      _optionActions = [];
      UI.showToast('游戏已重新开始', 'success');
    },
  });
}

function revertToMessage(msgId) {
  const targetIdx = conversation.messages.findIndex(m => m.id === msgId);
  if (targetIdx < 0) return;

  UI.showConfirm({
    title: '回档',
    message: '确定要回档到这条消息吗？之后的所有对话将被删除。',
    onConfirm: () => {
      // Truncate messages
      conversation.messages = conversation.messages.slice(0, targetIdx + 1);

      // Find the target or nearest earlier AI message with mvuSnapshot
      let snapshot = null;
      for (let i = targetIdx; i >= 0; i--) {
        const m = conversation.messages[i];
        if (m.role === 'assistant' && m.mvuSnapshot) {
          snapshot = { state: m.mvuSnapshot, templates: m.templateSnapshot || [] };
          break;
        }
      }

      if (snapshot) {
        conversation.mvu.state = JSON.parse(JSON.stringify(snapshot.state));
        conversation.mvu.templateInstances = JSON.parse(JSON.stringify(snapshot.templates));
      } else if (conversation.mvu?.schema) {
        // No snapshot found (old messages) — reset to schema defaults
        const newState = {};
        for (const [key, def] of Object.entries(conversation.mvu.schema)) {
          if (def.value !== undefined) {
            newState[key] = JSON.parse(JSON.stringify(def.value));
          } else if (def.type === 'list') {
            newState[key] = [];
          } else if (def.type === 'number' || def.type === 'bar') {
            newState[key] = def.max || 100;
          } else {
            newState[key] = '';
          }
        }
        conversation.mvu.state = newState;
        conversation.mvu.templateInstances = [];
      }

      // Trim summary: lastMergedIdx should not exceed message count
      if (conversation.summary) {
        if (conversation.summary.lastMergedIdx > conversation.messages.length) {
          conversation.summary.lastMergedIdx = conversation.messages.length;
        }
        // Remove merged summaries that reference messages beyond the new range
        // (mergedSummaries are cumulative, keep them all — they summarize earlier content)
      }

      // Save + refresh
      Storage.saveConversation(conversation);
      renderAllMessages();
      renderMvuSidebar();
      // Restore options from last AI message after revert
      const lastAi = [...conversation.messages].reverse().find(m => m.role === 'assistant');
      if (lastAi) { renderOptionsBar(lastAi.content); } else {
        const optBar = document.getElementById('optionsBar');
        if (optBar) { optBar.style.display = 'none'; optBar.innerHTML = ''; }
        _optionActions = [];
      }
      UI.showToast('已回档', 'success');
    },
  });
}

function exportConversation() {
  if (!conversation) return;
  const json = JSON.stringify(conversation, null, 2);
  const name = (conversation.name || '对话').replace(/[\/\\:*?"<>|]/g, '_');

// ============================================================
// iOS Keyboard Dismiss Fix
// ============================================================
function setupIOSKeyboardFix() {
  if (!window.visualViewport) return;
  let prevHeight = window.visualViewport.height;
  window.visualViewport.addEventListener('resize', () => {
    const h = window.visualViewport.height;
    // Keyboard dismissed: viewport grew significantly
    if (h - prevHeight > 50) {
      window.scrollTo(0, 0);
    }
    prevHeight = h;
  });
}

// ============================================================
// Scroll Management
// ============================================================
function setupScrollDetection() {
  const area = document.getElementById('messagesArea');
  area.addEventListener('scroll', () => {
    const threshold = 80;
    const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < threshold;
    userScrolledUp = !atBottom;

    const btn = document.getElementById('scrollBottomBtn');
    if (userScrolledUp) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  });

  // Mobile: tap message bubble to toggle action buttons
  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  if (isMobile) {
    area.addEventListener('click', (e) => {
      // Recognize both user (.message-bubble) and AI (.message-content) messages
      const target = e.target.closest('.message-bubble') || e.target.closest('.message-content');
      const msg = target && target.closest('.message');
      if (!msg) {
        // Tapped outside any message: hide all
        area.querySelectorAll('.message.show-actions').forEach(el => el.classList.remove('show-actions'));
        return;
      }
      // Toggle this message, hide others
      const wasShown = msg.classList.contains('show-actions');
      area.querySelectorAll('.message.show-actions').forEach(el => el.classList.remove('show-actions'));
      if (!wasShown) msg.classList.add('show-actions');
    });
  }
}

function scrollToBottom(force) {
  if (!force && userScrolledUp) return;

  const area = document.getElementById('messagesArea');
  requestAnimationFrame(() => {
    area.scrollTop = area.scrollHeight;
  });
}

// ============================================================
// Prompt Debug Inspector
// ============================================================
function showPromptDebug() {
  // Toggle off if already open
  const existing = document.getElementById('debugOverlay');
  if (existing) { closeDebug(); return; }

  if (!conversation) return;
  const promptSnapshot = _lastBuiltPrompt || PromptBuilder.buildMessages(conversation);
  const {
    systemPrompt,
    messages,
    activeWorldBookEntries = [],
    blockedWorldBookEntries = [],
    candidateWorldBookEntries = [],
    worldBookScanSources = [],
    worldBookSettings = {},
  } = promptSnapshot;
  const THRESHOLD = 200;

  function msgBlock(role, content, idx) {
    const labels = { assistant: 'AI', user: 'USER', system: 'SYS' };
    const roleLabel = labels[role] || role.toUpperCase();
    const roleClass = role === 'assistant' ? 'ai' : role === 'system' ? 'sys' : 'user';
    const len = content.length;
    const isLong = len > THRESHOLD;
    const firstLine = content.split('\n')[0].substring(0, 60);
    const preview = firstLine + (firstLine.length < content.split('\n')[0].length ? '...' : '');
    const idxStr = idx !== null ? '#' + idx + ' · ' : '';

    return `<div class="debug-message">
      <div class="debug-msg-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <span class="debug-role debug-role-${roleClass}">${roleLabel}</span>
        <span class="debug-msg-meta">${idxStr}${len}字</span>
        <span class="debug-preview">${Utils.escapeHtml(preview)}</span>
      </div>
      <pre class="debug-pre${isLong ? ' collapsed' : ''}">${Utils.escapeHtml(content)}</pre>
    </div>`;
  }

  function worldBookBlock(entry, idx, blocked = false, badge = '') {
    const title = entry.comment || entry.title || ('条目 ' + entry.uid);
    const keys = [...(entry._matchedPrimaryKeys || []), ...(entry._matchedSecondaryKeys || [])].slice(0, 8);
    const sources = (entry._matchSources || []).map(source => source.label || source.kind).filter(Boolean).slice(0, 4);
    const mode = getWorldBookActivationLabel(entry);
    const reason = blocked ? getWorldBookBlockedReason(entry) : mode;
    const detail = blocked && entry._blockedDetail ? ` · ${entry._blockedDetail}` : '';
    const scoreText = Number(entry._matchScore) ? ` · 命中分 ${entry._matchScore}` : '';
    const groupText = entry.group ? ` · 组 ${entry.group}` : '';
    const meta = `${reason}${detail} · 预算#${entry._budgetRank || '-'} · ${entry.position || 'after_char'} · Order ${Number(entry.order) || 0}${scoreText}${groupText} · ${(entry.content || '').length}字`;
    const tags = [
      ...keys.map(key => `关键词 ${key}`),
      ...sources.map(source => `来源 ${source}`),
      entry.scanDepth ? `条目扫描深度 ${entry.scanDepth}` : '',
      entry.sticky ? `黏滞 ${entry.sticky}` : '',
      entry.cooldown ? `冷却 ${entry.cooldown}` : '',
      entry.delay ? `延迟 ${entry.delay}` : '',
      Number(entry.probability) < 100 ? `概率 ${entry.probability}%` : '',
    ].map(tag => `<span class="debug-badge">${Utils.escapeHtml(tag)}</span>`).join('');
    const roleBadge = badge || (blocked ? 'BLOCKED' : 'WB');
    return `<div class="debug-message">
      <div class="debug-msg-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <span class="debug-role debug-role-${blocked ? 'sys' : 'user'}">${roleBadge}</span>
        <span class="debug-msg-meta">#${idx + 1} · ${Utils.escapeHtml(meta)}</span>
        <span class="debug-preview">${Utils.escapeHtml(title)}</span>
      </div>
      <pre class="debug-pre collapsed">${tags ? tags + '\n\n' : ''}${Utils.escapeHtml(entry.content || '')}</pre>
    </div>`;
  }

  function worldBookSection() {
    const activeHtml = activeWorldBookEntries.map((entry, i) => worldBookBlock(entry, i)).join('');
    const blockedHtml = blockedWorldBookEntries.map((entry, i) => worldBookBlock(entry, i, true)).join('');
    const candidateHtml = candidateWorldBookEntries
      .filter(entry => !activeWorldBookEntries.some(active => active.uid === entry.uid))
      .slice(0, 24)
      .map((entry, i) => worldBookBlock(entry, i, false, 'CAND'))
      .join('');
    const scanHtml = worldBookScanSources.length
      ? worldBookScanSources.map((source, i) => {
          const content = String(source.content || '');
          return `<div class="debug-message">
            <div class="debug-msg-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
              <span class="debug-role debug-role-sys">SCAN</span>
              <span class="debug-msg-meta">#${i + 1} · ${Utils.escapeHtml(source.label || source.kind)} · ${content.length}字</span>
              <span class="debug-preview">${Utils.escapeHtml(content.replace(/\s+/g, ' ').slice(0, 70))}</span>
            </div>
            <pre class="debug-pre collapsed">${Utils.escapeHtml(content)}</pre>
          </div>`;
        }).join('')
      : '<div class="debug-message"><pre class="debug-pre">本轮没有可扫描文本。</pre></div>';
    const scanModeText = worldBookSettings.scanMode === 'latest_user' ? '仅本轮输入' : '最近聊天';
    const settingsText = `扫描模式 ${scanModeText} · 扫描深度 ${worldBookSettings.scanDepth || 0} · 状态栏扫描 ${worldBookSettings.includeMvuState ? '开启' : '关闭'} · 故事设定扫描 ${worldBookSettings.includeStorySetting ? '开启' : '关闭'} · 递归 ${worldBookSettings.recursiveScan ? '开启' : '关闭'}`;
    if (!activeHtml && !blockedHtml) {
      return `<div class="debug-section">
        <div class="debug-section-header"><span>世界书</span><span class="debug-badge">0条注入</span></div>
        <div class="debug-message"><pre class="debug-pre">${Utils.escapeHtml(settingsText)}</pre></div>
        <div class="debug-section-header"><span>扫描源</span><span class="debug-badge">${worldBookScanSources.length}项</span></div>
        ${scanHtml}
        ${candidateHtml ? `<div class="debug-section-header"><span>候选命中</span><span class="debug-badge">${candidateWorldBookEntries.length}条</span></div>${candidateHtml}` : ''}
        <div class="debug-message"><pre class="debug-pre">本轮没有世界书条目进入 Prompt。普通条目需要关键词命中；只有常驻条目会固定注入。</pre></div>
      </div>`;
    }
    return `<div class="debug-section">
      <div class="debug-section-header"><span>世界书</span><span class="debug-badge">${activeWorldBookEntries.length}条注入 / ${blockedWorldBookEntries.length}条拦截</span></div>
      <div class="debug-message"><pre class="debug-pre">${Utils.escapeHtml(settingsText)}</pre></div>
      <div class="debug-section-header"><span>扫描源</span><span class="debug-badge">${worldBookScanSources.length}项</span></div>
      ${scanHtml}
      ${activeHtml}
      ${candidateHtml ? `<div class="debug-section-header"><span>候选未注入</span><span class="debug-badge">${candidateWorldBookEntries.length - activeWorldBookEntries.length}条</span></div>${candidateHtml}` : ''}
      ${blockedHtml ? `<div class="debug-section-header"><span>规则/预算拦截</span><span class="debug-badge">${blockedWorldBookEntries.length}条</span></div>${blockedHtml}` : ''}
    </div>`;
  }

  const overlay = document.createElement('div');
  overlay.id = 'debugOverlay';
  overlay.className = 'debug-overlay';

  overlay.innerHTML = `<div class="debug-modal">
    <div class="debug-header">
      <span class="debug-title">Prompt Inspector</span>
      <button class="btn-icon" onclick="closeDebug()" style="width:28px;height:28px;">
        <span class="icon" style="width:16px;height:16px;">${Icons.close}</span>
      </button>
    </div>
    <div class="debug-body">
      ${worldBookSection()}
      <div class="debug-section">
        <div class="debug-section-header"><span>System Prompt</span><span class="debug-badge">${systemPrompt.length}字</span></div>
        ${msgBlock('system', systemPrompt, null)}
      </div>
      <div class="debug-section">
        <div class="debug-section-header"><span>Messages</span><span class="debug-badge">${messages.length}条</span></div>
        ${messages.map((m, i) => msgBlock(m.role, m.content, i + 1)).join('')}
      </div>
    </div>
  </div>`;

  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('visible'));
}

function closeDebug() {
  const el = document.getElementById('debugOverlay');
  if (el) {
    el.classList.remove('visible');
    setTimeout(() => el.remove(), 200);
  }
}

function enterEditMvuMode() {
  if (editMvuMode || isStreaming) return;
  if (conversation.phase !== 'rp' || !conversation.mvu) {
    UI.showToast('只有在 RP 阶段才能编辑状态栏', 'info');
    return;
  }

  editMvuMode = true;
  editMvuMessages = [];
  editMvuBackup = {
    mvu: JSON.parse(JSON.stringify(conversation.mvu)),
    storySetting: conversation.storySetting || '',
  };

  // Close sidebars
  closeAnySidebar();

  // Clear message display
  const list = document.getElementById('messagesList');
  list.innerHTML = `
    <div class="empty-state">
      <div class="empty-quill">${Icons.edit}</div>
      <span class="empty-ornament"></span>
      <div class="empty-title">状态栏编辑模式</div>
      <p class="empty-desc">描述你想对状态栏或故事设定做的修改，可以和 AI 进行多轮对话。</p>
    </div>`;

  // Show edit mode bar
  document.getElementById('editModeBar').style.display = 'flex';

  // Update input placeholder
  document.getElementById('inputTextarea').placeholder = '描述你想修改的内容...';

  // Update phase badge
  const badge = document.getElementById('phaseBadge');
  badge.textContent = 'EDIT';
  badge.className = 'phase-badge init';

  // Open sidebar to show live preview
  if (!sidebarOpen) toggleSidebar();

  // Hide options bar
  clearOptionsBar();

  log('enterEditMvuMode', { mvuKeys: Object.keys(conversation.mvu.state || {}) });
}

function exitEditMvuMode(apply) {
  if (!editMvuMode) return;
  if (isStreaming) {
    UI.showToast('Please wait for AI to finish', 'info');
    return;
  }

  if (apply) {
    // Keep current mvu state (already updated via processEditMvuResponse)
    Storage.saveConversation(conversation);
    UI.showToast('Changes applied', 'success');
    log('exitEditMvuMode: applied', { schema: !!conversation.mvu.schema });
  } else {
    // Rollback from backup
    if (editMvuBackup) {
      conversation.mvu = editMvuBackup.mvu;
      conversation.storySetting = editMvuBackup.storySetting;
      Storage.saveConversation(conversation);
    }
    UI.showToast('Changes discarded', 'info');
    log('exitEditMvuMode: discarded');
  }

  editMvuMode = false;
  editMvuMessages = [];
  editMvuBackup = null;

  // Hide edit mode bar
  document.getElementById('editModeBar').style.display = 'none';

  // Restore input placeholder
  document.getElementById('inputTextarea').placeholder = '写下你的行动...';

  // Restore phase badge
  renderPhaseBadge();

  // Re-render main chat and sidebar
  renderAllMessages();
  renderMvuSidebar();

  // Restore last options if any
  const lastAiMsg = [...conversation.messages].reverse().find(m => m.role === 'assistant');
  if (lastAiMsg) renderOptionsBar(lastAiMsg.content);
}

function buildEditMvuPrompt() {
  const settings = Storage.getSettings();

  // Build system prompt: edit instructions + current data
  let systemPrompt = `你是"小克"，用户专属的互动小说创作搭档。

---
【当前阶段：状态栏/背景编辑模式】
当前游戏已暂停，玩家提出了状态栏或背景设定的修改请求。

你需要根据玩家的需要对状态栏结构和/或故事设定进行更新。
- 不要随意修改目前变量的值，除非玩家明确要求
- 可以修改的内容包括：schema字段定义、HTML模板、CSS样式、templates模板定义、故事设定
- 回复中用自然语言解释你做了什么修改

如果需要修改状态栏，请输出：
\`\`\`json:mvu_update
{ "schema": {...}, "state": {...}, "html": "...", "css": "...", "templates": {...}, "patches": [...] }
\`\`\`
其中只包含需要修改的字段，不需要修改的可以省略。
如果只是修改已有变量的当前值，优先输出 state 或 patches；如果修改布局/样式才输出 html/css。

状态栏结构同步规则（必须遵守）：
- 新增、删除、重命名、重组字段时，必须同时更新 schema/state/html，必要时更新 css
- 新字段必须在 html 中用 data-field、data-field-list 或 data-field-bar 绑定，不能只写入 state
- 不要把 templates、templateInstances、schema、html、css 等内部字段展示到美化视图

- 角色必须统一写入 characters 数组；不要再创建 guangu_profile、tangyouyou_profile 这类独立角色字段
- HTML 角色区必须使用 data-field-list="characters"，让系统自动渲染所有角色卡片，不要只写死某一个角色面板
- 同一核心区只能存在一个：角色档案、主线任务、支线任务、物品/技能区都不要重复创建
- 不要写死角色、任务、物品列表的正文内容；展示内容必须来自 state 绑定
- 美化视图要保持精美布局和点击详情交互，不要输出“新增同步”“自动同步”等调试区块
- 美化视图必须有明确题材视觉载体和布局骨架，不要只换配色。可选载体示例：玉简/命盘/符箓、手账/课程表、赛博终端/HUD、案卷/证物袋、末日求生手册、宫廷奏折、都市App、奇幻羊皮书。

templates（模板）用于RP阶段动态添加新角色/NPC等。定义格式：
"模板名": {
  "fields": { "字段名": { "type": "类型", "label": "显示名", "max": 100 } },
  "html": "面板HTML片段，用 \${id} 和 \${name} 占位，根元素加 data-tpl-id=\\"\${id}\\"，字段用 data-field=\\"\${id}_字段名\\" 绑定",
  "container": "面板插入容器的CSS选择器",
  "tabContainer": "Tab按钮栏的CSS选择器（设置后系统自动创建Tab按钮和切换）"
}
HTML中需放置对应容器元素，如 <div class="mvu-tabs" id="xxx-tabs"></div> 和 <div id="xxx-panels"></div>。

如果需要修改故事设定，可以选择全量替换或增量更新：

方式1 - 全量替换（适合大改）：
\`\`\`text:story_setting
完整的新故事设定内容
\`\`\`

方式2 - 增量更新（推荐，适合局部修改）：
\`\`\`json:story_setting_patch
[
  {"op": "replace", "section": "章节标题", "content": "新的章节内容"},
  {"op": "append", "content": "追加到末尾的新内容"},
  {"op": "delete", "section": "要删除的章节标题"}
]
\`\`\`
其中 section 对应故事设定中的 ## 或 ### 标题。优先使用增量更新以节省输出。`;

  // Append current MVU data
  systemPrompt += '\n\n---\n【当前状态栏数据】\n';
  if (conversation.mvu) {
    systemPrompt += 'Schema:\n```json\n' + JSON.stringify(conversation.mvu.schema, null, 2) + '\n```\n\n';
    systemPrompt += 'State:\n```json\n' + JSON.stringify(conversation.mvu.state, null, 2) + '\n```\n\n';
    if (conversation.mvu.templates && Object.keys(conversation.mvu.templates).length > 0) {
      systemPrompt += 'Templates:\n```json\n' + JSON.stringify(conversation.mvu.templates, null, 2) + '\n```\n\n';
    }
    systemPrompt += 'HTML:\n```html\n' + (conversation.mvu.html || '') + '\n```\n\n';
    systemPrompt += 'CSS:\n```css\n' + (conversation.mvu.css || '') + '\n```\n';
  }

  if (conversation.storySetting) {
    systemPrompt += '\n---\n【当前故事设定】\n' + conversation.storySetting + '\n';
  }

  // Build messages: clean code blocks from previous AI messages
  const messages = [];
  for (const msg of editMvuMessages) {
    if (msg.role === 'assistant') {
      // Clean code blocks from previous AI messages to save context
      let cleaned = msg.content;
      cleaned = cleaned.replace(/```json:mvu_update\s*\n[\s\S]*?\n```/g, '[mvu_update applied]');
      cleaned = cleaned.replace(/```text:story_setting\s*\n[\s\S]*?\n```/g, '[story_setting applied]');
      cleaned = cleaned.replace(/```json:story_setting_patch\s*\n[\s\S]*?\n```/g, '[story_setting_patch applied]');
      messages.push({ role: 'assistant', content: cleaned });
    } else {
      messages.push({ role: msg.role, content: msg.content });
    }
  }

  log('buildEditMvuPrompt', { systemLen: systemPrompt.length, msgCount: messages.length });
  return { systemPrompt, messages };
}

function processEditMvuResponse(text) {
  if (!text || !conversation.mvu) return;

  let changed = false;
  let shouldWarnMvuBinding = false;
  let bindingCheckFields = [];

  // Parse mvu_update
  const updateData = MVU.parseMvuUpdate(text);
  if (updateData) {
    const beforeState = cloneMvuState();
    const changedFields = [];
    if (updateData.schema) {
      // Merge into existing schema (AI only sends modified fields)
      for (const [key, def] of Object.entries(updateData.schema)) {
        conversation.mvu.schema[key] = def;
        changedFields.push(key);
        // Initialize state only for genuinely new fields
        if (conversation.mvu.state[key] === undefined) {
          if (def.value !== undefined) {
            conversation.mvu.state[key] = def.value;
          } else if (def.type === 'list') {
            conversation.mvu.state[key] = [];
          } else if (def.type === 'number' || def.type === 'bar') {
            conversation.mvu.state[key] = def.max || 100;
          } else {
            conversation.mvu.state[key] = '';
          }
        }
      }
    }
    if (updateData.state) {
      for (const [key, value] of Object.entries(updateData.state)) {
        conversation.mvu.state[key] = value;
        changedFields.push(key);
      }
    }
    if (Array.isArray(updateData.patches)) {
      conversation.mvu.state = MVU.applyPatch(conversation.mvu.state, { patches: updateData.patches }, conversation.mvu.schema);
      const touched = [];
      for (const p of updateData.patches) {
        if (p.path) touched.push(String(p.path).replace(/^\//, '').split('/')[0]);
      }
      changedFields.push(...partitionMvuFields(touched).changedFields);
    }
    if (updateData.html) conversation.mvu.html = updateData.html;
    if (updateData.css) conversation.mvu.css = updateData.css;
    if (updateData.templates) {
      if (!conversation.mvu.templates) conversation.mvu.templates = {};
      Object.assign(conversation.mvu.templates, updateData.templates);
    }
    const normalized = normalizeMvuStructure(changedFields.length ? changedFields : ['characters', 'main_quests', 'side_quests']);
    if (normalized.repaired.length) log('processEditMvuResponse: repaired visual bindings', normalized.repaired);
    shouldWarnMvuBinding = changedFields.length > 0;
    bindingCheckFields = changedFields;
    if (changedFields.length) markMvuFieldsChanged(changedFields);
    recordMvuChanges(beforeState, changedFields, 'edit');
    changed = true;
    log('processEditMvuResponse: mvu_update applied', { schema: !!updateData.schema, state: !!updateData.state, patches: Array.isArray(updateData.patches), html: !!updateData.html, css: !!updateData.css, templates: !!updateData.templates });
  } else {
    const patchData = MVU.parsePatch(text);
    if (patchData) {
      const container = document.getElementById('mvuContent');
      const beforeState = cloneMvuState();
      MVU.applyTemplateOps(conversation.mvu, patchData, container);
      conversation.mvu.state = MVU.applyPatch(conversation.mvu.state, patchData, conversation.mvu.schema);
      const changedFields = partitionMvuFields((patchData.patches || []).map(p => p.path ? String(p.path).replace(/^\//, '').split('/')[0] : '')).changedFields;
      const normalized = normalizeMvuStructure(changedFields.length ? changedFields : ['characters', 'main_quests', 'side_quests']);
      if (normalized.repaired.length) log('processEditMvuResponse: repaired patch visual bindings', normalized.repaired);
      shouldWarnMvuBinding = changedFields.length > 0;
      bindingCheckFields = changedFields;
      if (changedFields.length) markMvuFieldsChanged(changedFields);
      recordMvuChanges(beforeState, changedFields, 'edit');
      changed = true;
      log('processEditMvuResponse: json:mvu patches applied', changedFields);
    }
  }

  // Parse story_setting (full replacement or incremental patch)
  const storySetting = MVU.parseStorySetting(text);
  if (storySetting) {
    conversation.storySetting = storySetting;
    changed = true;
    log('processEditMvuResponse: story_setting replaced');
  } else {
    const storyPatch = MVU.parseStorySettingPatch(text);
    if (storyPatch) {
      conversation.storySetting = MVU.applyStorySettingPatch(conversation.storySetting || '', storyPatch);
      changed = true;
      log('processEditMvuResponse: story_setting_patch applied', storyPatch.length, 'ops');
    }
  }

  // Live preview in sidebar
  if (changed) {
    renderMvuSidebar();
    if (shouldWarnMvuBinding) warnUnboundMvuFields('编辑已应用，但美化视图仍缺少绑定', bindingCheckFields);
    if (!sidebarOpen) toggleSidebar();
  }
}

// ============================================================
// Keyboard Shortcuts
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const debugOpen = document.getElementById('debugOverlay');
    const mvuDetailOpen = document.getElementById('mvuDetailOverlay')?.classList.contains('visible');
    if (mvuDetailOpen) {
      closeMvuDetail();
    } else if (debugOpen) {
      closeDebug();
    } else if (editingMsgId) {
      closeEdit();
    } else if (summaryPanelOpen) {
      toggleSummaryPanel();
    } else if (sidebarOpen) {
      toggleSidebar();
    }
  }
});
