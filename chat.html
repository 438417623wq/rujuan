<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="入卷">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090807">
  <title>入卷</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script>if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js');</script>
  <script src="common.js?v=17"></script>
  <script src="agnes.js?v=3"></script>
  <style>
    /* ============================================================
       Chat Page - Complete Layout
       ============================================================ */
    .chat-app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }

    /* ---- Top Bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top, var(--sat, 0px))) 16px 10px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: var(--z-topbar);
    }
    /* ---- 顶栏毛玻璃（东方玄金 v2.5） ----
       只覆盖背景 / 模糊 / 发丝线；定位、尺寸、层级仍由 .topbar 本体决定。 */
    .topbar.chat-header-blur {
      background: linear-gradient(180deg, var(--overlay-scrim-heavy) 80%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--gold-border-subtle);
    }
    /* 顶栏图标按钮：方案里的玻璃拟态方钮（34×34 / 金线细边 / 悬停点亮） */
    .topbar .glass-btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border-subtle);
      color: var(--text-regular);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .topbar .glass-btn-icon:hover {
      color: var(--gold-bright);
      border-color: var(--gold-border);
      background: var(--bg-elevated);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Topbar dropdown menu */
    .topbar-dropdown {
      position: relative;
      display: inline-flex;
    }
    .topbar-menu {
      display: none;
      position: fixed;
      top: auto;
      right: 16px;
      min-width: 200px;
      background: linear-gradient(180deg, var(--bg-elevated), var(--bg-surface));
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-floating);
      z-index: var(--z-dropdown);
      padding: 6px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .topbar-menu.show { display: block; animation: menuDrop 0.2s var(--ease-silk); }
    @keyframes menuDrop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .topbar-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      font-size: var(--fs-base);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition-smooth), color var(--transition-smooth);
      border-radius: var(--radius-sm);
    }
    .topbar-menu-item:hover { background: var(--accent-dim); color: var(--text-primary); }
    .topbar-menu-item.active { color: var(--accent-bright); }
    .topbar-menu-item .menu-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .topbar-menu-item:hover .menu-icon { opacity: 1; }
    .topbar-menu-item.active .menu-icon { opacity: 1; }
    .topbar-menu-divider {
      height: 1px;
      background: var(--gold-border-subtle);
      margin: 4px 8px;
    }
    .topbar-menu-label {
      padding: 8px 12px 4px;
      font-size: var(--fs-xs);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* World Setting Modal */
    .world-setting-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      background: var(--overlay-scrim);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s var(--ease-silk);
    }
    .world-setting-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .world-setting-modal {
      background: linear-gradient(180deg, var(--bg-elevated), var(--bg-surface));
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      width: 92%;
      max-width: 1040px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-floating);
    }
    .world-setting-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gold-border-subtle);
      flex-shrink: 0;
    }
    .world-setting-title {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent-bright);
    }
    .world-setting-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 20px 0;
      flex-shrink: 0;
    }
    .world-setting-tab {
      padding: 7px 15px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: var(--fs-base);
      cursor: pointer;
      transition: border-color var(--transition-smooth), color var(--transition-smooth), background var(--transition-smooth);
    }
    .world-setting-tab:hover {
      border-color: var(--gold-border);
      color: var(--text-primary);
    }
    .world-setting-tab.active {
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      border-color: transparent;
      color: var(--bg-void);
      font-weight: 600;
    }
    .world-setting-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .world-setting-panel {
      display: none;
      min-height: 0;
    }
    .world-setting-panel.active {
      display: block;
    }
    .world-setting-note {
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: var(--fs-sm);
      line-height: 1.6;
    }
    .world-setting-body textarea {
      min-height: 300px;
      resize: vertical;
      line-height: 1.6;
      font-size: var(--fs-base);
    }
    .worldbook-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .worldbook-toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .worldbook-toolbar input,
    .worldbook-toolbar select {
      min-width: 160px;
    }
    .worldbook-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .worldbook-stat {
      padding: 10px 13px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius);
      background: rgba(214,178,95,0.035);
      min-width: 120px;
    }
    .worldbook-stat-label {
      font-size: var(--fs-xs);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .worldbook-stat-value {
      margin-top: 4px;
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      color: var(--accent-bright);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .worldbook-card {
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px;
      background: rgba(214,178,95,0.028);
      margin-bottom: 14px;
    }
    .worldbook-card-title {
      font-family: var(--font-body);
      font-size: var(--fs-base);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent-bright);
      margin-bottom: 12px;
    }
    .worldbook-card-subtitle {
      color: var(--text-faint);
      font-size: var(--fs-sm);
      line-height: 1.65;
      margin-bottom: 12px;
    }
    .worldbook-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .worldbook-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }
    .worldbook-checkbox {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--text-secondary);
      font-size: var(--fs-sm);
    }
    .worldbook-checkbox input {
      width: auto;
      margin: 0;
    }
    .worldbook-actions-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .worldbook-editor-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* ---- 典籍词条卡片 ----
       旧版是贴在一起的灰底条目，常驻词条与关键词触发混在一起难以区分。
       现在：卡片化 + 左侧状态色条 + 常驻金标 / 触发蓝标 分色。 */
    .worldbook-editor-entry {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, rgba(36,31,23,0.7), rgba(22,18,12,0.7));
      overflow: hidden;
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
    }
    .worldbook-editor-entry:hover {
      border-color: var(--gold-border);
    }
    .worldbook-editor-entry.selected {
      border-color: var(--gold-border);
      box-shadow: inset 2px 0 0 var(--gold-primary);
    }
    .worldbook-editor-entry.expanded {
      border-color: var(--gold-border);
      background: linear-gradient(160deg, rgba(46,39,30,0.8), rgba(26,22,16,0.8));
      box-shadow: var(--shadow-ambient);
    }
    /* 左侧状态色条：常驻=金，触发=蓝（类名由渲染函数按 entry.constant 显式给出，
       不用 :has()，因为旧版 Android WebView 不支持） */
    .worldbook-editor-entry::before {
      content: '';
      display: block;
      height: 2px;
      background: linear-gradient(90deg, var(--ink-blue), transparent 70%);
      opacity: 0.5;
    }
    .worldbook-editor-entry.is-constant::before {
      background: linear-gradient(90deg, var(--gold-primary), transparent 70%);
      opacity: 0.75;
    }
    .worldbook-editor-head {
      padding: 13px 15px;
      cursor: pointer;
      user-select: none;
    }
    .worldbook-editor-head:hover {
      background: rgba(214,178,95,0.035);
    }
    .worldbook-editor-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .worldbook-editor-toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--jade-accent);
    }
    .worldbook-editor-title-group {
      flex: 1;
      min-width: 0;
    }
    .worldbook-editor-title {
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: var(--fs-md);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .worldbook-editor-meta {
      margin-top: 5px;
      color: var(--text-faint);
      font-size: var(--fs-xs);
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }
    .worldbook-editor-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
    }
    .worldbook-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--fs-xs);
      letter-spacing: 0.3px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: rgba(133,122,104,0.08);
      white-space: nowrap;
    }
    /* 关键词触发（手动/自动触发词条）：青玉绿 */
    .worldbook-tag.manual {
      color: var(--jade-accent);
      border-color: rgba(120,192,145,.32);
      background: var(--jade-dim);
    }
    /* 常驻词条：玄金，最高优先级视觉 */
    .worldbook-tag.constant {
      color: var(--accent-bright);
      border-color: var(--gold-border);
      background: var(--accent-dim);
      font-weight: 600;
    }
    .worldbook-editor-preview {
      margin-top: 10px;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .worldbook-editor-chevron {
      width: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: var(--fs-sm);
      flex-shrink: 0;
      transition: transform .2s var(--ease-silk), color .2s var(--ease-silk);
    }
    .worldbook-editor-entry.expanded .worldbook-editor-chevron {
      transform: rotate(90deg);
      color: var(--accent);
    }
    .worldbook-editor-body {
      border-top: 1px solid var(--border);
      padding: 14px;
    }
    .worldbook-editor-body.collapsed {
      display: none;
    }
    .worldbook-entry-empty {
      color: var(--text-muted);
      font-size: var(--fs-base);
      line-height: 1.6;
    }
    /* ── 世界书分类胶囊（v2.5）────────────────────
       原「筛选」是一个下拉框，选项藏在菜单里，一次只能看到一个选项。
       改为可横滑的胶囊行，一眼看清全部分类，点击即筛。
       原 #worldBookFilter 下拉保留在 DOM 中（JS 会回写其 value），
       视觉上收起，避免同一筛选出现两个入口。 */
    .worldbook-filter-tabs {
      display: flex;
      gap: 6px;
      padding: 0 0 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .worldbook-filter-tabs::-webkit-scrollbar {
      display: none;
    }
    .worldbook-filter-tabs .filter-chip {
      flex: 0 0 auto;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--gold-border-subtle);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: var(--fs-sm);
      line-height: 1.4;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: color var(--transition-smooth), border-color var(--transition-smooth), background var(--transition-smooth);
    }
    .worldbook-filter-tabs .filter-chip:hover {
      color: var(--text-primary);
      border-color: var(--gold-border);
    }
    .worldbook-filter-tabs .filter-chip.active {
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      border-color: transparent;
      color: var(--bg-void);
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(214, 178, 95, 0.22);
    }
    .worldbook-filter-native {
      display: none;
    }
    /* ── 典籍词条：方案别名类（wb-*）──────────────
       这些是 v2.5 方案里的名字，直接挂在既有 .worldbook-* 结构上，
       只声明方案独有的差异（标题金调、徽章分色、关键词胶囊、两行摘要），
       不重复声明卡片已有的内距/边框，避免与 .worldbook-editor-* 打架。 */
    .wb-entry-card {
      cursor: pointer;
      transition: border-color var(--transition-smooth), background var(--transition-smooth);
    }
    .wb-entry-card:hover {
      border-color: var(--gold-border);
      background: var(--bg-elevated);
    }
    .wb-entry-head {
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .wb-entry-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-bright);
      font-family: var(--font-body);
      font-size: var(--fs-lg);
      font-weight: 700;
    }
    /* 用双类名压过 .worldbook-tag.constant / .manual（同特异性、靠顺序取胜） */
    .worldbook-tag.wb-badge-constant {
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--accent-dim);
      color: var(--gold-bright);
      border-color: var(--gold-border);
    }
    .worldbook-tag.wb-badge-trigger {
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(109, 145, 186, 0.15);
      color: var(--ink-blue);
      border-color: rgba(109, 145, 186, 0.3);
    }
    .wb-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .wb-key-chip {
      font-size: var(--fs-xs);
      line-height: 1.5;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .wb-desc-snippet {
      -webkit-line-clamp: 2;
      line-clamp: 2;
      font-size: var(--fs-sm);
      line-height: 1.6;
    }
    @media (max-width: 960px) {
      .worldbook-grid {
        grid-template-columns: 1fr;
      }
    }
    .world-setting-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Story title - editable inline input */
    .story-title {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: none;
      text-align: center;
      outline: none;
      max-width: 320px;
      width: 100%;
      padding: 2px 8px;
      border-radius: var(--radius);
      transition: all var(--transition);
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .story-title:hover {
      background: var(--accent-dim);
    }
    .story-title:focus {
      background: var(--bg-surface);
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
      cursor: text;
    }

    /* Phase badge */
    .phase-badge {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
      user-select: none;
    }
    .phase-badge.init {
      background: rgba(214, 178, 95, 0.15);
      color: var(--accent);
      border: 1px solid rgba(214, 178, 95, 0.25);
    }
    .phase-badge.rp {
      background: rgba(120, 192, 145, 0.15);
      color: var(--success);
      border: 1px solid rgba(120, 192, 145, 0.25);
    }

    /* ---- Main Content Area ---- */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ---- Chat Column ---- */
    .chat-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    /* ---- Messages Area ---- */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px 16px;
      overflow-anchor: auto;
    }
    .messages-list {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    /* ---- 正文流滚动区（东方玄金 v2.5） ----
       .messages-area 已有 flex:1 / overflow-y:auto / padding，这里只补
       方案里缺失的纵向流式布局。底部 120px 留白不采纳：输入区是正常流内的
       flex-shrink:0 元素（非 absolute 浮层），再垫 120px 只会平白多出一块空白。 */
    .messages-area.chat-stream-scroll {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    /* .messages-list 用 margin:0 auto 居中，一旦父级变成 flex 列容器，
       auto 外边距会阻止交叉轴拉伸、把列表压成 fit-content 宽度。
       显式 width:100% 还原改动前「撑满至 780px 并居中」的行为。 */
    .messages-area.chat-stream-scroll .messages-list {
      width: 100%;
    }

    /* ---- Message Bubbles ---- */
    .message {
      position: relative;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    .message:hover .message-actions,
    .message-actions:hover {
      opacity: 1;
      pointer-events: auto;
    }
    .message:hover .message-time {
      opacity: 1;
    }

    /* AI message (left-aligned, story text) */
    .message.assistant {
      padding: 0;
    }
    .message.assistant .message-content {
      font-family: var(--font-body);
      font-size: var(--fs-lg);
      line-height: 1.95;
      color: var(--text-primary);
      letter-spacing: 0.015em;
    }
    /* ---- 正文装帧纸卡（东方玄金 v2.5 · .novel-prose-block） ----
       原 .message.assistant .message-content 只有字体声明、没有背景与内距，
       所以这里直接补卡片化视觉，不存在「卡片套卡片」的双层色块问题。
       字号 / 行距仍沿用上面既有规则的 15.5px / 1.95，不降级阅读体验。 */
    .message.assistant .message-content.novel-prose-block {
      background: var(--bg-surface);
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-ambient);
    }
    /* ---- 装帧级正文排版 ----
       renderMarkdown 已把正文段落化为 <p>，这里才能让 text-indent 生效。
       首行缩进 2em + 段落间留白，是中文小说排版的基本呼吸感。 */
    .message.assistant .message-content p {
      text-indent: 2em;
      margin: 0 0 0.72em;
    }
    .message.assistant .message-content p:last-child {
      margin-bottom: 0;
    }
    /* 纯对白段落不缩进（以引号开头的行），符合中文排版惯例 */
    .message.assistant .message-content p.quote-line {
      text-indent: 0;
    }
    .message.assistant .message-content strong {
      color: var(--accent-bright);
      font-weight: 600;
    }
    .message.assistant .message-content em {
      color: var(--text-secondary);
      font-style: italic;
    }
    /* 台词：亮金高亮，小说里的"人物在说话"
       与方案 .novel-dialogue-highlight 对齐：--accent-bright 即 --gold-bright，
       颜色本就等价，这里只补齐方案多出的 font-weight: 600 加重。 */
    .message.assistant .message-content .quote-text {
      color: var(--accent-bright);
      font-weight: 600;
      font-style: normal;
      letter-spacing: 0.02em;
    }
    .message.assistant .message-content hr.story-divider {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
      margin: 22px 0;
    }
    /* Thinking block — collapsible */
    .message.assistant .thinking-block {
      margin-bottom: 14px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius);
      overflow: hidden;
      font-size: 0.85em;
      background: rgba(0,0,0,0.18);
    }
    .message.assistant .thinking-block summary {
      padding: 7px 12px;
      cursor: pointer;
      color: var(--text-muted);
      background: rgba(214,178,95,0.04);
      user-select: none;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color var(--transition-smooth);
    }
    .message.assistant .thinking-block summary:hover {
      color: var(--accent-bright);
    }
    .message.assistant .thinking-content {
      padding: 10px 12px;
      color: var(--text-muted);
      font-family: var(--font-ui);
      line-height: 1.7;
      max-height: 400px;
      overflow-y: auto;
    }
    /* Refine indicator */
    .message.assistant .refine-indicator {
      margin-top: 10px;
      padding: 5px 0 0;
      font-size: 0.72em;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      border-top: 1px solid var(--gold-border-subtle);
      opacity: 0.85;
    }

    /* Decorative left accent bar for AI messages */
    .message.assistant::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: linear-gradient(to bottom, var(--gold-primary), transparent);
      border-radius: 1px;
      opacity: 0.35;
    }

    /* Abstract / details block within AI messages */
    .message.assistant .message-content details {
      margin-top: 16px;
      padding: 10px 14px;
      background: var(--accent-dim);
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      line-height: 1.65;
      color: var(--text-secondary);
    }
    .message.assistant .message-content details summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent-bright);
      font-size: var(--fs-xs);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      user-select: none;
      outline: none;
      margin-bottom: 4px;
    }
    .message.assistant .message-content details summary::-webkit-details-marker {
      color: var(--accent);
    }
    .message.assistant .message-content details[open] summary {
      margin-bottom: 8px;
    }

    /* User message (right-aligned bubble) */
    .message.user {
      display: flex;
      justify-content: flex-end;
    }
    .message.user .message-bubble {
      max-width: 75%;
      background: var(--bg-glass-light);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      padding: 12px 18px;
      font-family: var(--font-body);
      font-size: var(--fs-md);
      line-height: 1.7;
      color: var(--text-primary);
      position: relative;
    }

    /* Hidden message (greyed out, strikethrough) */
    .message.hidden-msg {
      opacity: 0.35;
    }
    .message.hidden-msg .message-content,
    .message.hidden-msg .message-bubble {
      text-decoration: line-through;
      text-decoration-color: var(--text-muted);
    }

    /* Message timestamp */
    .message-time {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-top: 4px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .message.user .message-time {
      text-align: right;
    }

    /* Message action buttons (hover toolbar) */
    .message-actions {
      position: absolute;
      top: -8px;
      display: flex;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      z-index: 10;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2px;
      box-shadow: var(--shadow);
    }
    .message.assistant .message-actions {
      right: 0;
    }
    .message.user .message-actions {
      left: 0;
    }
    .message-actions .btn-icon {
      width: 28px;
      height: 28px;
    }
    .message-actions .btn-icon .icon {
      width: 14px;
      height: 14px;
    }

    /* ---- Typing / Streaming Indicator ---- */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      animation: fadeIn 0.3s ease forwards;
      opacity: 0;
    }
    .typing-dots {
      display: flex;
      gap: 4px;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s ease infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    .typing-label {
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      color: var(--text-muted);
      font-style: italic;
    }

    /* Streaming cursor blink */
    .streaming-cursor::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: pulse 0.8s ease infinite;
    }

    /* ---- MVU Init Confirmation Bar ---- */
    .mvu-confirm-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(214, 178, 95, 0.08);
      border: 1px solid rgba(214, 178, 95, 0.2);
      border-radius: var(--radius);
      margin-top: 12px;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
      flex-wrap: wrap;
    }
    .mvu-confirm-bar p {
      flex: 1;
      font-size: var(--fs-base);
      color: var(--text-secondary);
      min-width: 180px;
    }
    .mvu-confirm-bar .btn {
      font-size: var(--fs-sm);
      padding: 6px 14px;
    }

    /* ---- Load More ---- */
    .load-more-sentinel {
      text-align: center;
      padding: 12px;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s;
      overflow-anchor: none;
    }
    .load-more-sentinel:hover { color: var(--accent); }

    /* ---- Empty State ----
       样式收口到 common.js（与首页同构：翎毛笔 + 装饰线 + 标题 + 描述 + CTA） */

    /* ---- 命运抉择（分支选项） ----
       旧版是一排扁平灰色标签，缺乏仪式感；现在改为纵向抉择卡片列表，
       带壹/贰/叁 古典序号印章，悬停时向右轻移并点亮金边。 */
    .options-bar {
      flex-shrink: 0;
      padding: 8px 20px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 620px;
      margin: 0 auto;
      width: 100%;
    }
    /* 方案 .choice-card-node 的等价物：纵向排列（由 .options-bar 的 flex 列 +
       gap:8px 提供）、悬停时 background:var(--bg-highlight) +
       border-color:var(--gold-primary) + transform:translateX(4px)
       —— 既有 .option-tag:hover 三条全部命中，无需新增规则。
       因此这里也不为 .choice-card-node 定义任何声明，避免覆盖既有更精致的
       渐变底 + 左侧金条 + 阴影；它只是方案侧的语义类名。 */
    /* 选项列表容器：与方案 .choice-card-list 对齐 */
    .choice-card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
    }
    /* 桌面选项条本身已带 8px 顶部内距与 8px 间距，避免二次留白 */
    .options-bar > .choice-card-list {
      margin-top: 0;
    }
    .option-tag {
      position: relative;
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      padding: 11px 14px;
      background: linear-gradient(135deg, var(--bg-elevated), var(--bg-surface));
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      line-height: 1.5;
    }
    .option-tag:hover {
      border-color: var(--gold-primary);
      color: var(--text-primary);
      background: var(--bg-highlight);
      transform: translateX(4px);
      box-shadow: -3px 0 0 0 var(--gold-primary), var(--shadow-ambient);
    }
    .option-tag:active {
      transform: translateX(2px) scale(0.995);
    }
    /* 序号印章：壹 / 贰 / 叁 */
    .choice-num-seal {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      font-weight: 700;
      border-radius: 6px;
      background: var(--accent-dim);
      color: var(--accent-bright);
      border: 1px solid var(--gold-border);
      transition: all var(--transition-smooth);
    }
    .option-tag:hover .choice-num-seal {
      background: var(--gold-primary);
      color: var(--bg-void);
      border-color: var(--gold-primary);
    }
    .option-type {
      font-size: var(--fs-xs);
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: var(--accent-dim);
      color: var(--accent);
      flex-shrink: 0;
      letter-spacing: 0.5px;
      border: 1px solid var(--gold-border-subtle);
    }
    .option-text {
      flex: 1;
      min-width: 0;
      line-height: 1.5;
    }

    /* ---- 投骰检定卡（D20 戏剧化判定） ----
       旧版掷骰只在快捷栏里追加一行灰色小字，毫无桌游跑团的戏剧张力。
       现在掷骰后弹出一张居中检定卡：浮动金纹骰子 + 大点数 + 判定横幅。 */
    .dice-check-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--overlay-scrim);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--ease-silk);
    }
    .dice-check-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .dice-check-card {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 26px 22px 22px;
      border-radius: var(--radius-lg);
      background: linear-gradient(165deg, var(--bg-elevated), var(--bg-surface) 55%, var(--bg-primary));
      border: 1px solid var(--gold-border);
      box-shadow: var(--shadow-floating);
      text-align: center;
      transform: translateY(12px) scale(0.96);
      transition: transform 0.32s var(--ease-silk);
    }
    .dice-check-overlay.show .dice-check-card {
      transform: translateY(0) scale(1);
    }
    /* 卡面顶部的金线装饰 */
    .dice-check-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 18%;
      right: 18%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      opacity: 0.7;
    }
    .dice-check-label {
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      letter-spacing: 0.32em;
      text-indent: 0.32em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    /* 骰子舞台 */
    .dice-check-stage {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 骰子背后的光晕 */
    .dice-check-stage::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(214, 178, 95, 0.22), transparent 68%);
      animation: diceGlow 2.6s ease-in-out infinite;
    }
    @keyframes diceGlow {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .dice-3d-token {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(150deg, var(--bg-highlight), var(--bg-surface));
      border: 1px solid var(--gold-border);
      box-shadow: inset 0 1px 0 rgba(243, 212, 132, 0.18), var(--shadow-ambient);
      animation: floatDice 3s ease-in-out infinite;
    }
    /* 骰面金纹描边（用两条对角线模拟二十面骰的棱） */
    .dice-3d-token::before,
    .dice-3d-token::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--gold-border-subtle);
      transform: rotate(45deg);
      border-radius: 4px;
      pointer-events: none;
    }
    .dice-3d-token::after {
      inset: 14px;
      transform: rotate(0deg);
    }
    @keyframes floatDice {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    .dice-num-display {
      position: relative;
      font-family: var(--font-display);
      font-size: var(--fs-3xl);
      font-weight: 700;
      color: var(--gold-bright);
      line-height: 1;
      text-shadow: 0 0 18px rgba(214, 178, 95, 0.4);
      font-variant-numeric: tabular-nums;
    }
    .dice-d20-sub {
      margin-top: 6px;
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }
    /* 判定横幅 */
    .check-result-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      font-weight: 600;
      letter-spacing: 0.08em;
      border: 1px solid var(--gold-border);
      background: var(--accent-dim);
      color: var(--accent-bright);
      margin-bottom: 14px;
    }
    .check-result-banner.result-badge-success {
      border-color: rgba(120, 192, 145, 0.4);
      background: var(--jade-dim);
      color: var(--jade-accent);
    }
    .check-result-banner.result-badge-fail {
      border-color: rgba(212, 101, 86, 0.4);
      background: var(--cinnabar-dim);
      color: var(--cinnabar-red);
    }
    /* 计算过程 */
    .check-calc-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .check-calc-part {
      padding: 2px 9px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .check-calc-eq {
      color: var(--text-faint);
    }
    .check-calc-total {
      color: var(--gold-bright);
      font-weight: 700;
      border-color: var(--gold-border);
      background: var(--accent-dim);
    }
    .dice-check-hint {
      margin-top: 12px;
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }

    /* ---- Input Area ---- */
    .input-area {
      flex-shrink: 0;
      padding: 12px 20px 16px;
      background: linear-gradient(to top, var(--bg-glass) 80%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ---- Quick Reply Bar ---- */
    .quick-reply-bar {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 8px 20px 0;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      scrollbar-width: none;
    }
    .quick-reply-bar:empty { display: none; }
    .quick-reply-bar::-webkit-scrollbar { display: none; }
    .qr-chip {
      flex: 0 0 auto;
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      padding: 5px 13px;
      border-radius: var(--radius-full);
      border: 1px solid var(--gold-border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color var(--transition-smooth), color var(--transition-smooth), background var(--transition-smooth);
      white-space: nowrap;
    }
    .qr-chip:hover { border-color: var(--gold-primary); color: var(--accent-bright); }
    .qr-chip.qr-dice { border-color: var(--gold-border); color: var(--accent-bright); }
    .qr-chip.qr-dice:disabled { opacity: 0.45; cursor: not-allowed; }
    .qr-chip.qr-hardcore { background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to)); color: var(--bg-void); border-color: transparent; font-weight: 600; }
    .qr-chip.qr-edit { color: var(--text-faint); }
    .input-area.disabled {
      pointer-events: none;
      opacity: 0.5;
    }
    .input-wrapper {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
    }
    .input-wrapper:focus-within {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(214,178,95,0.10);
    }
    .input-textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: var(--fs-md);
      line-height: 1.65;
      resize: none;
      outline: none;
      min-height: 22px;
      max-height: 160px;
      padding: 4px 0;
      overflow-y: auto;
    }
    .input-textarea::placeholder {
      color: var(--text-faint);
    }
    .input-textarea:focus {
      box-shadow: none;
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: filter var(--transition-smooth), transform var(--transition-smooth), background var(--transition-smooth);
      flex-shrink: 0;
    }
    .send-btn.ready {
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      color: var(--bg-void);
      box-shadow: 0 4px 16px rgba(214,178,95,0.24);
    }
    .send-btn.ready:hover {
      filter: brightness(1.1);
      transform: scale(1.05);
    }
    .send-btn.ready:active { transform: scale(0.96); }
    .send-btn.idle {
      background: var(--bg-elevated);
      color: var(--text-muted);
      cursor: default;
    }
    .send-btn.streaming {
      background: var(--danger);
      color: #fff;
    }
    .send-btn.streaming:hover {
      filter: brightness(1.15);
    }
    .send-btn .icon {
      width: 18px;
      height: 18px;
    }

    /* ---- MVU Sidebar ---- */
    .mvu-sidebar {
      width: 360px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--bg-surface), var(--bg-deep));
      border-left: 1px solid var(--gold-border-subtle);
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: calc(16px + env(safe-area-inset-top, var(--sat, 0px))) 16px 16px;
      transform: translateX(0);
      transition: transform 0.35s var(--ease-silk),
                  opacity 0.35s ease,
                  width 0.35s var(--ease-silk),
                  padding 0.35s var(--ease-silk);
      opacity: 1;
    }
    .mvu-sidebar.collapsed {
      width: 0;
      padding: 0;
      opacity: 0;
      transform: translateX(360px);
      border-left: none;
      overflow: hidden;
    }
    .mvu-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--gold-border-subtle);
    }
    .mvu-sidebar-title {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--accent-bright);
      letter-spacing: 0.08em;
    }
    .mvu-placeholder {
      text-align: center;
      padding: 32px 12px;
      color: var(--text-muted);
      font-size: var(--fs-base);
      font-style: italic;
      line-height: 1.6;
    }
    .mvu-placeholder .icon {
      width: 32px;
      height: 32px;
      color: var(--accent);
      opacity: 0.25;
      margin-bottom: 12px;
    }
    .mvu-content {
      min-height: 40px;
    }
    .mvu-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gold-border-subtle);
      position: relative;
    }
    .mvu-toolbar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .mvu-toolbar-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .mvu-toolbar-title strong {
      color: var(--accent-bright);
      font-family: var(--font-body);
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .mvu-toolbar-title span {
      color: var(--text-faint);
      font-size: var(--fs-xs);
    }
    .mvu-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mvu-toolbar-actions .btn-icon svg {
      width: 16px;
      height: 16px;
    }
    /* 视图切换：胶囊分段控件 */
    .mvu-view-toggle {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-full);
      background: var(--bg-void);
    }
    .mvu-view-btn {
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-muted);
      font-size: var(--fs-sm);
      min-height: 30px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
      transition: background var(--transition-smooth), color var(--transition-smooth);
    }
    .mvu-view-btn:hover { color: var(--text-primary); }
    .mvu-view-btn.active {
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      color: var(--bg-void);
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(214,178,95,0.22);
    }
    .mvu-view-btn.change-active {
      color: var(--accent-bright);
      border: 1px solid var(--gold-border);
    }
    .mvu-change-dock {
      display: none;
    }
    .mvu-change-dock.visible {
      display: block;
      margin-top: -4px;
    }
    .mvu-change-dock .mvu-change-panel {
      box-shadow: var(--shadow-ambient);
    }
    .mvu-search {
      display: none;
      width: 100%;
      min-height: 34px;
      font-size: var(--fs-sm);
      padding: 8px 10px;
    }
    .mvu-search.visible {
      display: block;
    }
    .mvu-change-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      background: var(--accent-dim);
      color: var(--accent-bright);
      font-size: var(--fs-xs);
      letter-spacing: 0.03em;
      border: 1px solid var(--gold-border);
    }
    /* ============================================================
       游戏视图（Game View）— 方案 A · 玄墨卷轴
       设计：暖墨金（#d6b25f）与 App 水墨画卷背景同源，青玉（#78c091）作辅助语义色。
       层级靠字重/字号/留白 + 刻度尺式资源条 + 印章式标签，不靠彩色色块。
       令牌：--gv-* 为视图私有令牌，均可被 --mvu-game-* 或 AI 自定义 CSS 覆写。
       ============================================================ */
    .mvu-game-view {
      --gv-accent: var(--mvu-game-accent, var(--mvu-accent-2, var(--jade-accent, #78c091)));
      --gv-gold: var(--mvu-game-gold, var(--mvu-accent, var(--accent, #d6b25f)));
      --gv-bg: var(--mvu-game-bg, var(--bg-deep, #110e0a));
      --gv-raised: var(--mvu-game-raised, var(--bg-surface, #1a1610));
      --gv-sunken: var(--mvu-game-sunken, var(--bg-void, #090807));
      --gv-hover: rgba(214, 178, 95, 0.06);
      --gv-text: var(--mvu-game-text, var(--text-primary, #f2e9dc));
      --gv-muted: var(--mvu-game-muted, var(--text-secondary, #c8bea9));
      --gv-faint: var(--mvu-game-faint, var(--text-muted, #857a68));
      --gv-line: var(--mvu-game-line, var(--border, rgba(214, 178, 95, 0.12)));
      --gv-line-strong: var(--mvu-game-line-strong, var(--border-strong, rgba(214, 178, 95, 0.25)));
      --gv-good: var(--mvu-good, var(--jade-accent, #78c091));
      --gv-warn: var(--mvu-warn, var(--accent-bright, #f3d484));
      --gv-danger: var(--mvu-danger, var(--cinnabar-red, #d46556));
      --gv-info: var(--mvu-info, var(--ink-blue, #6d91ba));
      --gv-radius: var(--mvu-radius, 8px);
      --gv-radius-lg: 12px;
      --gv-ease: var(--mvu-ease, cubic-bezier(0.22, 0.61, 0.36, 1));
      --gv-fast: var(--mvu-dur-fast, 0.18s);
      --gv-base: var(--mvu-dur-base, 0.32s);
      --gv-font-num: var(--mvu-font-num, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      --gv-font-serif: 'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', var(--font-display, serif);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      min-height: 100%;
      border-radius: var(--gv-radius-lg);
      background: var(--gv-bg);
      color: var(--gv-text);
    }
    /* Hero：印章式境界标签置于标题上方 + 环境一行 + 刻度尺式资源条 */
    .mvu-game-hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      padding: 16px 16px 14px;
      background: linear-gradient(160deg, var(--bg-elevated), var(--bg-deep) 72%);
      border: 1px solid var(--gold-border);
      box-shadow: var(--shadow-ambient);
    }
    .mvu-game-hero::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--gold-bright), transparent 78%);
    }
    .mvu-game-hero::after {
      content: '';
      position: absolute;
      right: -40px;
      top: -40px;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(214, 178, 95, 0.16), transparent 68%);
      pointer-events: none;
    }
    /* 徽标移到标题上方：DOM 顺序为 标题→徽标，用 column-reverse 反转视觉顺序（纯 CSS，零 JS） */
    .mvu-game-hero-head {
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 9px;
    }
    .mvu-game-title {
      color: var(--gv-gold);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-2xl);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.2;
      word-break: break-word;
      min-width: 0;
      text-shadow: 0 0 26px rgba(214, 178, 95, 0.28);
    }
    .mvu-game-subtitle {
      margin-top: 7px;
      color: var(--gv-muted);
      font-size: var(--fs-xs);
      letter-spacing: 0.05em;
      line-height: 1.5;
      word-break: break-word;
    }
    .mvu-cultivation-core {
      display: grid;
      gap: 11px;
      margin-top: 14px;
    }
    /* Hero 其他属性：承接灵石/声望这类无上限、画不成资源条的自身数值。
       压成一行紧凑内联，超出用省略号；点击展开详情。 */
    .mvu-game-extra {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 0;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--gv-line);
    }
    .mvu-game-extra-item {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      max-width: 100%;
      padding: 2px 9px;
      border: 0;
      border-left: 1px solid var(--gv-line);
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: background-color var(--gv-fast) var(--gv-ease);
    }
    .mvu-game-extra-item:first-child {
      padding-left: 0;
      border-left: 0;
    }
    .mvu-game-extra-item:hover {
      background: var(--gv-hover);
    }
    .mvu-game-extra-label {
      color: var(--gv-faint);
      font-size: var(--fs-xs);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .mvu-game-extra-value {
      color: var(--gv-text);
      font-family: var(--gv-font-num);
      font-variant-numeric: tabular-nums;
      font-size: var(--fs-sm);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 朱砂印章式境界标签：去掉 max-width 裁切，独立成行 */
    .mvu-realm-badge {
      display: inline-flex;
      flex: 0 0 auto;
      width: fit-content;
      max-width: none;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid color-mix(in srgb, var(--gv-gold), transparent 58%);
      background: color-mix(in srgb, var(--gv-gold), transparent 87%);
      color: var(--gv-gold);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: 0.16em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 本轮变化摘要：左侧强调线 + 暖墨底 */
    .mvu-game-changes {
      display: grid;
      gap: 9px;
      padding: 10px 11px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--gv-line);
      border-left: 2px solid color-mix(in srgb, var(--gv-gold), transparent 45%);
    }
    .mvu-game-changes-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      color: var(--gv-text);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.1em;
    }
    .mvu-game-changes-more {
      color: var(--gv-faint);
      font-size: var(--fs-xs);
      font-weight: 500;
      letter-spacing: 0;
    }
    .mvu-game-change-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .mvu-game-change-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--gv-line);
      background: rgba(255, 255, 255, 0.022);
      color: var(--gv-muted);
      font-size: var(--fs-xs);
      line-height: 1.3;
      cursor: pointer;
      transition: border-color var(--gv-fast) var(--gv-ease), background-color var(--gv-fast) var(--gv-ease);
    }
    .mvu-game-change-chip:hover {
      border-color: var(--gv-line-strong);
      background: var(--gv-hover);
    }
    .mvu-game-change-label {
      font-weight: 600;
      color: var(--gv-text);
      font-family: var(--gv-font-serif);
      word-break: break-word;
    }
    /* 变化徽标：从 10px 提到 11.5px，并给出实色底，chip 内可读 */
    .mvu-game-delta {
      flex: 0 0 auto;
      font-family: var(--gv-font-num);
      font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs);
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid transparent;
    }
    .mvu-game-delta.up {
      color: var(--gv-good);
      border-color: color-mix(in srgb, var(--gv-good), transparent 70%);
      background: color-mix(in srgb, var(--gv-good), transparent 88%);
    }
    .mvu-game-delta.down {
      color: var(--gv-danger);
      border-color: color-mix(in srgb, var(--gv-danger), transparent 70%);
      background: color-mix(in srgb, var(--gv-danger), transparent 88%);
    }
    .mvu-game-delta.flat {
      color: var(--gv-muted);
      border-color: var(--gv-line-strong);
      background: transparent;
    }
    /* 标签页：图标 / 文字 / 计数纵向排列，360px 内不再挤压 */
    .mvu-game-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      padding: 0;
      border: 0;
      border-bottom: 1px solid var(--gv-line);
      background: rgba(14, 13, 11, 0.94);
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(10px);
    }
    .mvu-game-tab {
      min-height: 44px;
      min-width: 0;
      overflow: hidden;
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      border-radius: 0;
      background: transparent;
      color: var(--gv-faint);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-xs);
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: color var(--gv-fast) var(--gv-ease), border-color var(--gv-fast) var(--gv-ease);
    }
    .mvu-game-tab > span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mvu-game-tab:hover { color: var(--gv-text); }
    .mvu-game-tab.active {
      color: var(--gv-gold);
      border-bottom-color: var(--gv-gold);
      font-weight: 700;
    }
    .mvu-game-section-count {
      color: var(--gv-faint);
      font-family: var(--gv-font-num);
      font-size: var(--fs-xs);
      font-weight: 500;
      flex: 0 0 auto;
    }
    .mvu-game-tab.active .mvu-game-section-count { color: color-mix(in srgb, var(--gv-gold), transparent 25%); }
    .mvu-game-tab svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }
    .mvu-game-pane {
      display: grid;
      gap: var(--mvu-gap-md, 10px);
      animation: mvuGamePaneIn var(--gv-base) var(--gv-ease);
    }
    @keyframes mvuGamePaneIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .mvu-game-layout {
      display: grid;
      gap: 10px;
    }
    .mvu-game-list {
      display: grid;
      gap: 0;
    }
    .mvu-game-entry {
      width: 100%;
      min-height: 46px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 9px 4px 9px 2px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 0;
      background: transparent;
      color: var(--gv-text);
      text-align: left;
      cursor: pointer;
      transition: background-color var(--gv-fast) var(--gv-ease);
    }
    .mvu-game-entry:last-child { border-bottom: 0; }
    .mvu-game-entry:hover {
      background: var(--gv-hover);
    }
    .mvu-game-entry.active {
      background: color-mix(in srgb, var(--gv-gold), transparent 94%);
    }
    .mvu-game-entry.active .mvu-game-entry-title { color: var(--gv-gold); }
    .mvu-game-entry-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gv-muted);
      background: color-mix(in srgb, currentColor, transparent 90%);
      flex: 0 0 auto;
      border: 0;
    }
    .mvu-game-entry-icon svg {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mvu-game-entry-icon .mvu-icon-fill,
    .mvu-game-modal-icon .mvu-icon-fill {
      fill: currentColor;
      stroke: none;
      opacity: 0.16;
    }
    /* 分类着色：自身状态用金，角色用青玉，避免整行着色 */
    .mvu-game-entry-icon.status,
    .mvu-game-modal-icon.status { color: var(--gv-gold); }
    .mvu-game-entry-icon.character,
    .mvu-game-modal-icon.character { color: var(--gv-accent); }
    .mvu-game-entry-icon.inventory,
    .mvu-game-modal-icon.inventory { color: var(--gv-warn); }
    .mvu-game-entry-icon.skills,
    .mvu-game-modal-icon.skills { color: var(--gv-accent); }
    .mvu-game-entry-icon.quests,
    .mvu-game-modal-icon.quests { color: var(--gv-info); }
    .mvu-game-entry-icon.world,
    .mvu-game-modal-icon.world { color: var(--gv-muted); }
    .mvu-game-entry-icon.location,
    .mvu-game-modal-icon.location { color: var(--gv-info); }
    .mvu-game-entry-main {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .mvu-game-entry-title {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--gv-text);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-sm);
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }
    .mvu-game-entry-sub {
      color: var(--gv-faint);
      font-size: var(--fs-xs);
      line-height: 1.35;
      word-break: break-word;
    }
    /* 右侧占位 tag（「状态」「角色」）与图标语义重复，纯 CSS 隐藏；物品/任务/功法页仍保留 */
    .mvu-game-entry-tag {
      align-self: center;
      max-width: 84px;
      padding: 0;
      border-radius: 0;
      color: var(--gv-faint);
      background: transparent;
      border: 0;
      font-size: var(--fs-xs);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 「人物」页只列 NPC，自身属性已回归 Hero 区（见 renderHero 的 .mvu-game-extra）。
       故此处不再需要「自 身 / 人 物」分节，角色条目右侧的「角色」占位 tag 直接隐藏。 */
    .mvu-game-entry[onclick*="openMvuGameDetail('character'"] .mvu-game-entry-tag { display: none; }
    /* 详情弹窗 */
    .mvu-game-modal {
      position: fixed;
      inset: 0;
      z-index: var(--z-lightbox);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(4px);
    }
    .mvu-game-modal.visible {
      display: flex;
      animation: mvuGameModalIn var(--gv-base) var(--gv-ease);
    }
    @keyframes mvuGameModalIn { from { opacity: 0; } to { opacity: 1; } }
    .mvu-game-modal-card {
      width: min(420px, 94vw);
      max-height: min(74vh, 640px);
      overflow: auto;
      position: relative;
      border: 1px solid var(--gv-line-strong);
      border-radius: 14px;
      padding: 16px;
      background: var(--gv-raised);
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.55);
      animation: mvuGameModalCardIn var(--gv-base) var(--gv-ease);
    }
    @keyframes mvuGameModalCardIn { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
    .mvu-game-modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1;
      width: 28px;
      height: 28px;
      border: 1px solid var(--gv-line);
      border-radius: 999px;
      background: transparent;
      color: var(--gv-muted);
      font-size: var(--fs-xl);
      line-height: 1;
      cursor: pointer;
      transition: color var(--gv-fast) var(--gv-ease), border-color var(--gv-fast) var(--gv-ease);
    }
    .mvu-game-modal-close:hover { border-color: var(--gv-line-strong); color: var(--gv-text); }
    .mvu-game-modal-head {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding-right: 32px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gv-line);
    }
    .mvu-game-modal-headtext { min-width: 0; }
    .mvu-game-modal-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: color-mix(in srgb, currentColor, transparent 90%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gv-muted);
      border: 0;
      font-weight: 700;
    }
    .mvu-game-modal-icon svg {
      width: 24px;
      height: 24px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mvu-game-modal-title {
      color: var(--gv-text);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-xl);
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.3;
      word-break: break-word;
    }
    .mvu-game-modal-subtitle {
      margin-top: 2px;
      color: var(--gv-faint);
      font-size: var(--fs-xs);
      line-height: 1.35;
      word-break: break-word;
    }
    .mvu-game-modal-badge {
      max-width: 86px;
      padding: 3px 9px;
      border-radius: 3px;
      border: 1px solid var(--gv-line-strong);
      background: transparent;
      color: var(--gv-muted);
      font-size: var(--fs-xs);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mvu-game-modal-attrs {
      display: grid;
      gap: 0;
      margin-top: 12px;
    }
    .mvu-game-modal-attr {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--gv-line);
      background: transparent;
      border-radius: 0;
      font-size: var(--fs-sm);
      line-height: 1.5;
    }
    .mvu-game-modal-attr:last-child { border-bottom: 0; }
    .mvu-game-modal-attr span:first-child {
      color: var(--gv-faint);
      font-weight: 500;
    }
    .mvu-game-modal-attr span:last-child {
      color: var(--gv-text);
      font-weight: 500;
      word-break: break-word;
    }
    .mvu-game-modal-desc {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--gv-line);
      color: var(--gv-muted);
      font-size: var(--fs-sm);
      line-height: 1.7;
      word-break: break-word;
    }
    /* Hero 内的资源条：轨道 2px → 7px，并叠加刻度刻痕 */
    .mvu-game-bar-card {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .mvu-game-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .mvu-game-label {
      color: var(--gv-muted);
      font-family: var(--gv-font-serif);
      font-size: var(--fs-sm);
      font-weight: 500;
      letter-spacing: 0.08em;
      min-width: 0;
      word-break: break-word;
    }
    .mvu-game-value {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      color: var(--gv-text);
      font-size: var(--fs-lg);
      font-weight: 700;
      font-family: var(--gv-font-num);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* 可选 1 行 JS：renderMiniBar 里把上限包一层 <span class="mvu-game-value-max">，主次立刻分明 */
    .mvu-game-value .mvu-game-value-max {
      font-size: var(--fs-xs);
      font-weight: 400;
      color: var(--gv-faint);
      margin-left: -4px;
    }
    .mvu-game-track {
      height: 8px;
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
      background: var(--mvu-track, rgba(255, 255, 255, 0.05));
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .mvu-game-track::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(90deg, transparent 0 9px, rgba(0, 0, 0, 0.55) 9px 10px);
    }
    .mvu-game-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--gv-gold), transparent 45%), var(--gold-bright));
      min-width: 2px;
      box-shadow: 0 0 12px rgba(214, 178, 95, 0.25);
      transition: width var(--gv-base) var(--gv-ease), background var(--gv-base) var(--gv-ease);
    }
    /* 低值/中段警示：填充色 + 数值色 + 呼吸同时生效 */
    .mvu-game-bar-low .mvu-game-fill {
      background: linear-gradient(90deg, color-mix(in srgb, var(--gv-danger), transparent 55%), var(--gv-danger));
      animation: mvuGvBarBreathe 3.2s ease-in-out infinite;
    }
    .mvu-game-bar-low .mvu-game-value { color: var(--gv-danger); }
    .mvu-game-bar-mid .mvu-game-fill {
      background: linear-gradient(90deg, color-mix(in srgb, var(--gv-warn), transparent 55%), var(--gv-warn));
    }
    .mvu-game-bar-mid .mvu-game-value { color: var(--gv-warn); }
    @keyframes mvuGvBarBreathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    .mvu-game-empty {
      padding: 26px 10px;
      text-align: center;
      color: var(--gv-faint);
      font-size: var(--fs-sm);
      border: 0;
      border-radius: var(--gv-radius);
      background: var(--gv-sunken);
    }
    /* 游戏视图更新落地时的 shimmer（与通用视图同一套语义） */
    .mvu-game-view.mvu-streaming .mvu-game-bar-card,
    .mvu-game-view.mvu-streaming .mvu-game-entry.active {
      animation: mvuShimmer 1.25s linear infinite;
      background-image: linear-gradient(100deg, transparent 34%, color-mix(in srgb, var(--gv-gold), transparent 88%) 50%, transparent 66%);
      background-size: 220% 100%;
      background-repeat: no-repeat;
    }
    /* 窄屏：单列 + 紧凑间距，避免标签/数值/按钮挤压。
       标签文字保留（用户要求顶栏显示中文），只缩小字号与图标。 */
    @media (max-width: 460px) {
      .mvu-game-view { gap: 10px; padding: 10px; }
      .mvu-game-tab { font-size: var(--fs-xs); gap: 2px; min-height: 42px; }
      .mvu-game-tab svg { width: 13px; height: 13px; }
      .mvu-game-section-count { font-size: var(--fs-xs); }
      .mvu-game-modal-attr { grid-template-columns: 62px minmax(0, 1fr); }
      .mvu-game-title { font-size: var(--fs-xl); }
    }
    /* 无障碍：尊重系统的减少动态效果设置 */
    @media (prefers-reduced-motion: reduce) {
      .mvu-game-pane,
      .mvu-game-modal,
      .mvu-game-modal-card { animation: none; }
      .mvu-game-view.mvu-streaming .mvu-game-bar-card,
      .mvu-game-view.mvu-streaming .mvu-game-entry.active { animation: none; background-image: none; }
      .mvu-game-bar-low .mvu-game-fill { animation: none; }
      .mvu-game-change-chip:hover { background: transparent; }
    }

    .mvu-interactive {
      cursor: pointer;
      position: relative;
      transition: background-color 0.18s ease, outline-color 0.18s ease, transform 0.18s ease;
      outline: 1px solid transparent;
      outline-offset: 2px;
    }
    .mvu-interactive:hover,
    .mvu-interactive:focus-visible {
      outline-color: rgba(214,178,95,0.42);
      background-color: rgba(214,178,95,0.08);
    }
    .mvu-detail-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--overlay-scrim);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s var(--ease-silk);
    }
    .mvu-detail-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    /* 角色卡 / 详情卡：玄金典册样式 */
    .mvu-detail-card {
      --mvu-bg: var(--bg-deep);
      --mvu-panel: var(--bg-surface);
      --mvu-card: rgba(0,0,0,0.22);
      --mvu-accent: var(--accent-bright);
      --mvu-accent-2: var(--jade-accent);
      --mvu-text: var(--text-primary);
      --mvu-muted: var(--text-muted);
      --mvu-border: var(--gold-border);
      --mvu-radius: 16px;
      --mvu-shadow: var(--shadow-floating);
      width: min(430px, 92vw);
      max-height: min(680px, 88vh);
      overflow: auto;
      position: relative;
      border: 1px solid var(--mvu-border);
      border-radius: var(--mvu-radius);
      background:
        var(--mvu-texture, radial-gradient(circle at 20% 8%, rgba(214,178,95,0.10), transparent 34%)),
        linear-gradient(180deg, var(--mvu-panel), var(--mvu-bg));
      box-shadow: var(--mvu-shadow);
      transform: translateY(8px) scale(0.98);
      transition: transform 0.2s var(--ease-silk);
    }
    .mvu-detail-card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: 12px;
      pointer-events: none;
    }
    .mvu-detail-overlay.visible .mvu-detail-card {
      transform: translateY(0) scale(1);
    }
    .mvu-detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 22px 8px;
    }
    .mvu-detail-title {
      color: var(--mvu-accent);
      font-family: var(--font-display);
      font-size: var(--fs-2xl);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0.04em;
      word-break: break-word;
    }
    .mvu-detail-type {
      display: inline-flex;
      margin-top: 8px;
      width: fit-content;
      padding: 4px 11px;
      border-radius: var(--radius-full);
      color: var(--bg-void);
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright));
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .mvu-detail-close {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-full);
      background: rgba(0,0,0,0.22);
      color: var(--mvu-accent);
      font-size: var(--fs-xl);
      line-height: 1;
      cursor: pointer;
      transition: color var(--transition-smooth), border-color var(--transition-smooth), transform var(--transition-smooth);
    }
    .mvu-detail-close:hover {
      color: var(--mvu-accent);
      border-color: var(--gold-primary);
      transform: rotate(90deg);
    }
    .mvu-detail-body {
      display: grid;
      gap: 12px;
      padding: 10px 22px 22px;
    }
    .mvu-detail-desc {
      color: var(--mvu-text);
      font-family: var(--font-body);
      font-size: var(--fs-md);
      line-height: 1.78;
      white-space: pre-wrap;
    }
    .mvu-detail-grid {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: var(--radius);
      background: var(--mvu-card);
      border: 1px solid var(--gold-border-subtle);
    }
    .mvu-character-detail {
      display: grid;
      gap: 12px;
    }
    .mvu-character-detail-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mvu-character-detail-chip {
      max-width: 100%;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      background: rgba(214,178,95,0.06);
      border: 1px solid var(--gold-border-subtle);
      font-size: var(--fs-xs);
      line-height: 1.4;
      letter-spacing: 0.02em;
      word-break: break-word;
    }
    .mvu-character-detail-section {
      display: grid;
      gap: 7px;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--mvu-card);
      border: 1px solid var(--gold-border-subtle);
    }
    .mvu-character-detail-heading {
      color: var(--mvu-accent);
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      font-weight: 600;
      letter-spacing: 0.12em;
    }
    .mvu-character-detail-text {
      color: var(--mvu-text);
      font-family: var(--font-body);
      font-size: var(--fs-base);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .mvu-detail-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.022);
      font-size: var(--fs-sm);
      line-height: 1.6;
    }
    .mvu-detail-row span:first-child {
      color: var(--text-faint);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .mvu-detail-row span:last-child {
      color: var(--mvu-text);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .mvu-detail-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mvu-detail-actions .btn {
      min-height: 34px;
      padding: 7px 12px;
      font-size: var(--fs-sm);
    }
    .mvu-character-edit-form {
      display: grid;
      gap: 11px;
      padding: 12px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius);
      background: rgba(0,0,0,0.18);
    }
    .mvu-character-edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .mvu-character-edit-field {
      display: grid;
      gap: 5px;
    }
    .mvu-character-edit-field.full {
      grid-column: 1 / -1;
    }
    .mvu-character-edit-field label {
      color: var(--text-faint);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .mvu-character-edit-input,
    .mvu-character-edit-textarea {
      width: 100%;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.24);
      color: var(--mvu-text);
      padding: 9px 10px;
      font-size: var(--fs-base);
      line-height: 1.5;
      outline: none;
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
    }
    .mvu-character-edit-input:focus,
    .mvu-character-edit-textarea:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(214,178,95,0.10);
    }
    .mvu-character-edit-textarea {
      min-height: 78px;
      resize: vertical;
    }
    .mvu-character-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 560px) {
      .mvu-character-edit-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---- Summary Sidebar ---- */
    .summary-sidebar {
      width: 400px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(16px + env(safe-area-inset-top, var(--sat, 0px))) 16px 16px;
      transform: translateX(0);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.35s ease,
                  width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }
    .summary-sidebar.collapsed {
      width: 0;
      padding: 0;
      opacity: 0;
      transform: translateX(400px);
      border-left: none;
      overflow: hidden;
    }
    .summary-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .summary-sidebar-title {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--mvu-accent);
      letter-spacing: 0.3px;
    }
    .summary-big-block {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
    }
    .summary-block-title {
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .summary-block-content {
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      line-height: 1.7;
      color: var(--mvu-text);
    }
    .summary-abstracts-title {
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .summary-abstract-block {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      align-items: flex-start;
    }
    .summary-abstract-code {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 8px;
      border-radius: 8px;
      flex-shrink: 0;
      letter-spacing: 0.5px;
      line-height: 1.6;
    }
    .summary-abstract-content {
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .summary-merged {
      border-color: var(--accent-glow);
      background: rgba(214, 178, 95, 0.06);
    }
    .summary-sm-code {
      background: var(--accent-glow);
      color: var(--bg-deep);
      font-weight: 800;
    }
    .summary-empty {
      text-align: center;
      padding: 32px 12px;
      color: var(--text-muted);
      font-size: var(--fs-base);
      font-style: italic;
      line-height: 1.6;
    }

    /* ---- Prompt Drawer (quick toggle for preset entries) ---- */
    .prompt-drawer {
      width: 340px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(16px + env(safe-area-inset-top, var(--sat, 0px))) 16px 16px;
      transform: translateX(0);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.35s ease,
                  width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }
    .prompt-drawer.collapsed {
      width: 0;
      padding: 0;
      opacity: 0;
      transform: translateX(340px);
      border-left: none;
      overflow: hidden;
    }
    .prompt-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .prompt-drawer-title {
      font-family: var(--font-display);
      font-size: var(--fs-md);
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .prompt-drawer-meta {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .prompt-drawer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      user-select: none;
    }
    .prompt-drawer-row:hover { background: rgba(255,255,255,0.03); }
    .prompt-drawer-row.is-on .prompt-drawer-name { color: var(--text-primary); }
    .prompt-drawer-row .prompt-drawer-name { color: var(--text-muted); flex: 1; font-size: var(--fs-sm); line-height: 1.3; word-break: break-all; }
    .prompt-drawer-toggle {
      width: 16px; height: 16px; border-radius: 3px;
      border: 1px solid var(--border);
      background: transparent;
      flex-shrink: 0;
