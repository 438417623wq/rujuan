function setMvuGameTab(tab) {
  mvuGameTab = ['character', 'inventory', 'skills', 'quests', 'world'].includes(tab) ? tab : 'character';
  // 切换标签后原详情条目已不在当前面板，先关闭避免展示过期内容
  if (mvuGameDetailOpen) closeMvuGameDetail();
  renderMvuSidebar();
}

function selectMvuGameItem(tab, id) {
  if (!['character', 'inventory', 'skills', 'quests', 'world'].includes(tab)) return;
  mvuGameSelection[tab] = id;
  renderMvuSidebar();
}

function openMvuGameDetail(tab, id) {
  if (!['player', 'character', 'inventory', 'skills', 'quests', 'world'].includes(tab)) return;
  mvuGameSelection[tab] = id;
  mvuGameDetailOpen = true;
  MVUGameRenderer.openDetail(tab, id);
}

function closeMvuGameDetail() {
  mvuGameDetailOpen = false;
  const overlay = document.getElementById('mvuGameDetailOverlay');
  if (overlay) overlay.classList.remove('visible');
}

function handleMvuSearch(value) {
  mvuSearchQuery = value || '';
  renderMvuSidebar();
}

function refreshMvuSidebar() {
  renderMvuSidebar();
  UI.showToast('状态栏已刷新', 'success');
}

function markMvuFieldsChanged(fields) {
  if (!conversation?.mvu) return;
  conversation.mvu._changedFields = [...new Set((fields || []).filter(Boolean))];
}

// AI 常写错字段路径（/HP、/player.hp、/health…）。历史实现把这些一并当成"已更新"，
// 于是既触发了变化动效、又让诊断误判为成功。这里统一拆成「真实字段」与「不存在的字段」。
function partitionMvuFields(touchedFields) {
  const schema = conversation?.mvu?.schema || {};
  const state = conversation?.mvu?.state || {};
  const known = f => !!f && (f in schema || f in state);
  const uniq = [...new Set((touchedFields || []).filter(Boolean))];
  return {
    changedFields: uniq.filter(known),
    unknownFields: uniq.filter(f => !known(f)),
  };
}

// ============================================================
// MVU Update Diagnostics
// 状态栏不随正文更新时，区分三类静默失败并给出可操作提示。
// 历史实现三者全部静默，用户只能看到「状态栏没动」。
// ============================================================
function setMvuDiagnostic(info) {
  mvuDiagnostic = info ? { ...info, time: Date.now() } : null;
  if (info) log('[MVU Diagnostic]', info.kind, info.message);
}

function clearMvuDiagnostic() {
  mvuDiagnostic = null;
}

// ============================================================
// B2: 状态栏更新落地时的 shimmer 高亮
// 更新写入后给根元素加 .mvu-streaming，让刚变化的字段走一遍扫光，
// 时间到自动摘除（避免长期占用动画帧）。
// ============================================================
let mvuShimmerTimer = null;

function flashMvuStreaming(duration = 1600) {
  const container = document.getElementById('mvuContent');
  if (!container) return;
  const root = container.querySelector('.mvu-root')
    || container.querySelector('.mvu-game-view')
    || container.firstElementChild;
  if (!root) return;
  root.classList.add('mvu-streaming');
  if (mvuShimmerTimer) clearTimeout(mvuShimmerTimer);
  mvuShimmerTimer = setTimeout(() => {
    container.querySelectorAll('.mvu-streaming').forEach(el => el.classList.remove('mvu-streaming'));
    mvuShimmerTimer = null;
  }, duration);
}

const MVU_DIAGNOSTIC_META = {
  'no-block': { level: 'warn', title: '本轮无状态栏更新' },
  'parse-failed': { level: 'error', title: '状态栏更新解析失败' },
  'no-effect': { level: 'warn', title: '状态栏更新未命中任何字段' },
};

function renderMvuDiagnostic() {
  if (!mvuDiagnostic) return '';
  const meta = MVU_DIAGNOSTIC_META[mvuDiagnostic.kind] || { level: 'warn', title: '状态栏更新异常' };
  const canRetry = mvuDiagnostic.kind === 'parse-failed' || mvuDiagnostic.kind === 'no-effect';
  return `<div class="mvu-diagnostic ${meta.level}">
    <div class="mvu-diagnostic-body">
      <strong>${Utils.escapeHtml(meta.title)}</strong>
      <span>${Utils.escapeHtml(mvuDiagnostic.message || '')}</span>
    </div>
    <div class="mvu-diagnostic-actions">
      ${canRetry ? `<button class="mvu-diagnostic-btn" onclick="retryMvuParse()">重新解析</button>` : ''}
      <button class="mvu-diagnostic-btn ghost" onclick="dismissMvuDiagnostic()">知道了</button>
    </div>
  </div>`;
}

function dismissMvuDiagnostic() {
  clearMvuDiagnostic();
  renderMvuToolbar();
}

/**
 * 对最近一条 AI 回复重新跑一次状态栏解析。
 * 适用于：流式中断导致代码块被截断、当时解析失败、或用户手动修补过回复内容。
 */
function retryMvuParse() {
  if (conversation?.phase !== 'rp') return;
  const lastAi = [...(conversation.messages || [])].reverse().find(m => m.role === 'assistant' && m.content);
  if (!lastAi) { UI.showToast('找不到可重新解析的 AI 回复', 'error'); return; }
  const before = JSON.stringify(conversation.mvu?.state || {});
  processMvuFromResponse(lastAi.content, lastAi);
  const after = JSON.stringify(conversation.mvu?.state || {});
  if (after !== before) {
    Storage.saveConversation(conversation);
    renderMvuSidebar();
    UI.showToast('已重新解析并应用状态栏更新', 'success');
  } else if (!mvuDiagnostic) {
    UI.showToast('重新解析完成，但没有产生变化', 'info');
  }
}

function cloneMvuState() {
  return JSON.parse(JSON.stringify(conversation?.mvu?.state || {}));
}

function stableMvuValue(value) {
  return JSON.stringify(value === undefined ? null : value);
}

function recordMvuChanges(beforeState, fields, source = 'ai') {
  if (!conversation?.mvu?.state) return;
  const schema = conversation.mvu.schema || {};
  const afterState = conversation.mvu.state || {};
  const targetFields = [...new Set((fields && fields.length ? fields : Object.keys(afterState)).filter(Boolean))];
  const changes = [];
  for (const field of targetFields) {
    const before = beforeState ? beforeState[field] : undefined;
    const after = afterState[field];
    if (stableMvuValue(before) === stableMvuValue(after)) continue;
    const def = schema[field] || {};
    changes.push({
      field,
      label: def.label || field,
      type: def.type || (Array.isArray(after) ? 'list' : typeof after),
      before,
      after,
      delta: getMvuChangeDelta(before, after),
      source,
      time: Date.now(),
    });
  }
  conversation.mvu._lastChanges = changes;
}

function getMvuChangeDelta(before, after) {
  if (typeof before === 'number' && typeof after === 'number') {
    const diff = after - before;
    if (diff > 0) return `+${diff}`;
    if (diff < 0) return String(diff);
    return '0';
  }
  if (Array.isArray(before) && Array.isArray(after)) {
    const diff = after.length - before.length;
    if (diff > 0) return `新增 ${diff}`;
    if (diff < 0) return `删除 ${Math.abs(diff)}`;
    return '修改';
  }
  if (before === undefined || before === null || before === '') return '新增';
  if (after === undefined || after === null || after === '') return '清空';
  return '修改';
}

function handleMvuFieldInput(field, type, value) {
  if (!conversation?.mvu?.state || !(field in conversation.mvu.state)) return;
  const beforeState = cloneMvuState();
  let nextValue = value;
  if (type === 'number' || type === 'bar') {
    const parsed = Number(value);
    nextValue = Number.isFinite(parsed) ? parsed : 0;
  }
  conversation.mvu.state[field] = nextValue;
  markMvuFieldsChanged([field]);
  recordMvuChanges(beforeState, [field], 'manual');
  syncMvuHtmlWithState();
  Storage.saveConversation(conversation);
  renderMvuSidebar();
}

function handleMvuListItemInput(field, index, value) {
  if (!Array.isArray(conversation?.mvu?.state?.[field])) return;
  const beforeState = cloneMvuState();
  const oldValue = conversation.mvu.state[field][index];
  let nextValue = value;
  if (oldValue && typeof oldValue === 'object') {
    try { nextValue = JSON.parse(value); } catch { nextValue = value; }
  }
  conversation.mvu.state[field][index] = nextValue;
  markMvuFieldsChanged([field]);
  recordMvuChanges(beforeState, [field], 'manual');
  syncMvuHtmlWithState();
  Storage.saveConversation(conversation);
  renderMvuSidebar();
}

function addMvuListItem(field) {
  if (!Array.isArray(conversation?.mvu?.state?.[field])) return;
  const beforeState = cloneMvuState();
  const list = conversation.mvu.state[field];
  const sample = list.find(item => item && typeof item === 'object');
  if (sample) {
    const next = {};
    for (const [key, value] of Object.entries(sample)) {
      if (key === 'id') next[key] = `${field}_${Date.now()}`;
      else if (typeof value === 'number') next[key] = 0;
      else next[key] = '';
    }
    list.push(next);
  } else {
    list.push('');
  }
  markMvuFieldsChanged([field]);
  recordMvuChanges(beforeState, [field], 'manual');
  syncMvuHtmlWithState();
  Storage.saveConversation(conversation);
  renderMvuSidebar();
}

function removeMvuListItem(field, index) {
  if (!Array.isArray(conversation?.mvu?.state?.[field])) return;
  const beforeState = cloneMvuState();
  conversation.mvu.state[field].splice(index, 1);
  markMvuFieldsChanged([field]);
  recordMvuChanges(beforeState, [field], 'manual');
  syncMvuHtmlWithState();
  Storage.saveConversation(conversation);
  renderMvuSidebar();
}

function migrateMvuExpandableCollections() {
  const mvu = conversation?.mvu;
  if (!mvu?.state || !mvu?.schema) return false;
  let changed = false;
  const state = mvu.state;
  const schema = mvu.schema;

  if (state.main_quest && !Array.isArray(state.main_quests)) {
    schema.main_quests = schema.main_quests || {
      type: 'list',
      label: '主线任务',
      group: '任务',
      rule: '新增主线阶段时追加对象；推进、完成或失败时更新对应对象，不要覆盖其他任务',
    };
    state.main_quests = [{
      id: 'main_quest_1',
      title: '主线任务',
      status: '进行中',
      objective: String(state.main_quest || ''),
      progress: String(state.main_quest || ''),
      notes: '',
    }];
    changed = true;
  }

  const legacyCharacterFields = Object.keys(state).filter(key => /_(name|profile|outfit|affection|relation|personality|attitude|thoughts|location|status|role|identity|desc|description|note)$/.test(key));
  const profileFields = Object.keys(state).filter(key => /_profile$/.test(key));
  if ((profileFields.length || legacyCharacterFields.length) && !Array.isArray(state.characters)) {
    schema.characters = schema.characters || {
      type: 'list',
      label: '角色档案',
      group: '角色',
      rule: '遇到新角色时追加对象；角色关系、状态、位置或想法变化时更新对应对象，不要把多个角色合并到一个档案',
    };
    // 实例声明的中文显示名是权威来源（模板 HTML 的 ${name} 也用它）。
    // 从档案正文首句猜名字会把「青云宗内门弟子」当成姓名，必须让 instances 优先。
    const instanceNames = new Map((mvu.templateInstances || []).map(i => [i.id, i.name]));
    state.characters = profileFields.map(field => {
      const id = field.replace(/_profile$/, '');
      const profile = String(state[field] || '');
      const name = instanceNames.get(id)
        || profile.split(/\n|，|,|：|:/).map(s => s.trim()).find(Boolean) || id;
      return {
        id,
        name,
        profile,
        outfit: state[`${id}_outfit`] || '',
        affection: state[`${id}_affection`] ?? '',
        relation: state[`${id}_relation`] || '',
        personality: state[`${id}_personality`] || '',
        attitude: state[`${id}_attitude`] || '',
        thoughts: state[`${id}_thoughts`] || '',
        location: state[`${id}_location`] || '',
      };
    });
    changed = true;
  }

  if (Array.isArray(state.characters)) {
    schema.characters = schema.characters || {
      type: 'list',
      label: '角色档案',
      group: '角色',
      rule: '遇到新角色时追加对象；角色关系、状态、位置或想法变化时更新对应对象，不要把多个角色合并到一个档案',
    };
    const before = JSON.stringify(state.characters);
    const protectedIds = new Set((mvu.templateInstances || []).map(i => i.id));
    state.characters = normalizeMvuCharacters(state.characters, state, schema, protectedIds);
    // instances 声明的显示名始终压过任何推断结果：normalizeMvuCharacters 会从档案
    // 正文首句猜名字，把「青云宗内门弟子」这类身份描述误当成姓名。
    const declaredNames = new Map((mvu.templateInstances || []).map(i => [i.id, i.name]));
    if (declaredNames.size) {
      for (const character of state.characters) {
        const declared = declaredNames.get(character.id);
        if (declared && declared !== character.id) character.name = declared;
      }
    }
    if (JSON.stringify(state.characters) !== before) changed = true;
  }

  return changed;
}

function normalizeMvuCharacters(characters, state, schema, protectedIds = null) {
  const knownKeys = ['name', 'profile', 'outfit', 'affection', 'relation', 'personality', 'attitude', 'thoughts', 'location', 'status', 'role', 'identity', 'desc', 'description', 'note'];
  const byId = new Map();
  const addCharacter = (id, data = {}) => {
    const safeId = String(id || data.id || data.name || `character_${byId.size + 1}`).trim();
    if (!safeId) return null;
    const current = byId.get(safeId) || { id: safeId };
    for (const [key, value] of Object.entries(data)) {
      if (value !== undefined && value !== null && value !== '') current[key] = value;
    }
    byId.set(safeId, current);
    return current;
  };

  for (const item of characters || []) {
    if (!item || typeof item !== 'object') {
      addCharacter('', { name: String(item || '') });
      continue;
    }
    const id = item.id || item.key || item.name || item.title || `character_${byId.size + 1}`;
    const normalized = { id: String(id) };
    for (const [key, value] of Object.entries(item)) {
      const prefixed = String(key).match(/^(.+)_(name|profile|outfit|affection|relation|personality|attitude|thoughts|location|status|role|identity|desc|description|note)$/);
      if (prefixed && String(id) === prefixed[1]) normalized[prefixed[2]] = value;
      else normalized[key] = value;
    }
    if (!normalized.name && normalized.title) normalized.name = normalized.title;
    addCharacter(normalized.id, normalized);
  }

  const legacyPattern = /^(.+)_(name|profile|outfit|affection|relation|personality|attitude|thoughts|location|status|role|identity|desc|description|note)$/;
  for (const [field, value] of Object.entries(state || {})) {
    const match = field.match(legacyPattern);
    if (!match) continue;
    const [, id, key] = match;
    addCharacter(id, { [key]: value });
  }

  const result = [...byId.values()].map((character, index) => {
    const id = character.id || `character_${index + 1}`;
    const cleaned = { id };
    for (const key of knownKeys) {
      const prefixedKey = `${id}_${key}`;
      if (character[key] !== undefined && character[key] !== null && character[key] !== '') cleaned[key] = character[key];
      else if (character[prefixedKey] !== undefined && character[prefixedKey] !== null && character[prefixedKey] !== '') cleaned[key] = character[prefixedKey];
    }
    if (!cleaned.name || cleaned.name === cleaned.id) {
      // 拼音 id 不配当显示名：优先 title/label，再从档案文本提取姓名片段。
      // 全部失败才保留 id，UI 层 displayName 还会再做一层提取兜底。
      const fallbackName = character.title || character.label
        || MVUGameRenderer.characterName(character.profile ?? character.desc ?? character.description ?? character.identity ?? character.role ?? '');
      cleaned.name = fallbackName || id;
    }
    for (const [key, value] of Object.entries(character)) {
      if (key === 'id' || knownKeys.includes(key) || key.startsWith(`${id}_`)) continue;
      if (value !== undefined && value !== null && value !== '') cleaned[key] = value;
    }
    return cleaned;
  });

  for (const field of Object.keys(state || {})) {
    if (!legacyPattern.test(field)) continue;
    // 模板实例的扁平字段是 data-field="<id>_<字段>" 绑定的唯一数据源，
    // 删掉它们模板 HTML 里的占位就永远填不上（好感、档案全空）。
    // 只有从旧式扁平字段迁移过来、没有模板实例兜着的才清理。
    const fieldId = field.match(legacyPattern)[1];
    if (protectedIds && protectedIds.has(fieldId)) continue;
    delete state[field];
    if (schema) delete schema[field];
  }

  return result;
}

function syncMvuHtmlWithState() {
  const mvu = conversation?.mvu;
  if (!mvu?.html) return false;

  const host = document.createElement('div');
  host.innerHTML = mvu.html;
  host.querySelectorAll('[data-auto-sync="1"]').forEach(el => el.remove());
  const nextHtml = host.innerHTML;
  if (nextHtml !== mvu.html) {
    mvu.html = nextHtml;
    return true;
  }
  return false;
}

function isInternalMvuField(field) {
  return /^(templates?|templateInstances|schema|html|css)$/i.test(field)
    || /^_/.test(field)
    || /(_template|_templates|_instances|_schema|_html|_css)$/i.test(field);
}

function getMvuBoundFields(html) {
  return getMvuBindingSets(html).all;
}

function getMvuBindingSets(html) {
  const host = document.createElement('div');
  host.innerHTML = html || '';
  const direct = new Set();
  const list = new Set();
  const bar = new Set();
  host.querySelectorAll('[data-field]').forEach(el => direct.add(el.dataset.field));
  host.querySelectorAll('[data-field-list]').forEach(el => list.add(el.dataset.fieldList));
  host.querySelectorAll('[data-field-bar]').forEach(el => bar.add(el.dataset.fieldBar));
  return { direct, list, bar, all: new Set([...direct, ...list, ...bar]) };
}

function getUnboundMvuFields(fields = null) {
  const mvu = conversation?.mvu;
  if (!mvu?.state || !mvu?.html) return [];
  const bindings = getMvuBindingSets(mvu.html);
  const targets = Array.isArray(fields) && fields.length ? fields : Object.keys(mvu.state);
  return [...new Set(targets)]
    .filter(field => field in mvu.state)
    .filter(field => {
      if (isInternalMvuField(field)) return false;
      const value = mvu.state[field];
      if (Array.isArray(value)) return !bindings.list.has(field);
      return !bindings.all.has(field);
    });
}

function getMvuFieldDisplayGroup(field, def = {}, value) {
  const haystack = `${field} ${def.label || ''} ${def.group || ''}`.toLowerCase();
  if (/main_quests|main_quest|主线/.test(haystack)) return { key: 'quests-main', title: '主线任务', hint: '当前主线推进' };
  if (/side_quests|side_quest|支线/.test(haystack)) return { key: 'quests-side', title: '支线任务', hint: '支线与委托' };
  if (/quest|task|任务|委托|目标/.test(haystack)) return { key: 'quests', title: '任务记录', hint: '当前目标' };
  if (/characters|character|npc|profile|role|角色|人物|关系/.test(haystack)) return { key: 'characters', title: '角色档案', hint: '人物关系与状态' };
  if (/inventory|items|item|bag|weapon|armor|equipment|物品|道具|装备|背包/.test(haystack)) return { key: 'items', title: '物品行囊', hint: '道具与装备' };
  if (/skill|ability|spell|talent|技能|法术|功法|天赋/.test(haystack)) return { key: 'skills', title: '能力技艺', hint: '技能与成长' };
  if (/location|place|map|world|time|weather|地点|位置|地图|世界|时间|天气/.test(haystack)) return { key: 'world', title: '世界状态', hint: '环境与位置' };
  if (def.type === 'bar' || typeof value === 'number') return { key: 'status', title: '状态概览', hint: '数值状态' };
  return { key: 'notes', title: '状态记录', hint: '补充信息' };
}

function createMvuManagedFieldHtml(field, def = {}, value) {
  const type = def.type || (Array.isArray(value) ? 'list' : typeof value === 'number' ? 'number' : 'text');
  const label = Utils.escapeHtml(def.label || field);
  const safeField = Utils.escapeHtml(field);
  if (type === 'list' || Array.isArray(value)) {
    const renderAs = field === 'characters' ? ' data-render-as="character-cards"' : '';
    return `<div class="mvu-field mvu-managed-field" data-mvu-detail data-mvu-title="${label}" data-mvu-field="${safeField}"><div class="mvu-label">${label}</div><div class="mvu-list" data-field-list="${safeField}"${renderAs}></div></div>`;
  }
  if (type === 'bar') {
    const max = Utils.escapeHtml(String(def.max || 100));
    return `<div class="mvu-field mvu-managed-field" data-mvu-detail data-mvu-title="${label}" data-mvu-field="${safeField}"><div class="mvu-label">${label}</div><div class="mvu-value" data-field="${safeField}"></div><div class="mvu-bar-track" aria-valuemax="${max}"><span class="mvu-bar-fill" data-field-bar="${safeField}"></span></div></div>`;
  }
  return `<div class="mvu-field mvu-managed-field" data-mvu-detail data-mvu-title="${label}" data-mvu-field="${safeField}"><div class="mvu-label">${label}</div><div class="mvu-value" data-field="${safeField}"></div></div>`;
}

function findMvuSemanticSection(host, key) {
  if (!host) return null;
  const managed = host.querySelector(`[data-mvu-managed-section="${key}"], [data-mvu-section="${key}"]`);
  if (managed) return managed;
  const list = key === 'characters' ? host.querySelector('[data-field-list="characters"]') : null;
  if (list) return list.closest('.mvu-section, details, section, article, .mvu-panel, div') || list;
  const labels = key === 'characters' ? ['角色档案', '角色', '人物关系'] : [];
  if (!labels.length) return null;
  const FIELD_BINDING = '[data-field], [data-field-list], [data-field-bar]';
  // 一个容器只有「自身不含字段绑定，且祖先里也没有」才算空闲，允许被认领。
  // AI 常写 `<div class="mvu-section"><div class="mvu-section-title">角色状态</div>…hp/mp…</div>`，
  // 标题文本本身含「角色」二字：历史实现把这个标题节点整段 innerHTML 换成角色区块，
  // 「角色状态」连同其兄弟字段一起被抹掉。空闲判定同时挡住「含字段」与「被字段区块包住」两种劫持。
  const isVacant = el => {
    if (el.querySelector(FIELD_BINDING)) return false;
    for (let node = el.parentElement; node && node !== host.parentElement; node = node.parentElement) {
      if (node.querySelector(FIELD_BINDING)) return false;
    }
    return true;
  };
  const candidates = [...host.querySelectorAll('.mvu-section, details, section, article, .mvu-panel, div')]
    .filter(el => el !== host && isVacant(el))
    .sort((a, b) => (a.textContent || '').length - (b.textContent || '').length);
  return candidates.find(el => labels.some(label => (el.textContent || '').includes(label))) || null;
}

function upgradeMvuSemanticSection(host, key, field, def, value) {
  const group = getMvuFieldDisplayGroup(field, def, value);
  const sections = [...host.querySelectorAll(`[data-mvu-managed-section="${key}"], [data-mvu-section="${key}"]`)];
  const found = findMvuSemanticSection(host, key);
  let section = found || sections[0];
  if (!section) return null;

  for (const duplicate of sections) {
    if (duplicate !== section && !duplicate.contains(section)) duplicate.remove();
  }

  section.classList.add('mvu-section', 'mvu-managed-section');
  section.dataset.mvuManagedSection = key;
  section.dataset.mvuSection = key;
  if (section.tagName === 'DETAILS') section.open = true;
  section.innerHTML = `<summary><span>${Utils.escapeHtml(group.title)}</span><small>${Utils.escapeHtml(group.hint)}</small></summary><div class="mvu-managed-body">${createMvuManagedFieldHtml(field, def, value)}</div>`;
  return section;
}

function ensureMvuHtmlBindings(fields = []) {
  const mvu = conversation?.mvu;
  if (!mvu?.state) return [];
  if (!mvu.html) mvu.html = '<div class="mvu-root"></div>';

  const missing = getUnboundMvuFields(fields);
  if (!missing.length) return [];

  const host = document.createElement('div');
  host.innerHTML = mvu.html;
  let root = host.firstElementChild;
  if (!root) {
    root = document.createElement('div');
    root.className = 'mvu-root';
    host.appendChild(root);
  }

  const repaired = [];
  for (const field of missing) {
    const value = mvu.state[field];
    const def = mvu.schema?.[field] || {};
    const group = getMvuFieldDisplayGroup(field, def, value);
    let section = upgradeMvuSemanticSection(host, group.key, field, def, value) || host.querySelector(`[data-mvu-managed-section="${group.key}"]`);
    if (!section) {
      section = document.createElement('details');
      section.className = 'mvu-section mvu-managed-section';
      section.dataset.mvuManagedSection = group.key;
      section.dataset.mvuSection = group.key;
      section.open = true;
      section.innerHTML = `<summary><span>${Utils.escapeHtml(group.title)}</span><small>${Utils.escapeHtml(group.hint)}</small></summary><div class="mvu-managed-body"></div>`;
      root.appendChild(section);
    }
    const hasBinding = section.querySelector(`[data-field="${field}"], [data-field-list="${field}"], [data-field-bar="${field}"]`);
    if (!hasBinding) {
      const body = section.querySelector('.mvu-managed-body') || section;
      body.insertAdjacentHTML('beforeend', createMvuManagedFieldHtml(field, def, value));
    }
    repaired.push(field);
  }

  if (repaired.length) mvu.html = host.innerHTML;
  return repaired;
}

function auditMvuStructure() {
  const mvu = conversation?.mvu;
  const result = {
    unboundFields: [],
    duplicateBindings: [],
    staleBindings: [],
    legacyFields: [],
    conflictingCollections: [],
    staticSections: [],
  };
  if (!mvu?.state) return result;
  const state = mvu.state || {};
  const schema = mvu.schema || {};
  const host = document.createElement('div');
  host.innerHTML = mvu.html || '';
  const counts = new Map();
  const bump = field => {
    if (!field) return;
    counts.set(field, (counts.get(field) || 0) + 1);
    if (!(field in state)) result.staleBindings.push(field);
  };
  host.querySelectorAll('[data-field]').forEach(el => bump(el.dataset.field));
  host.querySelectorAll('[data-field-list]').forEach(el => bump(el.dataset.fieldList));
  host.querySelectorAll('[data-field-bar]').forEach(el => bump(el.dataset.fieldBar));
  result.duplicateBindings = [...counts.entries()].filter(([, count]) => count > 1).map(([field, count]) => ({ field, count }));
  result.unboundFields = getUnboundMvuFields();
  result.staleBindings = [...new Set(result.staleBindings)];
  result.legacyFields = Object.keys(state).filter(field => /_(name|profile|outfit|affection|relation|personality|attitude|thoughts|location|status|role|identity|desc|description|note)$/.test(field));
  if ('main_quest' in state && Array.isArray(state.main_quests)) result.conflictingCollections.push('main_quest/main_quests');
  if ('side_quest' in state && Array.isArray(state.side_quests)) result.conflictingCollections.push('side_quest/side_quests');
  for (const [field] of Object.entries(schema)) {
    if (!(field in state) && !isInternalMvuField(field)) result.staleBindings.push(`schema:${field}`);
  }
  const characterSection = findMvuSemanticSection(host, 'characters');
  if (characterSection && !characterSection.querySelector('[data-field-list="characters"]')) result.staticSections.push('characters');
  return result;
}

function normalizeMvuHtmlSections(fields = []) {
  const mvu = conversation?.mvu;
  if (!mvu?.html || !mvu?.state) return false;
  const host = document.createElement('div');
  host.innerHTML = mvu.html;
  let changed = false;
  const specs = [
    { key: 'characters', field: 'characters' },
    { key: 'quests-main', field: 'main_quests' },
    { key: 'quests-side', field: 'side_quests' },
  ];
  const targets = fields?.length ? new Set(fields) : null;

  for (const spec of specs) {
    if (targets && !targets.has(spec.field)) continue;
    if (!Array.isArray(mvu.state[spec.field])) continue;
    const def = mvu.schema?.[spec.field] || {};
    const value = mvu.state[spec.field];
    const selectors = [
      `[data-mvu-managed-section="${spec.key}"]`,
      `[data-mvu-section="${spec.key}"]`,
      `[data-field-list="${spec.field}"]`,
    ];
    let sections = [...host.querySelectorAll(selectors.join(','))]
      .map(el => el.matches('[data-field-list]') ? (el.closest('.mvu-section, details, section, article, .mvu-panel, div') || el) : el);
    sections = [...new Set(sections)].filter(Boolean);
    const semantic = findMvuSemanticSection(host, spec.key);
    if (semantic && !sections.includes(semantic)) sections.push(semantic);
    if (!sections.length) continue;

    const keep = sections.find(section => section.querySelector(`[data-field-list="${spec.field}"]`)) || sections[0];
    for (const section of sections) {
      if (section !== keep && !section.contains(keep)) {
        section.remove();
        changed = true;
      }
    }
    keep.classList.add('mvu-section', 'mvu-managed-section');
    keep.dataset.mvuManagedSection = spec.key;
    keep.dataset.mvuSection = spec.key;
    if (keep.tagName === 'DETAILS') keep.open = true;
    if (!keep.querySelector(`[data-field-list="${spec.field}"]`)) {
      const group = getMvuFieldDisplayGroup(spec.field, def, value);
      keep.innerHTML = `<summary><span>${Utils.escapeHtml(group.title)}</span><small>${Utils.escapeHtml(group.hint)}</small></summary><div class="mvu-managed-body">${createMvuManagedFieldHtml(spec.field, def, value)}</div>`;
      changed = true;
    }
  }

  const nextHtml = host.innerHTML;
  if (changed && nextHtml !== mvu.html) mvu.html = nextHtml;
  return changed;
}

function normalizeMvuStructure(fields = []) {
  const mvu = conversation?.mvu;
  if (!mvu?.state || !mvu?.schema) return { changed: false, repaired: [], audit: auditMvuStructure() };
  let changed = false;
  changed = migrateMvuExpandableCollections() || changed;
  changed = syncMvuHtmlWithState() || changed;

  const state = mvu.state;
  const schema = mvu.schema;
  if (Array.isArray(state.main_quests) && state.main_quest !== undefined) {
    delete state.main_quest;
    delete schema.main_quest;
    changed = true;
  }
  if (Array.isArray(state.side_quests) && state.side_quest !== undefined) {
    delete state.side_quest;
    delete schema.side_quest;
    changed = true;
  }
  for (const key of Object.keys(schema)) {
    if (!(key in state) && !isInternalMvuField(key)) {
      delete schema[key];
      changed = true;
    }
  }

  changed = normalizeMvuHtmlSections(fields) || changed;
  const repaired = ensureMvuHtmlBindings(fields);
  if (repaired.length) changed = true;
  return { changed, repaired, audit: auditMvuStructure() };
}

function warnUnboundMvuFields(prefix = '美化视图未同步', fields = null) {
  const missing = getUnboundMvuFields(fields);
  if (!missing.length) return false;
  UI.showToast(`${prefix}：${missing.slice(0, 3).join('、')}${missing.length > 3 ? ' 等' : ''}`, 'info');
  return true;
}

const MVUGameRenderer = {
  detailMap: new Map(),

  render(container, mvuData, options = {}) {
    if (!container || !mvuData) return;
    const opts = { ...options, changes: Array.isArray(mvuData._lastChanges) ? mvuData._lastChanges : [] };
    const model = this.buildModel(mvuData, opts);
    this.detailMap = new Map();
    // 重渲染会替换 innerHTML，连同详情弹窗节点一起销毁。若弹窗此前是打开的，
    // 记下当前条目并在渲染后恢复，避免更新落地时弹窗莫名消失。
    const openKey = mvuGameDetailOpen ? this.currentDetailKey() : '';
    if (mvuGameDetailOpen && !openKey) mvuGameDetailOpen = false;
    let html = '<div class="mvu-game-view">';
    html += this.renderHero(model);
    html += this.renderChangeSummary(model);
    html += this.renderTabs(model);
    html += `<div class="mvu-game-pane">${this.renderActivePane(model)}</div>`;
    html += this.renderDetailModal();
    html += '</div>';
    container.innerHTML = html;
    if (openKey) this.reopenDetail(openKey);
  },

  currentDetailKey() {
    const field = document.getElementById('mvuGameDetailOverlay')?.dataset?.key;
    return field || '';
  },

  reopenDetail(key) {
    const [tab, ...rest] = String(key).split(':');
    const id = rest.join(':');
    if (!tab || !id) return;
    const item = this.detailMap.get(`${tab}:${id}`);
    const overlay = document.getElementById('mvuGameDetailOverlay');
    const body = document.getElementById('mvuGameDetailBody');
    if (!item || !overlay || !body) { mvuGameDetailOpen = false; return; }
    body.innerHTML = this.renderGameDetail(item);
    overlay.classList.add('visible');
    overlay.dataset.key = key;
  },

  openDetail(tab, id) {
    const item = this.detailMap.get(`${tab}:${id}`);
    const overlay = document.getElementById('mvuGameDetailOverlay');
    const body = document.getElementById('mvuGameDetailBody');
    if (!item || !overlay || !body) return;
    body.innerHTML = this.renderGameDetail(item);
    overlay.classList.add('visible');
    overlay.dataset.key = `${tab}:${id}`;
  },

  buildModel(mvuData, options = {}) {
    const schema = mvuData.schema || {};
    const state = mvuData.state || {};
    const query = (options.query || '').trim().toLowerCase();
    const changes = Array.isArray(options.changes) ? options.changes : [];
    const changeMap = new Map();
    for (const change of changes) {
      if (change && change.field) changeMap.set(change.field, change);
    }
    const model = { player: [], world: [], characters: new Map(), inventory: [], quests: [], skills: [], other: [], changes, changeMap, hidden: 0 };

    for (const [field, value] of Object.entries(state)) {
      const def = schema[field] || {};
      const entry = { field, value, def, label: def.label || field, text: this.formatValue(value) };
      const category = this.classify(entry);
      // 角色集合是对象数组，必须按元素展开。查询过滤下沉到元素级，否则搜某个角色名
      // 会因为整条数组的文本不匹配而把全部角色一起藏掉。
      if (category === 'character' && Array.isArray(value)) {
        entry.change = changeMap.get(field) || null;
        this.addCharacters(model.characters, entry, query, model);
        continue;
      }
      const searchable = `${field} ${entry.label} ${entry.text}`.toLowerCase();
      if (query && !searchable.includes(query)) {
        model.hidden++;
        continue;
      }
      entry.change = changeMap.get(field) || null;

      if (category === 'inventory') this.pushListEntries(model.inventory, entry, 'item');
      else if (category === 'quest') this.pushListEntries(model.quests, entry, 'quest');
      else if (category === 'skill') this.pushListEntries(model.skills, entry, 'skill');
      else if (category === 'character') this.addCharacter(model.characters, entry);
      else if (category === 'world') model.world.push(entry);
      else if (category === 'player') model.player.push(entry);
      else model.other.push(entry);
    }

    model.characters = Array.from(model.characters.values());
    return model;
  },

  // 分类优先读 schema 元数据（category/group/section/type），关键词只作回退。
  // 历史实现纯靠字段名猜，命名特殊的字段（如 stamina_pool、dan_tian）会被错放或丢进 other。
  CATEGORY_ALIASES: {
    player: 'player', status: 'player', stats: 'player', vitals: 'player', 属性: 'player', 状态: 'player', 主角: 'player', 自身: 'player',
    character: 'character', characters: 'character', npc: 'character', people: 'character', relation: 'character', 人物: 'character', 角色: 'character', 好感: 'character', 关系: 'character',
    inventory: 'inventory', items: 'inventory', item: 'inventory', bag: 'inventory', equipment: 'inventory', 物品: 'inventory', 道具: 'inventory', 背包: 'inventory', 储物: 'inventory', 装备: 'inventory',
    quest: 'quest', quests: 'quest', task: 'quest', mission: 'quest', 任务: 'quest', 目标: 'quest', 委托: 'quest',
    skill: 'skill', skills: 'skill', ability: 'skill', spell: 'skill', 技能: 'skill', 功法: 'skill', 法术: 'skill', 术法: 'skill',
    world: 'world', scene: 'world', location: 'world', place: 'world', environment: 'world', 世界: 'world', 地点: 'world', 场景: 'world', 环境: 'world', 势力: 'world',
    other: 'other', misc: 'other', extra: 'other', 其他: 'other', 杂项: 'other',
  },

  normalizeCategory(raw) {
    if (!raw) return '';
    const key = String(raw).trim().toLowerCase();
    return this.CATEGORY_ALIASES[key] || this.CATEGORY_ALIASES[String(raw).trim()] || '';
  },

  classify(entry) {
    const def = entry.def || {};
    const value = entry.value;
    // 0) 防呆：AI 写 schema 时常把自身属性误标 group:"人物"。角色集合必然是数组或对象，
    //    数字永远不是角色；纯标量字符串若命中强自身字段词（境界/生命/灵石…）也不进人物页。
    const isScalar = value === null || value === undefined || ['string', 'number', 'boolean'].includes(typeof value);
    if (isScalar) {
      const key0 = `${entry.field} ${entry.label}`.toLowerCase();
      if (typeof value === 'number'
        || /realm|level|hp|mp|sp|gold|money|coin|exp|sanity|stamina|境界|修为|等级|生命|灵力|体力|理智|灵石|金钱|声望|经验|金币/.test(key0)) {
        return 'player';
      }
    }
    // 1) schema 显式声明优先
    for (const key of ['category', 'group', 'section', 'kind']) {
      const mapped = this.normalizeCategory(def[key]);
      if (mapped) return mapped;
    }
    const byType = this.normalizeCategory(def.type);
    if (byType) return byType;
    // 2) 关键词回退（兼容没有元数据的旧存档）
    const key = `${entry.field} ${entry.label}`.toLowerCase();
    if (/inventory|items|item|bag|equipment|weapon|armor|物品|道具|背包|装备|武器|防具/.test(key)) return 'inventory';
    if (/quest|task|objective|mission|任务|目标|委托|主线|支线/.test(key)) return 'quest';
    if (/skill|ability|spell|talent|技能|能力|法术|天赋|熟练|功法/.test(key)) return 'skill';
    if (/character|npc|role|profile|affection|relation|attitude|thought|outfit|角色|人物|好感|关系|态度|心理|服装/.test(key)) return 'character';
    if (/date|time|location|weather|environment|world|faction|place|时间|日期|地点|位置|天气|环境|世界|势力/.test(key)) return 'world';
    if (/hp|mp|sp|sanity|health|stamina|energy|hunger|exp|level|money|coin|gold|title|status|生命|体力|精力|理智|经验|等级|金钱|金币|称号|状态|灵石|修为|境界/.test(key)) return 'player';
    if (def.type === 'bar' || def.type === 'number' || typeof entry.value === 'number') return 'player';
    // 3) 无法判断 —— 保留在「其他」，不丢字段
    return 'other';
  },

  // 列表类字段（背包/任务/功法）的元素级变化定位：与角色集合共用同一套 key 规则，
  // 只有真正被改动/新增/删除的元素才挂徽标，而不是整列一起闪。
  pushListEntries(target, entry, type) {
    const change = entry.change || null;
    const changedKeys = change ? this.collectionChangedIds(change) : null;
    const push = (item, index) => {
      const itemChange = (change && (!changedKeys || changedKeys.has(this.characterKeyOf(item, index)))) ? change : null;
      target.push({ ...entry, item, index, type, id: this.idFor(type, entry.field, index), change: itemChange });
    };
    if (Array.isArray(entry.value)) entry.value.forEach(push);
    else push(entry.value, -1);
  },

  idFor(type, field, index = -1) {
    return `${type}:${encodeURIComponent(String(field || 'item'))}:${index}`;
  },

  // state.characters 是对象数组（提示词要求角色统一写入该数组）。
  // 历史实现把整条数组当成一个标量字段，标题被格式化成整串对象文本。
  // 这里按元素展开，每个角色一条，并把集合字段本身的 change 下发给受影响元素。
  addCharacters(map, entry, query = '', model = null) {
    const value = entry.value;
    const list = Array.isArray(value)
      ? value
      : (value && typeof value === 'object' ? Object.entries(value).map(([key, item]) => (
        item && typeof item === 'object' ? { id: key, ...item } : { id: key, name: item }
      )) : []);
    const change = entry.change || null;
    const changedIds = change ? this.collectionChangedIds(change) : null;
    list.forEach((item, index) => {
      const view = this.characterView(item, entry, index);
      if (!view) return;
      const searchable = `${entry.field} ${entry.label} ${view.title} ${view.text}`.toLowerCase();
      if (query && !searchable.includes(query)) {
        if (model) model.hidden++;
        return;
      }
      if (!map.has(view.id)) {
        // AI 追加式更新常用 <id>_2 / <id>_new 之类的新 id 重写同一个人（显示名不变）。
        // 显示名相同且 id 同源（一个是另一个的前缀）时并入既有组，否则人物页翻倍。
        let key = view.id;
        for (const existing of map.values()) {
          if (existing.title && existing.title === view.title && this.sameCharacterId(existing.id, view.id)) {
            key = existing.id;
            break;
          }
        }
        if (!map.has(key)) map.set(key, { id: key, title: view.title, fields: [], change: null, source: entry.field });
      }
      const group = map.get(view.id) || map.get([...map.values()].find(g => g.title === view.title && this.sameCharacterId(g.id, view.id))?.id || view.id);
      group.fields.push(...view.fields);
      if (view.title) group.title = view.title;
      // 只有真正被改动的角色才挂变化徽标，避免整组角色一起闪。
      if (change && (!changedIds || changedIds.has(view.rawId))) group.change = change;
    });
  },

  // 把一个数组元素规整成可渲染的角色视图：标题取 name/title，字段拆成 label/value 列表。
  characterView(item, entry, index) {
    const source = entry.field;
    if (item && typeof item === 'object' && !Array.isArray(item)) {
      const rawId = this.characterKeyOf(item, index);
      // 显示名兜底：name/title/label 缺失或干脆等于拼音 id 时，从档案文本提取，
      // 避免状态栏直接显示「lin_qingxue」这类字段前缀。
      const title = this.displayName(item, rawId) || String(rawId);
      // 组键不能带 source（字段名）前缀：AI 常把同一批角色写进 characters/npc 等
      // 多个集合字段，带前缀的组键会让同一角色跨字段重复显示（人物数翻倍）。
      // 优先用角色自身的稳定 id；缺 id（#index 兜底）时退回显示名，仍拿不到才用 source 区分。
      const id = !rawId.startsWith('#') ? rawId
        : (title && title !== String(rawId) ? `n:${title}` : `${source}:${rawId}`);
      const fields = [];
      for (const [key, value] of Object.entries(item)) {
        if (key === 'id' || key === 'key' || value === undefined || value === null || value === '') continue;
        if (key === 'name' || key === 'title') continue;
        // 兼容 normalizeMvuCharacters 未清理干净的 `<id>_profile` 式键名。
        const bare = String(key).startsWith(`${rawId}_`) ? String(key).slice(String(rawId).length + 1) : key;
        fields.push({ field: `${source}.${rawId}.${bare}`, label: this.prettyKey(bare), value, def: {}, change: null });
      }
      return { id, rawId, title, fields, text: this.formatValue(item), keys: Object.keys(item) };
    }
    if (item === undefined || item === null || item === '') return null;
    const rawId = this.characterKeyOf(item, index);
    const title = this.shortValue(item) || `${entry.label} ${index + 1}`;
    // 标量角色同样不带 source 前缀（与对象布局同一规则）：同名/同值即同人。
    const scalarId = item === undefined || item === null || item === '' ? `${source}:${rawId}`
      : (!String(rawId).startsWith('#') ? rawId : `s:${title}`);
    return {
      id: scalarId,
      rawId,
      title,
      fields: [{ field: `${source}.${rawId}`, label: entry.label, value: item, def: {}, change: null }],
      text: this.formatValue(item),
      keys: [],
    };
  },

  // 集合级变化（before/after 都是数组）时按元素比对，只给真正改动的角色挂徽标；
  // 拿不到可比对的数组（如「新增 1」这类笼统 delta）时退回全部标记。
  collectionChangedIds(change) {
    const before = change?.before;
    const after = change?.after;
    if (!Array.isArray(before) || !Array.isArray(after)) return null;
    const snapshot = list => {
      const map = new Map();
      list.forEach((item, index) => map.set(this.characterKeyOf(item, index), JSON.stringify(item ?? null)));
      return map;
    };
    const beforeMap = snapshot(before);
    const afterMap = snapshot(after);
    const changed = new Set();
    for (const [key, value] of afterMap) if (beforeMap.get(key) !== value) changed.add(key);
    for (const key of beforeMap.keys()) if (!afterMap.has(key)) changed.add(key);
    return changed;
  },

  // 角色元素的稳定标识：对象取 id/name，标量取自身值。展开与比对必须用同一套规则，
  // 否则变化徽标会错位到别的角色上。
  characterKeyOf(item, index) {
    if (item && typeof item === 'object' && !Array.isArray(item)) {
      return String(item.id || item.key || item.name || item.title || `#${index}`);
    }
    return item === undefined || item === null || item === '' ? `#${index}` : String(item);
  },

  // 同一角色的判定：id 相等，或一个是另一个的前缀且紧跟 _ 数字/字母后缀
  // （lin_qingxue vs lin_qingxue_2 / lin_qingxue_new，AI 追加更新的典型写法）。
  sameCharacterId(a, b) {
    const x = String(a || '').toLowerCase();
    const y = String(b || '').toLowerCase();
    if (!x || !y) return false;
    if (x === y) return true;
    const [short, long] = x.length <= y.length ? [x, y] : [y, x];
    return new RegExp(`^${short.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_\\w+$`).test(long);
  },

  // 显示名兜底链：name → title → label；若都缺失或只是把拼音 id 原样回填（AI 常忘填
  // 中文名），就从 profile/身份/描述文本里提取首个短片段。纯 ASCII 的 id 不该出现在 UI 上。
  displayName(item, rawId = '') {
    const idText = String(rawId || '').trim();
    const candidates = [item?.name, item?.title, item?.label];
    for (const c of candidates) {
      const text = c === undefined || c === null ? '' : String(c).trim();
      if (!text) continue;
      if (idText && text === idText) continue; // name === id，等于没填
      return text;
    }
    for (const key of ['profile', 'desc', 'description', 'identity', 'role', 'note']) {
      const name = this.characterName(item?.[key]);
      if (name && !(idText && name === idText)) return name;
    }
    return '';
  },

  addCharacter(map, entry) {
    // 数组型角色集合走 addCharacters；此处只处理「一个字段 = 一个角色」的 legacy 布局。
    if (Array.isArray(entry.value)) {
      this.addCharacters(map, entry);
      return;
    }
    const prefix = this.prefixOf(entry.field);
    const id = prefix || entry.field;
    if (!map.has(id)) map.set(id, { id, title: this.characterTitle(id, entry), fields: [], change: null });
    const group = map.get(id);
    // 拼音 id 不配做标题：允许 profile 等档案字段的首个片段改写它。
    if (/^[A-Za-z0-9_]+$/.test(group.title) || !group.title) group.title = '';
    group.fields.push(entry);
    // 只有档案/姓名类字段才允许改写标题，且必须是标量，避免把对象串当名字。
    const isIdentity = /profile|name|角色|人物|档案/.test(`${entry.field} ${entry.label}`.toLowerCase());
    if (isIdentity && entry.value && typeof entry.value !== 'object') {
      const title = this.characterName(entry.value) || group.title;
      if (title) group.title = title;
    }
    if (entry.change) group.change = entry.change;
  },

  // 档案文本通常是一整句描述，标题只取首个短片段（姓名），取不到就退回原值。
  characterName(value) {
    const text = this.formatValue(value).replace(/\s+/g, ' ').trim();
    if (!text) return '';
    const head = text.split(/[，,。；;：:\n]/).map(s => s.trim()).find(Boolean) || text;
    return head.length > 16 ? head.slice(0, 15) + '…' : head;
  },

  prefixOf(field) {
    const parts = String(field).split('_');
    return parts.length > 1 ? parts[0] : '';
  },

  characterTitle(id, entry) {
    if (entry.label && entry.label.includes(' - ')) return entry.label.split(' - ')[0];
    return id || entry.label || entry.field;
  },

  renderHero(model) {
    const location = model.world.find(e => /location|place|地点|位置/.test(`${e.field} ${e.label}`.toLowerCase()));
    const time = model.world.find(e => /date|time|日期|时间|时辰/.test(`${e.field} ${e.label}`.toLowerCase()));
    const weather = model.world.find(e => /weather|天象|天气|气候/.test(`${e.field} ${e.label}`.toLowerCase()));
    const realm = this.findFirst(model.player, /realm|level|cultivation|境界|修为|等级|称号/);
    const title = realm ? this.shortValue(realm.value) : '无名修士';
    // 环境行：所在 · 时辰 · 天象 合并为一行 muted 小字，不再拆成多个带标签的行。
    const envParts = [
      location ? this.shortValue(location.value) : '',
      time ? this.shortValue(time.value) : '',
      weather ? this.shortValue(weather.value) : '',
    ].filter(part => part && part !== '—');
    const env = envParts.join(' · ');
    // 只把「明确带上限或声明为 bar」的字段当资源条，避免把无上限数字伪装成百分比进度。
    const keyBars = model.player.filter(e => this.isBarEntry(e)).slice(0, 3);
    // 自身属性中既不是境界、又画不成资源条的（灵石/声望/经验…），压成一行紧凑属性。
    // 点击可展开详情，因此这里要同步登记到 detailMap，否则 openDetail 找不到条目。
    const barFields = new Set(keyBars.map(e => e.field));
    const extras = model.player.filter(e => e !== realm && !barFields.has(e.field)).slice(0, 8);
    const extrasHtml = extras.length ? `<div class="mvu-game-extra">${extras.map(entry => {
      const id = this.idFor('player', entry.field, -1);
      this.detailMap.set(`player:${id}`, {
        id, tab: 'player', iconType: 'status',
        title: entry.label,
        type: entry.def.type === 'bar' ? '状态条' : '状态',
        icon: this.firstChar(entry.label),
        change: entry.change || null,
        sub: this.shortValue(entry.value),
        desc: this.formatValue(entry.value),
        attrs: this.entryAttrs(entry),
      });
      return `<button type="button" class="mvu-game-extra-item" onclick="openMvuGameDetail('player', '${this.attr(id)}')"><span class="mvu-game-extra-label">${this.esc(entry.label)}</span><span class="mvu-game-extra-value">${this.esc(this.shortValue(entry.value))}</span>${this.renderDeltaBadge(entry)}</button>`;
    }).join('')}</div>` : '';
    return `<div class="mvu-game-hero">
      <div class="mvu-game-hero-head">
        <div class="mvu-game-title">${this.esc(title)}</div>
        <div class="mvu-realm-badge">${this.esc(realm ? realm.label : '修行中')}</div>
      </div>
      <div class="mvu-game-subtitle">${this.esc(env || '状态栏游戏视图')}</div>
      <div class="mvu-cultivation-core">
        ${keyBars.map(entry => this.renderMiniBar(entry)).join('')}
      </div>
      ${extrasHtml}
    </div>`;
  },

  isBarEntry(entry) {
    if (!entry) return false;
    const def = entry.def || {};
    if (def.type === 'bar') return true;
    if (def.max !== undefined && Number.isFinite(Number(def.max))) return true;
    return false;
  },

  findFirst(entries, regex) {
    return entries.find(e => regex.test(`${e.field} ${e.label}`.toLowerCase()));
  },

  renderMiniBar(entry) {
    const def = entry.def || {};
    const num = Number(entry.value);
    const isNumeric = Number.isFinite(num);
    const hasMax = def.max !== undefined && Number.isFinite(Number(def.max)) && Number(def.max) > 0;
    const max = hasMax ? Number(def.max) : null;
    const pct = isNumeric && max ? Math.max(0, Math.min(100, (num / max) * 100)) : 0;
    const level = isNumeric && max ? this.barLevel(pct / 100, def) : '';
    const valueText = isNumeric ? (max ? `${num}/${max}` : String(num)) : this.shortValue(entry.value);
    return `<div class="mvu-game-bar-card${level ? ` ${level}` : ''}" data-mvu-field="${this.attr(entry.field)}">
      <div class="mvu-game-row">
        <span class="mvu-game-label">${this.esc(entry.label)}</span>
        <span class="mvu-game-value">${this.esc(valueText)}${this.renderDeltaBadge(entry)}</span>
      </div>
      ${max ? `<div class="mvu-game-track"><div class="mvu-game-fill" style="width:${pct}%"></div></div>` : ''}
    </div>`;
  },

  // 低值/中段阈值：schema 可用 lowAt / midAt 覆写，与通用视图 B1 保持一致。
  barLevel(ratio, def = {}) {
    const lowAt = Number.isFinite(Number(def.lowAt)) ? Number(def.lowAt) : 0.2;
    const midAt = Number.isFinite(Number(def.midAt)) ? Number(def.midAt) : 0.45;
    if (ratio <= lowAt) return 'mvu-game-bar-low';
    if (ratio <= midAt) return 'mvu-game-bar-mid';
    return '';
  },

  // 变化徽标只基于真实记录的 before/after，不猜测原因。
  renderDeltaBadge(entry) {
    const change = entry.change;
    if (!change) return '';
    const delta = change.delta || '';
    if (!delta) return '';
    const numeric = /^[+-]?\d/.test(String(delta).trim());
    const dir = numeric ? (String(delta).trim().startsWith('-') ? 'down' : 'up') : 'flat';
    return `<span class="mvu-game-delta ${dir}">${this.esc(delta)}</span>`;
  },

  // 本轮变化摘要：仅展示真实记录的字段变化，无原因描述。
  renderChangeSummary(model) {
    const changes = model.changes || [];
    if (!changes.length) return '';
    const shown = changes.slice(0, 6);
    const more = changes.length - shown.length;
    const rows = shown.map(change => {
      const label = change.label || change.field || '';
      const delta = change.delta || '修改';
      const numeric = /^[+-]?\d/.test(String(delta).trim());
      const dir = numeric ? (String(delta).trim().startsWith('-') ? 'down' : 'up') : 'flat';
      return `<button type="button" class="mvu-game-change-chip" onclick="jumpToMvuField('${this.attr(change.field || '')}')">
        <span class="mvu-game-change-label">${this.esc(label)}</span>
        <span class="mvu-game-delta ${dir}">${this.esc(delta)}</span>
      </button>`;
    }).join('');
    return `<div class="mvu-game-changes">
      <div class="mvu-game-changes-head"><span>本轮变化 · ${changes.length}</span>${more > 0 ? `<span class="mvu-game-changes-more">另有 ${more} 项</span>` : ''}</div>
      <div class="mvu-game-change-list">${rows}</div>
    </div>`;
  },

  renderTabs(model) {
    const tabs = [
      ['character', '人物', model.characters.length],
      ['inventory', '储物', model.inventory.length],
      ['skills', '功法', model.skills.length],
      ['quests', '任务', model.quests.length],
      ['world', '世界', model.world.length],
    ];
    return `<div class="mvu-game-tabs">${tabs.map(([id, label, count]) => `
      <button class="mvu-game-tab${mvuGameTab === id ? ' active' : ''}" onclick="setMvuGameTab('${id}')">${this.renderIcon(id)}<span>${label}</span><span class="mvu-game-section-count"> ${count}</span></button>
    `).join('')}</div>`;
  },

  renderActivePane(model) {
    if (mvuGameTab === 'inventory') return this.renderListPane('inventory', this.inventoryItems(model.inventory), '储物袋空空如也');
    if (mvuGameTab === 'skills') return this.renderListPane('skills', this.skillItems(model.skills), '尚未记录功法/术法');
    if (mvuGameTab === 'quests') return this.renderListPane('quests', this.questItems(model.quests), '暂无任务因果');
    if (mvuGameTab === 'world') return this.renderListPane('world', this.worldItems(model.world, model.other), '暂无世界信息');
    return this.renderListPane('character', this.characterItems(model), '暂无人物状态');
  },

  renderListPane(tab, items, emptyText) {
    if (!items.length) return this.empty(emptyText);
    const selected = this.ensureSelection(tab, items);
    items.forEach(item => this.detailMap.set(`${tab}:${item.id}`, item));
    return `<div class="mvu-game-layout">
      <div class="mvu-game-list">${items.map(item => this.renderEntry(tab, item, selected?.id === item.id)).join('')}</div>
    </div>`;
  },

  ensureSelection(tab, items) {
    if (!items.length) {
      mvuGameSelection[tab] = null;
      return null;
    }
    const current = mvuGameSelection[tab];
    const selected = items.find(item => item.id === current) || items[0];
    if (selected.id !== current) mvuGameSelection[tab] = selected.id;
    return selected;
  },

  renderEntry(tab, item, active) {
    const sub = item.sub || item.desc || '';
    return `<button type="button" class="mvu-game-entry${active ? ' active' : ''}" onclick="openMvuGameDetail('${tab}', '${this.attr(item.id)}')">
      <span class="mvu-game-entry-icon ${tab}">${this.renderIcon(item.iconType || tab, item.icon || this.firstChar(item.title))}</span>
      <span class="mvu-game-entry-main">
        <span class="mvu-game-entry-title">${this.esc(item.title)}${this.renderDeltaBadge(item)}</span>
        ${sub ? `<span class="mvu-game-entry-sub">${this.esc(this.shortText(sub, 48))}</span>` : ''}
      </span>
      <span class="mvu-game-entry-tag">${this.esc(item.type || '详情')}</span>
    </button>`;
  },

  renderDetailModal() {
    return `<div class="mvu-game-modal" id="mvuGameDetailOverlay" onclick="if(event.target===this) closeMvuGameDetail()">
      <div class="mvu-game-modal-card">
        <button type="button" class="mvu-game-modal-close" onclick="closeMvuGameDetail()" aria-label="关闭">×</button>
        <div id="mvuGameDetailBody"></div>
      </div>
    </div>`;
  },

  renderGameDetail(item) {
    const attrs = (item.attrs || []).filter(row => row[1] !== undefined && row[1] !== '');
    const sub = item.sub || this.typeSubtitle(item);
    // 描述与副标题同源时不再重复展示一遍（对象摘要常被两处同时取到）。
    const desc = item.desc && item.desc !== item.sub ? item.desc : '';
    // 结构顺序：标题行 → 分隔线 → 属性两列 → 描述。描述放最后，让数值先被看到。
    return `<div class="mvu-game-modal-head">
        <div class="mvu-game-modal-icon ${this.esc(item.tab || '')}">${this.renderIcon(item.iconType || item.tab, item.icon || this.firstChar(item.title))}</div>
        <div class="mvu-game-modal-headtext">
          <div class="mvu-game-modal-title">${this.esc(item.title)}</div>
          <div class="mvu-game-modal-subtitle">${this.esc(sub)}</div>
        </div>
        <div class="mvu-game-modal-badge">${this.esc(item.type || '详情')}</div>
      </div>
      ${attrs.length ? `<div class="mvu-game-modal-attrs">${attrs.map(([label, value]) => `
        <div class="mvu-game-modal-attr"><span>${this.esc(label)}</span><span>${this.esc(this.formatValue(value)).replace(/\n/g, '<br>')}</span></div>
      `).join('')}</div>` : ''}
      ${desc ? `<div class="mvu-game-modal-desc">${this.esc(desc).replace(/\n/g, '<br>')}</div>` : ''}
    `;
  },

  typeSubtitle(item) {
    const map = { player: '自身属性', character: '人物档案', inventory: '储物说明', skills: '功法秘录', quests: '任务卷宗', world: '世界情报' };
    return map[item.tab] || '详情';
  },

  renderIcon(type, fallback) {
    return MVUGameIcons[type] || MVUGameIcons.item || `<span>${this.esc(fallback || '?')}</span>`;
  },

  // 「人物」页只列真正的 NPC。自身属性（境界/生命值/灵力/灵石/声望…）已在 Hero 区展示，
  // 此前在这里被拼到角色列表前面，造成重复展示与「人物 N」计数虚高。
  characterItems(model) {
    const chars = model.characters.slice(0, 10).map(char => ({
      id: this.idFor('character', char.id, -1),
      tab: 'character',
      iconType: 'character',
      title: char.title,
      type: '角色',
      icon: this.firstChar(char.title),
      change: char.change || null,
      sub: char.fields.slice(0, 2).map(e => `${e.label}: ${this.shortValue(e.value)}`).join(' / '),
      desc: char.fields.slice(0, 4).map(e => `${e.label}：${this.shortValue(e.value)}`).join('\n'),
      attrs: char.fields.slice(0, 8).map(e => [e.label, e.value]),
    }));
    return chars;
  },

  inventoryItems(items) {
    return items.slice(0, 30).map(entry => {
      const name = this.itemName(entry.item);
      const count = this.itemCount(entry.item);
      return {
        id: entry.id,
        tab: 'inventory',
        iconType: 'inventory',
        title: name,
        type: this.objectProp(entry.item, ['type', 'category', 'rarity']) || '物品',
        icon: this.firstChar(name),
        change: entry.change || null,
        sub: count ? `数量 ${count}` : (this.itemDesc(entry.item) || entry.label),
        desc: this.itemDesc(entry.item) || `${name} 记录在「${entry.label}」中。`,
        attrs: this.itemAttrs(entry, [['数量', count], ['来源', entry.label]]),
      };
    });
  },

  questItems(quests) {
    return quests.slice(0, 12).map(entry => {
      const title = this.itemName(entry.item);
      return {
        id: entry.id,
        tab: 'quests',
        iconType: 'quests',
        title,
        type: this.objectProp(entry.item, ['status', 'stage', 'type']) || '任务',
        icon: '令',
        change: entry.change || null,
        sub: this.itemDesc(entry.item) || this.objectSummary(entry.item) || this.shortValue(entry.item),
        desc: this.itemDesc(entry.item) || this.objectSummary(entry.item, 6) || this.formatValue(entry.item),
        attrs: this.itemAttrs(entry, [['归属', entry.label]]),
      };
    });
  },

  skillItems(skills) {
    return skills.slice(0, 14).map(entry => {
      const title = this.itemName(entry.item);
      return {
        id: entry.id,
        tab: 'skills',
        iconType: 'skills',
        title,
        type: this.objectProp(entry.item, ['realm', 'level', 'type', 'category']) || '功法',
        icon: '法',
        change: entry.change || null,
        sub: this.objectProp(entry.item, ['effect', 'status']) || this.itemDesc(entry.item) || this.objectSummary(entry.item) || this.shortValue(entry.item),
        desc: this.itemDesc(entry.item) || this.objectSummary(entry.item, 6) || this.formatValue(entry.item),
        attrs: this.itemAttrs(entry, [['来源', entry.label]]),
      };
    });
  },

  worldItems(world, other) {
    return [...world, ...other].slice(0, 24).map(entry => ({
      id: this.idFor('world', entry.field, -1),
      tab: 'world',
      iconType: /location|place|地点|位置/.test(`${entry.field} ${entry.label}`.toLowerCase()) ? 'location' : 'world',
      title: entry.label,
      type: /location|place|地点|位置/.test(`${entry.field} ${entry.label}`.toLowerCase()) ? '地点' : '世界',
      icon: this.firstChar(entry.label),
      change: entry.change || null,
      sub: this.objectSummary(entry.value) || this.shortValue(entry.value),
      desc: this.objectSummary(entry.value, 6) || this.formatValue(entry.value),
      attrs: this.entryAttrs(entry),
    }));
  },

  entryAttrs(entry) {
    const rows = [];
    if (entry.def?.max !== undefined) rows.push(['上限', entry.def.max]);
    if (entry.def?.rule) rows.push(['规则', entry.def.rule]);
    // 对象值不要再摊成原始键值串；只保留可读摘要。
    if (entry.value && typeof entry.value === 'object') {
      const summary = this.objectSummary(entry.value, 8);
      if (summary) rows.push(['当前', summary.replace(/ · /g, '\n')]);
    } else {
      rows.push(['当前', entry.value]);
    }
    return rows;
  },

  itemAttrs(entry, baseRows = []) {
    const rows = baseRows.filter(row => row[1] !== undefined && row[1] !== '');
    if (entry.item && typeof entry.item === 'object') {
      for (const [key, value] of Object.entries(entry.item)) {
        if (['id', 'key', 'name', 'title', 'label', 'desc', 'detail', 'description', 'note'].includes(key)) continue;
        if (value === null || value === undefined || value === '') continue;
        if (typeof value === 'object' && !Array.isArray(value)) continue;
        rows.push([this.prettyKey(key), value]);
      }
    }
    return rows.length ? rows : [['记录', this.formatValue(entry.item)]];
  },

  objectProp(item, keys) {
    if (!item || typeof item !== 'object') return '';
    for (const key of keys) {
      if (item[key] !== undefined && item[key] !== '') return String(item[key]);
    }
    return '';
  },

  firstChar(text) {
    return String(text || '?').trim().charAt(0) || '?';
  },

  shortText(value, max = 80) {
    const text = this.formatValue(value).replace(/\s+/g, ' ').trim();
    return text.length > max ? text.slice(0, Math.max(0, max - 3)) + '...' : text;
  },

  empty(text) {
    return `<div class="mvu-game-empty">${this.esc(text)}</div>`;
  },

  itemName(item) {
    if (item && typeof item === 'object') return String(item.name || item.title || item.label || item.id || '未命名');
    return this.shortValue(item) || '未命名';
  },

  itemDesc(item) {
    if (item && typeof item === 'object') return String(item.desc || item.detail || item.description || item.effect || item.note || '');
    return '';
  },

  // 对象元素的「可读摘要」：只取有内容的字段，键名走 prettyKey。
  // 历史实现直接 formatValue(对象)，于是任务/功法条目副标题变成
  // 「id: main_quest_1 title: 主线任务 status: 进行中 obje...」这种原始键值串。
  objectSummary(item, limit = 3, skip = []) {
    if (!item || typeof item !== 'object') return '';
    const omit = new Set(['id', 'key', 'name', 'title', 'label', 'desc', 'detail', 'description', 'note', ...skip]);
    const parts = [];
    for (const [key, value] of Object.entries(item)) {
      if (omit.has(key)) continue;
      if (value === null || value === undefined || value === '') continue;
      if (typeof value === 'object' && !Array.isArray(value)) continue;
      const text = Array.isArray(value) ? value.map(v => this.formatValue(v)).join('、') : this.formatValue(value);
      if (!text) continue;
      parts.push(`${this.prettyKey(key)}: ${text}`);
      if (parts.length >= limit) break;
    }
    return parts.join(' · ');
  },

  itemCount(item) {
    if (item && typeof item === 'object' && item.count !== undefined) return String(item.count);
    return '';
  },

  prettyKey(key) {
    const map = {
      effect: '效果',
      count: '数量',
      rarity: '稀有度',
      status: '状态',
      location: '位置',
      owner: '持有者',
      realm: '境界',
      level: '层级',
      progress: '进度',
      relation: '关系',
      faction: '势力',
      type: '类型',
      category: '类别',
      profile: '档案',
      affection: '好感',
      outfit: '衣着',
      personality: '性格',
      attitude: '态度',
      thoughts: '想法',
      role: '身份',
      identity: '身份',
      desc: '描述',
      description: '描述',
      note: '备注',
      objective: '目标',
      title: '名称',
      name: '姓名',
    };
    return map[key] || key;
  },

  shortValue(value) {
    const text = this.formatValue(value).replace(/\s+/g, ' ').trim();
    return text.length > 80 ? text.slice(0, 77) + '...' : text;
  },

  formatValue(value) {
    if (value === null || value === undefined) return '';
    if (Array.isArray(value)) return value.map(v => this.formatValue(v)).join('\n');
    if (typeof value === 'object') return Object.entries(value).map(([k, v]) => `${k}: ${this.formatValue(v)}`).join('\n');
    return String(value);
  },

  esc(value) { return Utils.escapeHtml(String(value ?? '')); },
  attr(value) { return this.esc(value).replace(/`/g, '&#96;'); },
};

const MVUInteraction = {
  passiveSelector: 'button,input,textarea,select,a,summary,.mvu-tab,[data-tab],[data-no-mvu-popup]',
  explicitSelector: '[data-mvu-detail],[data-mvu-action],[data-mvu-field-detail]',
  inferredSelector: '.mvu-list-item,.mvu-item,.mvu-card,.mvu-chip,.mvu-tag,[data-role="item"],[data-role="character"],[data-role="quest"],[data-role="skill"]',
  gameViewSelector: '.mvu-game-view',

  enhance(container, mvuData) {
    if (!container || !mvuData) return;
    container._mvuInteractionData = mvuData;
    if (!container.dataset.mvuInteractionBound) {
      container.dataset.mvuInteractionBound = '1';
      container.addEventListener('click', (event) => this.handleClick(event, container, container._mvuInteractionData));
      container.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const target = event.target.closest('.mvu-interactive');
        if (!target || !container.contains(target)) return;
        event.preventDefault();
        this.openForElement(target, container, container._mvuInteractionData);
      });
    }
    this.markInteractive(container);
  },

  markInteractive(container) {
    container.querySelectorAll('.mvu-interactive').forEach(el => {
      el.classList.remove('mvu-interactive');
      el.removeAttribute('tabindex');
    });

    const candidates = new Set();
    container.querySelectorAll(this.explicitSelector).forEach(el => candidates.add(el));
    container.querySelectorAll('[data-field],[data-field-bar]').forEach(el => candidates.add(el));
    container.querySelectorAll('[data-field-list]').forEach(list => {
      Array.from(list.children).forEach(child => candidates.add(child));
    });
    container.querySelectorAll(this.inferredSelector).forEach(el => candidates.add(el));

    for (const el of candidates) {
      if (!this.canEnhance(el, container)) continue;
      el.classList.add('mvu-interactive');
      if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
    }
  },

  canEnhance(el, container) {
    if (!el || !container.contains(el)) return false;
    if (el.closest(this.passiveSelector)) return false;
    if (el.closest('.mvu-tabs')) return false;
    // 游戏视图自带详情交互（openMvuGameDetail），不与通用详情弹窗叠加，
    // 否则一次点击会同时弹出两个详情层（通用层 z-index 9500 会盖住游戏层）。
    if (el.closest(this.gameViewSelector)) return false;
    const text = (el.innerText || el.textContent || '').trim();
    if (!text && !el.dataset.field && !el.dataset.fieldBar && !el.dataset.mvuTitle) return false;
    if (text.length > 180 && !el.matches(this.explicitSelector) && !el.dataset.field && !el.dataset.fieldBar) return false;
    return true;
  },

  handleClick(event, container, mvuData) {
    if (event.target.closest(this.passiveSelector)) return;
    const target = event.target.closest('.mvu-interactive');
    if (!target || !container.contains(target)) return;
    event.preventDefault();
    event.stopPropagation();
    this.openForElement(target, container, mvuData);
  },

  openForElement(el, container, mvuData) {
    const detail = this.buildDetail(el, container, mvuData);
    if (detail) openMvuDetail(detail);
  },

  buildDetail(el, container, mvuData) {
    const schema = mvuData?.schema || {};
    const state = mvuData?.state || {};
    const listEl = el.closest('[data-field-list]');
    const directField = el.dataset.mvuField || el.dataset.mvuFieldDetail || el.dataset.field || el.dataset.fieldBar;
    const field = directField || listEl?.dataset.fieldList || '';
    const def = field ? (schema[field] || {}) : {};
    const value = field ? state[field] : undefined;
    const indexedEl = el.closest('[data-mvu-index]');
    const indexedValue = indexedEl?.dataset?.mvuIndex;
    const parsedIndex = indexedValue !== undefined ? Number(indexedValue) : NaN;
    const listIndex = Number.isInteger(parsedIndex) ? parsedIndex : (listEl ? Array.from(listEl.children).indexOf(el) : -1);
    const itemValue = listIndex >= 0 && Array.isArray(value) ? value[listIndex] : undefined;
    const objectValue = itemValue && typeof itemValue === 'object' ? itemValue : null;

    const rawTitle = el.dataset.mvuTitle || objectValue?.name || objectValue?.title || objectValue?.label
      || this.cleanText(el.innerText || el.textContent) || def.label || field || '详情';
    const title = this.cleanText(rawTitle);
    const type = el.dataset.mvuType || objectValue?.type || objectValue?.category || this.inferType(field, def, el, listEl);
    const desc = el.dataset.mvuDesc || objectValue?.desc || objectValue?.detail || objectValue?.description
      || objectValue?.note || def.rule || this.fallbackDescription(title, field, itemValue ?? value);

    const rows = [];
    if (def.max !== undefined) rows.push(['上限', def.max]);
    if (listIndex >= 0) rows.push(['序号', String(listIndex + 1)]);
    if (objectValue) {
      for (const [key, val] of Object.entries(objectValue)) {
        if (['name', 'title', 'label', 'type', 'category', 'desc', 'detail', 'description', 'note'].includes(key)) continue;
        rows.push([this.prettyKey(key), this.formatValue(val)]);
      }
    } else if (itemValue !== undefined) {
      rows.push(['当前项', this.formatValue(itemValue)]);
    } else if (value !== undefined) {
      rows.push(['当前', this.formatValue(value)]);
    }
    if (def.rule) rows.push(['来源', def.rule]);

    if (field === 'characters' && objectValue) {
      const characterDesc = objectValue.profile || objectValue.desc || objectValue.description || objectValue.note || desc;
      return {
        title,
        type,
        desc: this.formatValue(characterDesc),
        field,
        listIndex,
        rows,
        character: objectValue,
      };
    }

    return { title, type, desc: this.formatValue(desc), field, listIndex, rows };
  },

  cleanText(text) {
    return String(text || '').replace(/\s+/g, ' ').trim();
  },

  formatValue(value) {
    if (value === null || value === undefined) return '';
    if (Array.isArray(value)) return value.map(v => this.formatValue(v)).join('\n');
    if (typeof value === 'object') {
      return Object.entries(value).map(([k, v]) => `${this.prettyKey(k)}：${this.formatValue(v)}`).join('\n');
    }
    return String(value);
  },

  prettyKey(key) {
    const map = {
      effect: '效果',
      count: '数量',
      rarity: '稀有度',
      status: '状态',
      location: '位置',
      owner: '持有者',
      profile: '档案',
      outfit: '外观',
      affection: '好感',
      relation: '关系',
      personality: '性格',
      attitude: '态度',
      thoughts: '想法',
      role: '定位',
      identity: '身份',
      ability: '能力',
      abilities: '能力',
      power: '能力',
      skill: '技能',
    };
    return map[key] || key;
  },

  inferType(field, def, el, listEl) {
    const haystack = `${field || ''} ${def.label || ''} ${el.className || ''} ${listEl?.dataset.fieldList || ''}`.toLowerCase();
    if (/inventory|item|bag|weapon|armor|物品|道具|装备/.test(haystack)) return '物品';
    if (/quest|task|任务|委托|目标/.test(haystack)) return '任务';
    if (/skill|ability|spell|技能|法术|能力/.test(haystack)) return '技能';
    if (/character|npc|role|profile|关系|角色|人物/.test(haystack)) return '角色';
    if (/location|map|place|地点|位置|地图/.test(haystack)) return '地点';
    if (def.type === 'bar') return '状态条';
    return def.type ? `变量 · ${def.type}` : '详情';
  },

  fallbackDescription(title, field, value) {
    const formatted = this.formatValue(value);
    if (formatted) return formatted;
    return field ? `关于「${title}」的记录。` : '可交互对象。';
  },
};

function renderMvuCharacterDetail(detail, rows) {
  const character = detail.character || {};
  const esc = value => Utils.escapeHtml(String(value ?? '')).replace(/\n/g, '<br>');
  const chips = [
    character.relation && `关系：${character.relation}`,
    character.affection !== undefined && character.affection !== '' && `好感：${character.affection}`,
    character.location && `位置：${character.location}`,
    character.status && `状态：${character.status}`,
    character.identity && `身份：${character.identity}`,
  ].filter(Boolean);
  const sections = [
    ['当前档案', detail.desc || character.profile || character.desc || character.description || character.note],
    ['外观/装备', character.outfit],
    ['性格', character.personality],
    ['态度', character.attitude],
    ['当前想法', character.thoughts],
    ['能力/备注', character.ability || character.abilities || character.power || character.skill || character.note],
  ].filter(([, value]) => value !== undefined && value !== null && value !== '');
  const used = new Set(['序号', '关系', '好感', '位置', '状态', '身份', '档案', '外观', '性格', '态度', '想法', '能力', '技能', 'profile', 'desc', 'description', 'note', 'outfit', 'personality', 'attitude', 'thoughts', 'ability', 'abilities', 'power', 'skill']);
  const extraRows = rows.filter(([label]) => !used.has(label));

  return `<div class="mvu-character-detail">
    ${chips.length ? `<div class="mvu-character-detail-summary">${chips.map(chip => `<span class="mvu-character-detail-chip">${esc(chip)}</span>`).join('')}</div>` : ''}
    ${sections.map(([title, value]) => `
      <section class="mvu-character-detail-section">
        <div class="mvu-character-detail-heading">${esc(title)}</div>
        <div class="mvu-character-detail-text">${esc(value)}</div>
      </section>
    `).join('')}
    ${extraRows.length ? `<div class="mvu-detail-grid">${extraRows.map(([label, value]) => `
      <div class="mvu-detail-row"><span>${esc(label)}</span><span>${esc(value)}</span></div>
    `).join('')}</div>` : ''}
    <div class="mvu-detail-actions">
      <button class="btn btn-primary" onclick="openMvuCharacterEditor(${detail.listIndex})">编辑角色</button>
    </div>
  </div>`;
}

function applyMvuThemeToDetailOverlay() {
  const overlay = document.getElementById('mvuDetailOverlay');
  const cards = [
    document.querySelector('#mvuDetailOverlay .mvu-detail-card'),
    document.querySelector('#mvuCharacterEditOverlay .mvu-detail-card'),
  ].filter(Boolean);
  const source = document.querySelector('#mvuContent .mvu-root') || document.querySelector('#mvuContent > *');
  if (!source || !cards.length) return;
  const styles = getComputedStyle(source);
  const vars = [
    '--mvu-bg',
    '--mvu-panel',
    '--mvu-card',
    '--mvu-accent',
    '--mvu-accent-2',
    '--mvu-warn',
    '--mvu-text',
    '--mvu-muted',
    '--mvu-border',
    '--mvu-radius',
    '--mvu-shadow',
    '--mvu-texture',
  ];
  for (const card of cards) {
    for (const name of vars) {
      const value = styles.getPropertyValue(name).trim();
      if (value) card.style.setProperty(name, value);
    }
  }
  if (overlay) overlay.dataset.mvuThemeApplied = source.className || 'mvu';
}

function openMvuDetail(detail) {
  const overlay = document.getElementById('mvuDetailOverlay');
  const titleEl = document.getElementById('mvuDetailTitle');
  const typeEl = document.getElementById('mvuDetailType');
  const bodyEl = document.getElementById('mvuDetailBody');
  if (!overlay || !titleEl || !typeEl || !bodyEl) return;
  applyMvuThemeToDetailOverlay();

  titleEl.textContent = detail.title || '详情';
  typeEl.textContent = detail.type || '详情';
  const rows = (detail.rows || []).filter(row => row[1] !== undefined && row[1] !== '');
  if (detail.field === 'characters' && detail.listIndex >= 0 && detail.character) {
    bodyEl.innerHTML = renderMvuCharacterDetail(detail, rows);
  } else {
    bodyEl.innerHTML = `
    <div class="mvu-detail-desc">${Utils.escapeHtml(detail.desc || '').replace(/\n/g, '<br>')}</div>
    ${rows.length ? `<div class="mvu-detail-grid">${rows.map(([label, value]) => `
      <div class="mvu-detail-row"><span>${Utils.escapeHtml(label)}</span><span>${Utils.escapeHtml(String(value)).replace(/\n/g, '<br>')}</span></div>
    `).join('')}</div>` : ''}
    ${detail.field === 'characters' && detail.listIndex >= 0 ? `<div class="mvu-detail-actions">
      <button class="btn btn-primary" onclick="openMvuCharacterEditor(${detail.listIndex})">编辑角色</button>
    </div>` : ''}
    `;
  }
  overlay.dataset.title = detail.title || '';
  overlay.dataset.field = detail.field || '';
  overlay.dataset.index = detail.listIndex >= 0 ? String(detail.listIndex) : '';
  overlay.classList.add('visible');
}

function closeMvuDetail() {
  document.getElementById('mvuDetailOverlay')?.classList.remove('visible');
}

function copyMvuDetailText(kind) {
  const overlay = document.getElementById('mvuDetailOverlay');
  const text = kind === 'field' ? overlay?.dataset.field : overlay?.dataset.title;
  if (!text) return;
  navigator.clipboard?.writeText(text).then(() => UI.showToast('已复制', 'success')).catch(() => UI.showToast(text, 'info'));
}

function ensureMvuCharactersField() {
  if (!conversation?.mvu) return null;
  if (!conversation.mvu.schema) conversation.mvu.schema = {};
  if (!conversation.mvu.state) conversation.mvu.state = {};
  if (!conversation.mvu.schema.characters) {
    conversation.mvu.schema.characters = {
      type: 'list',
      label: '角色档案',
      rule: '遇到新角色时追加对象；关系、好感、位置、穿着、想法变化时更新对应对象',
    };
  }
  if (!Array.isArray(conversation.mvu.state.characters)) conversation.mvu.state.characters = [];
  return conversation.mvu.state.characters;
}

function getDefaultMvuCharacter() {
  return {
    id: `char_${Date.now()}`,
    name: '',
    profile: '',
    outfit: '',
    affection: 0,
    relation: '',
    personality: '',
    attitude: '',
    thoughts: '',
    location: '',
  };
}

function openMvuCharacterEditor(index = -1) {
  if (conversation?.phase !== 'rp' || !conversation?.mvu) {
    UI.showToast('只有在 RP 阶段才能编辑角色档案', 'info');
    return;
  }
  const characters = ensureMvuCharactersField();
  if (!characters) return;
  const numericIndex = Number(index);
  editingMvuCharacterIndex = Number.isInteger(numericIndex) ? numericIndex : -1;
  const current = editingMvuCharacterIndex >= 0 && characters[editingMvuCharacterIndex] && typeof characters[editingMvuCharacterIndex] === 'object'
    ? { ...getDefaultMvuCharacter(), ...characters[editingMvuCharacterIndex] }
    : getDefaultMvuCharacter();

  const overlay = document.getElementById('mvuCharacterEditOverlay');
  const titleEl = document.getElementById('mvuCharacterEditTitle');
  const typeEl = document.getElementById('mvuCharacterEditType');
  const bodyEl = document.getElementById('mvuCharacterEditBody');
  if (!overlay || !titleEl || !typeEl || !bodyEl) return;
  applyMvuThemeToDetailOverlay();

  titleEl.textContent = editingMvuCharacterIndex >= 0 ? '编辑角色' : '新增角色';
  typeEl.textContent = current.name || '角色档案';
  bodyEl.innerHTML = renderMvuCharacterEditForm(current, editingMvuCharacterIndex >= 0);
  closeMvuDetail();
  overlay.classList.add('visible');
}
