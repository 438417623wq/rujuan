      display: flex; align-items: center; justify-content: center;
    }
    .prompt-drawer-row.is-on .prompt-drawer-toggle {
      background: var(--accent);
      border-color: var(--accent);
    }
    .prompt-drawer-row.is-on .prompt-drawer-toggle::after {
      content: '✓';
      color: var(--bg-primary);
      font-size: var(--fs-xs);
      font-weight: bold;
    }

    /* ---- Edit MVU Mode Bar ---- */
    .edit-mode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(8px + env(safe-area-inset-top, var(--sat, 0px))) 16px 8px;
      background: rgba(214, 178, 95, 0.1);
      border-bottom: 1px solid rgba(214, 178, 95, 0.25);
      flex-shrink: 0;
      z-index: var(--z-rail);
    }
    .edit-mode-label {
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      font-weight: 600;
      color: var(--accent);
    }
    .edit-mode-actions {
      display: flex;
      gap: 8px;
    }
    .edit-mode-actions .btn {
      font-size: var(--fs-sm);
      padding: 5px 14px;
    }

    /* ---- Prompt Debug Overlay ---- */
    .debug-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .debug-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .debug-modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 92%;
      max-width: 820px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .debug-title {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--accent);
    }
    .debug-body {
      overflow-y: auto;
      padding: 16px 20px;
      flex: 1;
    }
    .debug-section {
      margin-bottom: 20px;
    }
    .debug-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .debug-badge {
      font-size: var(--fs-xs);
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-elevated);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .debug-message {
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .debug-msg-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-elevated);
      cursor: pointer;
      user-select: none;
      min-height: 32px;
    }
    .debug-msg-header:hover {
      background: var(--accent-dim);
    }
    .debug-role {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .debug-role-user { background: rgba(100,160,220,0.15); color: #6aa0dc; }
    .debug-role-ai { background: rgba(124,184,122,0.15); color: var(--success); }
    .debug-role-sys { background: rgba(214,178,95,0.15); color: var(--accent); }
    .debug-msg-meta {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .debug-preview {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      color: var(--text-muted);
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .debug-pre {
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      font-size: var(--fs-sm);
      line-height: 1.55;
      color: var(--text-secondary);
      background: var(--bg-deep);
      padding: 10px 12px;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .debug-pre.collapsed {
      display: none;
    }

    /* ---- Scroll-to-bottom button ---- */
    .scroll-bottom-btn {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      opacity: 0;
      pointer-events: none;
      z-index: var(--z-rail);
    }
    .scroll-bottom-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .scroll-bottom-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .scroll-bottom-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ---- Edit Message Overlay ---- */
    .edit-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-edit-overlay);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .edit-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .edit-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      width: 90%;
      max-width: 560px;
      box-shadow: var(--shadow);
    }
    .edit-panel h3 {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      color: var(--accent);
      margin-bottom: 12px;
    }
    .edit-panel textarea {
      min-height: 140px;
      margin-bottom: 12px;
    }
    .edit-panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ---- Stream Status Indicator ---- */
    .stream-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      color: var(--text-muted);
      animation: fadeIn 0.3s ease forwards;
      opacity: 0;
    }
    .stream-status .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stream-status.connecting .status-dot {
      background: var(--accent);
      animation: pulse 1.2s ease infinite;
    }
    .stream-status.streaming .status-dot {
      background: var(--success);
      animation: pulse 0.8s ease infinite;
    }
    .stream-status.retrying .status-dot {
      background: var(--danger);
      animation: pulse 1s ease infinite;
    }
    .stream-status .status-timer {
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-size: var(--fs-xs);
      opacity: 0.7;
    }

    /* ---- Error Retry Bar (inline after failed message) ---- */
    .error-retry-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-top: 8px;
      background: var(--cinnabar-dim);
      border: 1px solid var(--cinnabar-soft);
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      color: var(--danger);
      animation: fadeIn 0.3s ease forwards;
      opacity: 0;
      flex-wrap: wrap;
    }
    .error-retry-bar .error-msg {
      flex: 1;
      min-width: 120px;
      color: var(--text-secondary);
    }
    .error-retry-bar .error-msg strong {
      color: var(--danger);
      font-weight: 600;
    }
    .error-retry-bar .btn {
      font-size: var(--fs-sm);
      padding: 5px 12px;
    }

    /* ---- Offline Banner ---- */
    .offline-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: var(--z-banner);
      background: var(--danger);
      color: #fff;
      text-align: center;
      padding: 6px 16px;
      font-family: var(--font-ui);
      font-size: var(--fs-base);
      font-weight: 500;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    .offline-banner.visible {
      transform: translateY(0);
    }

    /* ---- Partial response interrupted marker ---- */
    .stream-interrupted {
      display: inline-block;
      padding: 2px 8px;
      margin-left: 4px;
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      color: var(--danger);
      opacity: 0.7;
      border-left: 2px solid var(--danger);
    }

    /* ---- Copy success feedback ---- */
    @keyframes copyFlash {
      0% { background: var(--accent-dim); }
      100% { background: transparent; }
    }
    .copy-flash {
      animation: copyFlash 0.6s ease;
    }

    /* ---- Mobile Overlay for sidebar ---- */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: var(--z-sidebar);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .sidebar-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ---- Mobile sidebar close button (hidden on desktop) ---- */
    .sidebar-close-btn {
      display: none;
    }

    /* ---- Mobile Options FAB ---- */
    .options-fab {
      display: none;
      position: fixed;
      z-index: var(--z-fab);
      bottom: 80px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--accent);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      touch-action: none;
      user-select: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .options-fab svg {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }
    .options-fab.has-options {
      border-color: var(--accent);
      box-shadow: 0 2px 16px rgba(214, 178, 95, 0.3);
    }
    .options-fab.pulse {
      animation: optionsPulse 0.6s ease 3;
    }
    @keyframes optionsPulse {
      0%, 100% { box-shadow: 0 2px 12px rgba(214, 178, 95, 0.3); }
      50% { box-shadow: 0 0 20px rgba(214, 178, 95, 0.6), 0 0 40px rgba(214, 178, 95, 0.2); }
    }
    .options-fab-panel {
      display: none;
      position: fixed;
      z-index: var(--z-fab);
      bottom: 70px;
      left: 12px;
      right: 12px;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
      max-height: 50vh;
      overflow-y: auto;
    }
    .options-fab-panel.open {
      display: flex;
    }
    .options-fab-panel .option-tag {
      max-width: none;
      white-space: normal;
      justify-content: flex-start;
      text-align: left;
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .sidebar-close-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 50%;
        color: var(--text-secondary);
        cursor: pointer;
        z-index: 10;
      }
      .sidebar-close-btn svg {
        width: 16px;
        height: 16px;
      }
      .sidebar-close-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .sidebar-overlay {
        display: block;
      }
      .mvu-sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: var(--z-sidebar);
        width: 360px;
        box-shadow: -4px 0 24px rgba(0,0,0,0.5);
      }
      .mvu-sidebar.collapsed {
        transform: translateX(100%);
      }
      .summary-sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: var(--z-sidebar);
        width: 360px;
        box-shadow: -4px 0 24px rgba(0,0,0,0.5);
      }
      .summary-sidebar.collapsed {
        transform: translateX(100%);
      }
      .prompt-drawer {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: var(--z-sidebar);
        width: 340px;
        box-shadow: -4px 0 24px rgba(0,0,0,0.5);
      }
      .prompt-drawer.collapsed {
        width: 340px;
        padding: calc(16px + env(safe-area-inset-top, var(--sat, 0px))) 16px 16px;
        opacity: 1;
        transform: translateX(100%);
        border-left: 1px solid var(--border);
        overflow: auto;
      }
      .message.user .message-bubble {
        max-width: 90%;
      }
      /* Mobile: tap to show action buttons */
      .message-actions {
        position: relative;
        top: 0;
        margin-top: 4px;
      }
      .message.show-actions .message-actions {
        opacity: 1;
        pointer-events: auto;
      }
      .message.assistant .message-actions {
        justify-content: flex-start;
      }
      .message.user .message-actions {
        justify-content: flex-end;
      }
      .story-title {
        max-width: 160px;
        font-size: var(--fs-xl);
      }
      .messages-area {
        padding: 16px 14px 12px;
      }
      .input-area {
        padding: 10px 14px 14px;
      }
      .mvu-confirm-bar, .error-retry-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .mvu-confirm-bar .btn, .error-retry-bar .btn {
        text-align: center;
        justify-content: center;
        min-height: 44px;
      }
      .mvu-detail-overlay {
        align-items: center;
        padding: 18px;
      }
      .mvu-detail-card {
        width: min(430px, 94vw);
        max-height: 78vh;
        border-radius: 18px;
      }
      .options-bar {
        padding: 4px 14px 2px;
        gap: 6px;
      }
      /* Mobile: hide default options bar, use floating icon instead */
      .options-bar {
        display: none !important;
      }
      .options-fab.has-options {
        display: flex;
      }
      /* Mobile: disable all backdrop-filter to prevent GPU blur artifacts */
      .topbar,
      .topbar.chat-header-blur,
      .message.user .message-bubble,
      .input-area,
      .scroll-bottom-btn,
      .edit-overlay,
      .sidebar-overlay,
      .mvu-sidebar,
      .summary-sidebar {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .topbar,
      .topbar.chat-header-blur,
      .input-area {
        background: var(--bg-surface);
      }
    }
    /* ============================================================
       Agnes 生图 - 图片卡 / 灯箱 / 生图面板
       ============================================================ */
    .msg-images, .msg-images *, .img-gen-panel, .img-gen-panel *,
    .img-lightbox, .img-lightbox *, .img-trigger-btn {
      box-sizing: border-box;
    }
    .msg-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 10px;
      max-width: 560px;
    }
    .msg-images.single { grid-template-columns: 1fr; max-width: 420px; }

    /* ---- 插画画廊（东方玄金 v2.5 · .gallery-masonry / .gallery-art-card） ----
       多图：两列等宽画廊网格。单图：保持既有自然比例（见下方 .single 覆盖）。
       卡片沿用既有 16/9 比例而非方案的 9/14 —— 消息配图是 16:9 横幅构图，
       强套竖版比例会把画面裁掉一半，属风险改动，故不采纳。 */
    .msg-images.gallery-masonry {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .msg-image-card.gallery-art-card {
      border-radius: var(--radius-md);
      border-color: var(--gold-border);
      background: var(--bg-surface);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    /* 单图不套两列网格，也不改比例 */
    .msg-images.gallery-masonry.single {
      grid-template-columns: 1fr;
      max-width: 420px;
    }

    /* ---- 卡片内叠加信息层（.art-overlay-meta / .art-title / .art-ratio-pill） ----
       pointer-events:none 确保不挡住卡片本体的 onclick 放大（lightbox）。
       方案里 art-overlay-meta 是 position:relative + z-index:2 的流内元素，
       这里改 absolute 压到图片上：本卡片子元素全为 absolute，没有可用的流内空间。 */
    .msg-image-card .art-overlay-meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 16px 8px 8px;
      background: linear-gradient(180deg, transparent, var(--scrim-strong));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      pointer-events: none;
    }
    .msg-image-card .art-title {
      max-width: 100%;
      font-family: var(--font-serif);
      font-size: var(--fs-base);
      font-weight: 700;
      line-height: 1.3;
      color: var(--gold-bright);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .msg-image-card .art-ratio-pill {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--gold-border);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      line-height: 1.5;
      letter-spacing: 0.04em;
    }
    /* 叠加层占据底部时，画风角标上移，避免与标题/比例胶囊重叠
       （16 + 17 标题 + 4 间距 + 18 胶囊 + 8 = 63px，留 3px 余量） */
    .msg-image-card.gallery-art-card .img-badge {
      bottom: 66px;
    }

    /* ---- 典籍绘卷卡片 ----
       旧版图片直接贴在气泡下、无边框无标签；现在卡片化：暗金描边 + 悬停浮起 + 画风角标。 */
    .msg-image-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--gold-border-subtle);
      background: var(--bg-elevated);
      cursor: zoom-in;
      transition: border-color var(--transition-smooth), transform var(--transition-smooth), box-shadow var(--transition-smooth);
      aspect-ratio: 16 / 9;
    }
    .msg-image-card:hover {
      border-color: var(--gold-border);
      transform: translateY(-2px);
      box-shadow: var(--shadow-ambient);
    }
    .msg-image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .msg-image-card .img-idx {
      position: absolute;
      top: 6px;
      left: 6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: var(--radius-full);
      background: var(--scrim-chip);
      color: var(--accent-bright);
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      line-height: 18px;
      text-align: center;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    /* 画风/比例角标：金线胶囊 */
    .msg-image-card .img-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--scrim-chip);
      border: 1px solid var(--gold-border-subtle);
      color: var(--accent-bright);
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      letter-spacing: 0.04em;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .msg-image-card .img-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity var(--transition-smooth);
    }
    .msg-image-card:hover .img-actions { opacity: 1; }
    .msg-image-card .img-actions button {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: var(--scrim-chip);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: background var(--transition-smooth), color var(--transition-smooth);
    }
    .msg-image-card .img-actions button:hover { background: var(--gold-primary); color: var(--bg-void); }

    /* 生成中 / 失败 占位卡 */
    .msg-image-card.placeholder {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      min-height: 84px;
      cursor: default;
      border-style: dashed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      text-align: center;
      box-sizing: border-box;
    }
    .msg-image-card.placeholder.error { border-color: var(--danger); cursor: default; }
    .msg-image-card .ph-spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: imgSpin 0.9s linear infinite;
    }
    @keyframes imgSpin { to { transform: rotate(360deg); } }
    .msg-image-card .ph-text {
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .msg-image-card.placeholder.error .ph-text { color: var(--danger); }

    /* v2.5 方案别名：模拟画卷底（方案 .art-bg-simulated / .art-bg-1 / .art-bg-2）。
       预览页用它充当"还没有真图"的占位画面；本产品在生成中/失败占位卡上复用，
       让等待态也保持画卷质感，而不是一个空虚线框。 */
    .art-bg-simulated {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
      pointer-events: none;
    }
    .msg-image-card:hover .art-bg-simulated { transform: scale(1.05); }
    .art-bg-1 {
      background: linear-gradient(180deg, transparent 40%, var(--scrim-grad-heavy) 90%),
        radial-gradient(circle at 50% 30%, #4a3420, #130f0a);
    }
    .art-bg-2 {
      background: linear-gradient(180deg, transparent 40%, var(--scrim-grad-heavy) 90%),
        radial-gradient(circle at 50% 30%, #203b4a, #0a1114);
    }
    .msg-image-card.placeholder .ph-spinner,
    .msg-image-card.placeholder .ph-text { position: relative; z-index: 1; }

    /* 灯箱：沉浸式暗场幻灯 */
    .img-lightbox {
      position: fixed;
      inset: 0;
      z-index: var(--z-lightbox);
      display: none;
      flex-direction: column;
      background: var(--overlay-scrim-heavy);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .img-lightbox.show { display: flex; animation: lbFadeIn 0.22s var(--ease-silk); }
    @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .img-lightbox-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: var(--fs-base);
    }
    .img-lightbox-top .lb-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); letter-spacing: 0.04em; }
    .img-lightbox-top button {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition-smooth), color var(--transition-smooth);
    }
    .img-lightbox-top button:hover { border-color: var(--gold-primary); color: var(--accent-bright); }
    .img-lightbox-top button:disabled { opacity: 0.35; cursor: not-allowed; }
    .img-lightbox-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      position: relative;
    }
    .img-lightbox-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: 0 24px 72px rgba(0,0,0,0.8), 0 0 0 1px var(--gold-border-subtle);
    }
    .img-lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-full);
      background: rgba(17,14,10,0.82);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition-smooth), color var(--transition-smooth), background var(--transition-smooth);
    }
    .img-lightbox-nav:hover { border-color: var(--gold-primary); color: var(--accent-bright); background: rgba(46,39,30,0.9); }
    .img-lightbox-nav.prev { left: 10px; }
    .img-lightbox-nav.next { right: 10px; }
    .img-lightbox-nav:disabled { opacity: 0.25; cursor: not-allowed; }
    .img-lightbox-bottom {
      flex-shrink: 0;
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    }
    .img-lightbox-prompt {
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      line-height: 1.65;
      color: var(--text-muted);
      max-height: 3.4em;
      overflow-y: auto;
      margin-bottom: 8px;
      text-align: center;
    }
    .img-lightbox-thumbs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      justify-content: center;
    }
    .img-lightbox-thumbs::-webkit-scrollbar { display: none; }
    .img-lightbox-thumbs img {
      width: 52px;
      height: 36px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity var(--transition-smooth), border-color var(--transition-smooth);
    }
    .img-lightbox-thumbs img:hover { opacity: 0.85; }
    .img-lightbox-thumbs img.active { border-color: var(--gold-primary); opacity: 1; }

    /* 生图面板：底部抽屉
       与方案 .agnes-drawer-box 对齐：背景收敛为纯 --bg-surface，描边/内距等价；
       圆角刻意保留「上圆下方」（radius-lg radius-lg 0 0）——它是贴底抽屉，
       方案里的四角圆角是流内卡片形态，套到这里会在屏幕底部露出缝隙。 */
    .img-gen-panel {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 100%);
      width: 100%;
      max-width: 780px;
      z-index: var(--z-modal);
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      border-bottom: none;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: var(--shadow-floating);
      padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
      transition: transform 0.3s var(--ease-silk);
      max-height: 78vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .img-gen-panel.open { transform: translate(-50%, 0); }
    .img-gen-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .img-gen-head .ttl {
      flex: 1;
      font-family: var(--font-body);
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent-bright);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .img-gen-head button {
      width: 30px;
      height: 30px;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition-smooth), color var(--transition-smooth);
    }
    .img-gen-head button:hover { border-color: var(--gold-primary); color: var(--accent-bright); }
    .img-gen-head-actions { display: flex; align-items: center; gap: 6px; }
    .img-gen-head button.active { border-color: var(--gold-primary); color: var(--accent-bright); background: var(--accent-dim); }
    /* ---- 配图画廊：生图面板内的会话级图片网格 ---- */
    .img-gallery-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px 0 6px; }
    .img-gallery-cell {
      position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius-sm); overflow: hidden;
      border: 1px solid var(--gold-border-subtle); background: var(--bg-deep); cursor: pointer;
    }
    .img-gallery-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--transition-fast); }
    .img-gallery-cell:hover img { transform: scale(1.05); }
    .img-gallery-empty { grid-column: 1 / -1; text-align: center; padding: 46px 16px 40px; color: var(--text-muted); }
    .img-gallery-empty .icon { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin: 0 auto 12px; opacity: 0.45; }
    .img-gallery-empty p { font-size: var(--fs-sm); color: var(--text-secondary); margin-bottom: 6px; }
    .img-gallery-empty .sub { font-size: var(--fs-xs); color: var(--text-faint); }
    .img-gen-label {
      display: block;
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      color: var(--text-faint);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .img-gen-textarea {
      width: 100%;
      min-height: 88px;
      max-height: 200px;
      resize: vertical;
      background: var(--bg-void);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: var(--fs-base);
      line-height: 1.7;
      padding: 10px 12px;
      outline: none;
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
      box-sizing: border-box;
    }
    .img-gen-textarea:focus { border-color: var(--gold-primary); box-shadow: 0 0 0 3px rgba(214,178,95,0.10); }
    .img-gen-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .img-gen-field { flex: 1; min-width: 118px; }
    .img-gen-select {
      width: 100%;
      background: var(--bg-void);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      padding: 8px 10px;
      outline: none;
      cursor: pointer;
    }
    .img-gen-select:focus { border-color: var(--gold-primary); }
    .img-gen-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .img-gen-chip {
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      padding: 4px 11px;
      border-radius: var(--radius-full);
      border: 1px solid var(--gold-border-subtle);
      background: var(--bg-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color var(--transition-smooth), color var(--transition-smooth), background var(--transition-smooth);
    }
    .img-gen-chip:hover { border-color: var(--gold-primary); color: var(--accent-bright); }
    .img-gen-chip.active { background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to)); border-color: transparent; color: var(--bg-void); font-weight: 600; }
    .img-gen-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .img-gen-hint {
      flex: 1;
      font-family: var(--font-ui);
      font-size: var(--fs-xs);
      line-height: 1.5;
      color: var(--text-faint);
    }
    .img-gen-hint.warn { color: var(--danger); }
    .img-gen-submit {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--gradient-gold-from), var(--gradient-gold-to));
      color: var(--bg-void);
      font-family: var(--font-body);
      font-size: var(--fs-base);
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: filter var(--transition-smooth), transform var(--transition-smooth);
      box-shadow: 0 6px 18px rgba(214,178,95,0.18);
    }
    .img-gen-submit:hover { filter: brightness(1.1); }
    .img-gen-submit:active { transform: scale(0.97); }
    .img-gen-submit:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
    .img-gen-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-scrim);
      display: none;
      background: var(--scrim-soft);
      backdrop-filter: blur(4px);
    }
    .img-gen-overlay.show { display: block; }

    /* 输入区生图按钮 */
    .img-trigger-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 1px solid var(--gold-border-subtle);
      border-radius: var(--radius-full);
      background: var(--bg-elevated);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition-smooth), color var(--transition-smooth), background var(--transition-smooth);
    }
    .img-trigger-btn:hover { border-color: var(--gold-primary); color: var(--accent-bright); }
    .img-trigger-btn.armed { border-color: var(--gold-primary); color: var(--accent-bright); background: var(--accent-dim); }
    .img-trigger-btn.busy { border-color: var(--gold-primary); color: var(--accent-bright); }
    .img-trigger-btn .icon { width: 17px; height: 17px; }

    @media (max-width: 768px) {
      .msg-images { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .msg-images.gallery-masonry { grid-template-columns: 1fr 1fr; }
      .img-gen-panel { max-width: 100%; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    }
  </style>
</head>
<body>

<div class="chat-app" id="app">

  <!-- Top Bar -->
  <div class="topbar chat-header-blur">
    <div class="topbar-left">
      <button class="btn-icon glass-btn-icon" id="backBtn" title="返回" onclick="goBack()">
        <span class="icon" style="width:20px;height:20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </span>
      </button>
    </div>
    <div class="topbar-center">
      <input type="text" class="story-title" id="storyTitle" value="新故事"
             onfocus="this.select()" onblur="saveTitle()" onkeydown="if(event.key==='Enter'){this.blur();}">
      <span class="phase-badge init" id="phaseBadge">初始化</span>
    </div>
    <div class="topbar-right">
      <button class="btn-icon glass-btn-icon" id="summaryToggle" title="故事摘要" onclick="toggleSummaryPanel()">
        <span class="icon" style="width:20px;height:20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </span>
      </button>
      <button class="btn-icon glass-btn-icon" id="promptDrawerToggle" title="预设条目快开关" onclick="togglePromptDrawer()">
        <span class="icon" style="width:20px;height:20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </span>
      </button>
      <div class="topbar-dropdown">
        <button class="btn-icon glass-btn-icon" id="moreMenuBtn" title="更多" onclick="toggleMoreMenu(event)">
          <span class="icon" style="width:20px;height:20px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </span>
        </button>
        <div class="topbar-menu" id="moreMenu"></div>
      </div>
      <button class="btn-icon glass-btn-icon" id="sidebarToggle" title="状态栏" onclick="toggleSidebar()">
        <span class="icon" style="width:20px;height:20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Chat Column -->
    <div class="chat-column">

      <!-- Edit Mode Bar (hidden by default) -->
      <div class="edit-mode-bar" id="editModeBar" style="display:none;">
        <span class="edit-mode-label">状态栏编辑模式</span>
        <div class="edit-mode-actions">
          <button class="btn btn-secondary" onclick="exitEditMvuMode(false)">放弃</button>
          <button class="btn btn-primary" onclick="exitEditMvuMode(true)">应用</button>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="messages-area chat-stream-scroll" id="messagesArea">
        <div class="messages-list" id="messagesList"></div>
      </div>

      <!-- Scroll to bottom -->
      <button class="scroll-bottom-btn" id="scrollBottomBtn" onclick="scrollToBottom(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- Options Bar (desktop) -->
      <div class="options-bar" id="optionsBar" style="display:none;"></div>

      <!-- Options FAB (mobile) -->
      <div class="options-fab" id="optionsFab" onclick="toggleOptionsFabPanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </div>
      <div class="options-fab-panel" id="optionsFabPanel"></div>

      <!-- Quick Reply Bar -->
      <div class="quick-reply-bar" id="quickReplyBar"></div>

      <!-- Input Area -->
      <div class="input-area" id="inputArea">
        <div class="input-wrapper">
          <button class="img-trigger-btn" id="imgTriggerBtn" title="生成配图" onclick="toggleImagePanel()">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </span>
          </button>
          <textarea class="input-textarea" id="inputTextarea"
                    placeholder="写下你的行动..."
                    rows="1"
                    onkeydown="handleInputKeydown(event)"></textarea>
          <button class="send-btn idle" id="sendBtn" onclick="handleSend()">
            <span class="icon" style="width:18px;height:18px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </span>
          </button>
        </div>
      </div>

      <!-- 生图面板 -->
      <div class="img-gen-overlay" id="imgGenOverlay" onclick="closeImagePanel()"></div>
      <div class="img-gen-panel" id="imgGenPanel">
        <div class="img-gen-head">
          <div class="ttl" id="imgGenTitle">生成配图</div>
          <div class="img-gen-head-actions">
            <button title="配图画廊" id="imgGalleryBtn" onclick="toggleImageGallery()">
              <span class="icon" style="width:15px;height:15px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </span>
            </button>
            <button title="关闭" onclick="closeImagePanel()">
              <span class="icon" style="width:15px;height:15px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </span>
            </button>
          </div>
        </div>

        <div class="img-gen-form-view" id="imgGenFormView">
        <label class="img-gen-label">画面描述（提示词）</label>
        <textarea class="img-gen-textarea" id="imgGenPrompt"
                  placeholder="例：青衣少女立于断崖之巅，长剑斜指苍穹，衣袂翻飞，身后云海翻涌，晨曦穿透云隙洒下金色光柱，电影级写实，仰视构图"></textarea>

        <div class="img-gen-row">
          <div class="img-gen-field">
            <label class="img-gen-label">尺寸</label>
            <select class="img-gen-select" id="imgGenSize"></select>
          </div>
          <div class="img-gen-field">
            <label class="img-gen-label">比例</label>
            <select class="img-gen-select" id="imgGenRatio"></select>
          </div>
          <div class="img-gen-field">
            <label class="img-gen-label">风格</label>
            <select class="img-gen-select" id="imgGenStyle"></select>
          </div>

<script>
// ============================================================
// State
// ============================================================
let conversation = null;
let isStreaming = false;
let streamAborted = false;
let streamStopRequested = false;
let editingMsgId = null;
let sidebarOpen = false;
let summaryPanelOpen = false;
let editMvuMode = false;
let editMvuMessages = [];
let editMvuBackup = null;
let mvuViewMode = 'visual';
let mvuGameTab = 'character';
let mvuGameSelection = {
  character: null,
  inventory: null,
  skills: null,
  quests: null,
  world: null,
};
let mvuGameDetailOpen = false;
let mvuSearchQuery = '';
let mvuDiagnostic = null; // 最近一轮状态栏更新诊断（no-block / parse-failed / no-effect）
let editingMvuCharacterIndex = -1;
let userScrolledUp = false;
let _lastBuiltPrompt = null; // cached prompt for debug inspector
let pendingMvuInit = null;
let worldSettingDraft = null;
let worldSettingTab = 'story';
let worldBookSearch = '';
let worldBookFilter = 'all';
let worldBookSelectedUid = null;
let worldBookExpandedUid = null;
let currentAbortController = null;
let nativeAiNotificationStarted = false;
let nativeStreamSessionId = null;
let nativeStreamPollTimer = null;
let nativeStreamLastText = '';
let nativeStreamAiMsgId = null;
let streamStartTime = 0;
let streamStatusTimer = null;
let lastFailedUserMsgId = null;

function getNativeNotificationTargetPath() {
  return conversation?.id ? `chat.html?id=${encodeURIComponent(conversation.id)}` : 'index.html';
}

function getNativeNotificationTitle() {
  return (conversation?.name || '未命名故事').trim();
}

function buildNativeAiNotificationPreview(text) {
  const raw = Utils.extractStoryContent(text, true) || Summary.cleanAbstract(MVU.cleanText(text)) || '';
  const plain = raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  return plain || 'AI 已生成新内容，点按查看';
}

function areNotificationPromptsEnabled() {
  return Storage.getSettings().enableNotificationBar !== false;
}

function notifyAiStreamingStart() {
  if (!areNotificationPromptsEnabled()) return;
  if (nativeAiNotificationStarted) return;
  nativeAiNotificationStarted = true;
  try {
    if (window.AndroidBridge && window.AndroidBridge.notifyAiStreaming) {
      window.AndroidBridge.notifyAiStreaming(getNativeNotificationTargetPath(), getNativeNotificationTitle());
    }
  } catch (e) {
    log('notifyAiStreaming failed:', e);
  }
}

function notifyAiStreamingDone(text) {
  if (!areNotificationPromptsEnabled()) return;
  nativeAiNotificationStarted = false;
  try {
    if (window.AndroidBridge && window.AndroidBridge.notifyAiReply) {
      window.AndroidBridge.notifyAiReply(
        getNativeNotificationTargetPath(),
        getNativeNotificationTitle(),
        buildNativeAiNotificationPreview(text)
      );
    }
  } catch (e) {
    log('notifyAiReply failed:', e);
  }
}

function notifyAiStreamingFailed() {
  if (!areNotificationPromptsEnabled()) return;
  nativeAiNotificationStarted = false;
  try {
    if (window.AndroidBridge && window.AndroidBridge.notifyAiError) {
      window.AndroidBridge.notifyAiError(getNativeNotificationTargetPath(), getNativeNotificationTitle());
    } else if (window.AndroidBridge && window.AndroidBridge.cancelAiNotification) {
      window.AndroidBridge.cancelAiNotification();
    }
  } catch (e) {
    log('notifyAiError failed:', e);
  }
}

function cancelAiStreamingNotification() {
  if (!areNotificationPromptsEnabled()) return;
  nativeAiNotificationStarted = false;
  try {
    if (window.AndroidBridge && window.AndroidBridge.cancelAiNotification) {
      window.AndroidBridge.cancelAiNotification();
    }
  } catch (e) {
    log('cancelAiNotification failed:', e);
  }
}

function canUseNativeBackgroundStreaming() {
  return areNotificationPromptsEnabled() && !editMvuMode && !!(window.AndroidBridge && window.AndroidBridge.startNativeAiStream);
}

function clearNativeStreamPolling() {
  if (nativeStreamPollTimer) {
    clearInterval(nativeStreamPollTimer);
    nativeStreamPollTimer = null;
  }
}

function clearNativeStreamTracking() {
  clearNativeStreamPolling();
  nativeStreamSessionId = null;
  nativeStreamLastText = '';
  nativeStreamAiMsgId = null;
}

function getNativeStreamState(sessionId) {
  if (!sessionId || !window.AndroidBridge?.getNativeAiStreamState) return null;
  try {
    const raw = window.AndroidBridge.getNativeAiStreamState(sessionId);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    log('getNativeStreamState failed:', e);
    return null;
  }
}

function clearNativeStreamState(sessionId) {
  try {
    if (sessionId && window.AndroidBridge?.clearNativeAiStreamState) {
      window.AndroidBridge.clearNativeAiStreamState(sessionId);
    }
  } catch (e) {
    log('clearNativeAiStreamState failed:', e);
  }
}

function setNativeAbortController(sessionId) {
  currentAbortController = {
    isNative: true,
    sessionId,
    abort() {
      try {
        if (window.AndroidBridge?.cancelNativeAiStream) {
          window.AndroidBridge.cancelNativeAiStream(sessionId);
        }
      } catch (e) {
        log('cancelNativeAiStream failed:', e);
      }
    },
  };
}

// ============================================================
// Initialization
// ============================================================
document.addEventListener('DOMContentLoaded', init);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    resumeNativeStreamIfNeeded();
  }
});

async function init() {
  await Config.load();
  if (Config.isPublic()) {
    const token = Storage.getAuthToken();
    if (!token) { location.href = 'login.html'; return; }
    try {
      const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
      const me = await res.json();
      if (!me.ok) { Storage.clearAuthToken(); location.href = 'login.html'; return; }
    } catch { Storage.clearAuthToken(); location.href = 'login.html'; return; }
  }
  // Sync from server before loading conversation
  await Storage.syncFromServer();

  const params = new URLSearchParams(location.search);
  const convId = params.get('id');

  if (!convId) {
    goBack();
    return;
  }

  conversation = await Storage.loadConversation(convId);
  if (!conversation) {
    UI.showToast('会话不存在', 'error');
    setTimeout(() => goBack(), 1200);
    return;
  }

  // Clean up stale per-conversation API fields (now global-only)
  if (conversation.apiProfileId || conversation.model) {
    delete conversation.apiProfileId;
    delete conversation.model;
    Storage.saveConversation(conversation);
    log('Cleaned stale apiProfileId/model from conversation');
  }

  // Clean up any empty assistant messages (from failed API calls)
  const beforeClean = conversation.messages.length;
  conversation.messages = conversation.messages.filter(m => m.role !== 'assistant' || (m.content && m.content.trim()));
  if (conversation.messages.length < beforeClean) {
    log('Cleaned', beforeClean - conversation.messages.length, 'empty assistant messages');
    Storage.saveConversation(conversation);
  }

  // Ensure summary object exists
  if (!conversation.summary) {
    const settings = Storage.getSettings();
    conversation.summary = { mergedSummaries: [], archive: [], lastMergedIdx: 0, interval: settings.summaryInterval || 80 };
    Storage.saveConversation(conversation);
  }
  // Migrate old summary format (text → mergedSummaries)
  if (conversation.summary.text && !conversation.summary.mergedSummaries) {
    conversation.summary.mergedSummaries = [{ code: 'sm01', content: conversation.summary.text }];
    delete conversation.summary.text;
    Storage.saveConversation(conversation);
  }
  if (!conversation.summary.mergedSummaries) {
    conversation.summary.mergedSummaries = [];
  }
  const mvuNormalized = normalizeMvuStructure(['characters', 'main_quests', 'side_quests']);
  if (mvuNormalized.changed) {
    Storage.saveConversation(conversation);
  }

  // Mobile: move sidebar out of overflow:hidden parent to fix touch scrolling
  if (window.innerWidth <= 768) {
    document.body.appendChild(document.getElementById('mvuSidebar'));
    document.body.appendChild(document.getElementById('summarySidebar'));
  }

  // Render initial state
  renderTitle();
  renderPhaseBadge();
  renderAllMessages();
  renderMvuSidebar();
  renderQuickReplyBar();
  setupAutoGrow();
  setupScrollDetection();
  setupIOSKeyboardFix();
  updateSendButton();
  syncImageTriggerButton();
  resumeNativeStreamIfNeeded();

  // Restore options from last AI message
  const lastAiMsg = [...conversation.messages].reverse().find(m => m.role === 'assistant');
  if (lastAiMsg) renderOptionsBar(lastAiMsg.content);

  // Restore pendingMvuInit from last AI messages if init phase and not yet confirmed
  if (conversation.phase === 'init' && !conversation.mvu) {
    for (let i = conversation.messages.length - 1; i >= 0; i--) {
      const msg = conversation.messages[i];
      if (msg.role !== 'assistant' || !msg.content) continue;
      const initData = MVU.parseInit(msg.content);
      if (initData) {
        const storySetting = MVU.parseStorySetting(msg.content);
        initData._storySetting = storySetting || '';
        // If this message has no story_setting, scan earlier messages for it
        if (!initData._storySetting) {
          for (let k = i - 1; k >= 0; k--) {
            const earlier = conversation.messages[k];
            if (earlier.role !== 'assistant' || !earlier.content) continue;
            const ss = MVU.parseStorySetting(earlier.content);
            if (ss) { initData._storySetting = ss; break; }
          }
        }
        // Also check subsequent messages for incremental updates
        for (let j = i + 1; j < conversation.messages.length; j++) {
          const later = conversation.messages[j];
          if (later.role !== 'assistant' || !later.content) continue;
          const update = MVU.parseMvuUpdate(later.content);
          if (update) MVU.applyMvuUpdate(initData, update);
          const ss = MVU.parseStorySetting(later.content);
          if (ss) initData._storySetting = ss;
          const patch = MVU.parseStorySettingPatch(later.content);
          if (patch) initData._storySetting = MVU.applyStorySettingPatch(initData._storySetting, patch);
        }
        pendingMvuInit = initData;
        previewMvuInit();
        showMvuInitConfirmation();
        break;
      }
    }
  }

  // In RP phase, open sidebar by default on desktop
  if (conversation.phase === 'rp' && conversation.mvu?.html && window.innerWidth > 768) {
    toggleSidebar();
  }

  // 补合并：网络波动等原因错过自动合并时，打开对话即检查补上（延迟异步，不阻塞加载）
  if (conversation.phase === 'rp') {
    setTimeout(() => { if (!isStreaming) checkBigSummaryTrigger(); }, 2000);
  }

  // Offline detection
  setupOfflineDetection();

  // Focus input
  document.getElementById('inputTextarea').focus();
  log('Chat initialized', { id: conversation.id, phase: conversation.phase, msgCount: conversation.messages.length });
}

let _moreMenuOpen = false;

function toggleMoreMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('moreMenu');
  _moreMenuOpen = !_moreMenuOpen;
  if (_moreMenuOpen) {
    renderMoreMenu();
    // Position below the button
    const btn = document.getElementById('moreMenuBtn');
    const rect = btn.getBoundingClientRect();
    menu.style.top = (rect.bottom + 6) + 'px';
    menu.classList.add('show');
  } else {
    menu.classList.remove('show');
  }
}

function closeMoreMenu() {
  _moreMenuOpen = false;
  document.getElementById('moreMenu')?.classList.remove('show');
}

function renderMoreMenu() {
  const menu = document.getElementById('moreMenu');
  const settings = Storage.getSettings();
  const profiles = Storage.getApiProfiles();
  const profileList = Object.values(profiles);
  const currentApiId = settings.defaultApiProfileId;
  const presets = settings.promptPresets || {};

  const isRp = conversation?.phase === 'rp';

  const icon = (svg) => `<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svg}</svg>`;

  let html = '';

  // --- Tools section ---
  html += `<div class="topbar-menu-item" onclick="closeMoreMenu();openWorldSetting()">
    ${icon('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>')}
    世界设定</div>`;
  const currentStoryline = conversation?.storylineId ? Storage.getStoryline(conversation.storylineId) : null;
  html += `<div class="topbar-menu-item" onclick="closeMoreMenu();openStorylinePicker()">
    ${icon('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>')}
    故事线${currentStoryline ? '：' + Utils.escapeHtml(currentStoryline.name) : '（未归属）'}</div>`;
  html += `<div class="topbar-menu-item" onclick="closeMoreMenu();openPanelEditor()">
    ${icon('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>')}
    起步面板${Panel.isConfigured(conversation) ? '（已设置）' : ''}</div>`;
  html += `<div class="topbar-menu-item" onclick="closeMoreMenu();enterEditMvuMode()">
    ${icon('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>')}
    编辑状态栏</div>`;
  if (isRp) {
    html += `<div class="topbar-menu-item" onclick="closeMoreMenu();restartGame()">
      ${icon('<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>')}
      重新开始</div>`;
  }
  html += `<div class="topbar-menu-item" onclick="closeMoreMenu();showPromptDebug()">
    ${icon('<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>')}
    Prompt Inspector</div>`;

  html += '<div class="topbar-menu-divider"></div>';

  // --- API profiles ---
  html += '<div class="topbar-menu-label">API</div>';
  for (const p of profileList) {
    const active = p.id === currentApiId ? ' active' : '';
    html += `<div class="topbar-menu-item${active}" onclick="switchApi('${Utils.escapeHtml(p.id)}')">
      ${active ? icon('<polyline points="20 6 9 17 4 12"/>') : '<span class="menu-icon"></span>'}
      ${Utils.escapeHtml(p.name || p.id)}</div>`;
  }
  if (profileList.length === 0) {
    html += '<div class="topbar-menu-item" style="color:var(--text-muted);"><span class="menu-icon"></span>未配置</div>';
  }

  html += '<div class="topbar-menu-divider"></div>';

  // --- Presets：本对话级（空 = 跟随全局）---
  html += '<div class="topbar-menu-label">本对话预设</div>';
  const globalPresetName = presets[settings.activePresetId]?.name || '未设置';
  const followActive = !conversation?.presetId ? ' active' : '';
  html += `<div class="topbar-menu-item${followActive}" onclick="switchPreset('')">
    ${followActive ? icon('<polyline points="20 6 9 17 4 12"/>') : '<span class="menu-icon"></span>'}
    跟随全局（${Utils.escapeHtml(globalPresetName)}）</div>`;
  for (const [id, preset] of Object.entries(presets)) {
    const active = id === conversation?.presetId ? ' active' : '';
    html += `<div class="topbar-menu-item${active}" onclick="switchPreset('${Utils.escapeHtml(id)}')">
      ${active ? icon('<polyline points="20 6 9 17 4 12"/>') : '<span class="menu-icon"></span>'}
      ${Utils.escapeHtml(preset.name || id)}</div>`;
  }

  menu.innerHTML = html;
}

function switchApi(profileId) {
  const settings = Storage.getSettings();
  const profile = Storage.getApiProfile(profileId);
  if (!profile) return;

  const newModel = profile.defaultModel || profile.model || '';

  // Save current model to old profile
  const oldId = settings.defaultApiProfileId;
  if (oldId && oldId !== profileId) {
    const oldProfile = Storage.getApiProfile(oldId);
    if (oldProfile && settings.defaultModel) {
      oldProfile.defaultModel = settings.defaultModel;
      Storage.saveApiProfile(oldProfile);
    }
  }

  // Update global settings only
  settings.defaultApiProfileId = profileId;
  settings.defaultModel = newModel;
  Storage.saveSettings(settings);
  closeMoreMenu();
  UI.showToast(`已切换: ${profile.name || profileId}`, 'success');
}

function switchPreset(presetId) {
  const settings = Storage.getSettings();
  const presets = settings.promptPresets || {};
  if (presetId && !presets[presetId]) return;
  // 对话级预设：只影响本对话；空字符串 = 跟随全局预设
  if (!conversation) return;
  conversation.presetId = presetId || '';
  Storage.saveConversation(conversation);
  closeMoreMenu();
  const label = presetId ? (presets[presetId].name || presetId) : '跟随全局';
  UI.showToast(`本对话预设: ${label}`, 'success');
}

// Close menu on outside click
document.addEventListener('click', () => { if (_moreMenuOpen) closeMoreMenu(); });

function openWorldSetting() {
  if (!conversation) return;
  WorldBook.ensureConversation(conversation);
  worldSettingDraft = {
    storySetting: conversation.storySetting || '',
    worldBook: WorldBook.normalizeBook(
      JSON.parse(JSON.stringify(conversation.worldBook || null)),
      (conversation.name || '未命名故事') + ' 世界书'
    ),
  };
  if (!hasWorldBookUid(worldBookSelectedUid) || !worldSettingDraft.worldBook.entries.some(entry => entry.uid === worldBookSelectedUid)) {
    worldBookSelectedUid = worldSettingDraft.worldBook.entries[0]?.uid || null;
  }
  if (!hasWorldBookUid(worldBookExpandedUid) || !worldSettingDraft.worldBook.entries.some(entry => entry.uid === worldBookExpandedUid)) {
    worldBookExpandedUid = worldBookSelectedUid;
  }
  renderWorldSettingModal();
  document.getElementById('worldSettingOverlay').classList.add('visible');
  if (worldSettingTab === 'story') document.getElementById('worldSettingText').focus();
}

function closeWorldSetting() {
  document.getElementById('worldSettingOverlay').classList.remove('visible');
  worldSettingDraft = null;
}

function saveWorldSetting() {
  if (!conversation || !worldSettingDraft) return;
  conversation.storySetting = (worldSettingDraft.storySetting || '').trim();
  conversation.worldBook = WorldBook.normalizeBook(
    worldSettingDraft.worldBook,
    (conversation.name || '未命名故事') + ' 世界书'
  );
  Storage.saveConversation(conversation);
  _lastBuiltPrompt = null;
  closeWorldSetting();
  UI.showToast('世界设定与世界书已保存', 'success');
}

function switchWorldSettingTab(tab) {
  worldSettingTab = tab === 'worldbook' ? 'worldbook' : 'story';
  const storyTab = document.getElementById('worldSettingTabStory');
  const bookTab = document.getElementById('worldSettingTabBook');
  const storyPanel = document.getElementById('worldSettingStoryPanel');
  const bookPanel = document.getElementById('worldSettingBookPanel');
  if (!storyTab || !bookTab || !storyPanel || !bookPanel) return;
  storyTab.classList.toggle('active', worldSettingTab === 'story');
  bookTab.classList.toggle('active', worldSettingTab === 'worldbook');
  storyPanel.classList.toggle('active', worldSettingTab === 'story');
  bookPanel.classList.toggle('active', worldSettingTab === 'worldbook');
}

function onWorldSettingStoryInput(value) {
  if (!worldSettingDraft) return;
  worldSettingDraft.storySetting = value;
}

function renderWorldSettingModal() {
  if (!worldSettingDraft) return;
  document.getElementById('worldSettingText').value = worldSettingDraft.storySetting || '';
  switchWorldSettingTab(worldSettingTab);
  renderWorldBookUI();
}

function getWorldBookDraft() {
  if (!worldSettingDraft) return null;
  worldSettingDraft.worldBook = WorldBook.normalizeBook(
    worldSettingDraft.worldBook,
    (conversation?.name || '未命名故事') + ' 世界书'
  );
  return worldSettingDraft.worldBook;
}

function hasWorldBookUid(uid) {
  return uid !== null && uid !== undefined;
}

function onWorldBookSearch(value) {
  worldBookSearch = value || '';
  renderWorldBookUI();
}

function onWorldBookFilter(value) {
  worldBookFilter = value || 'all';
  renderWorldBookUI();
}

// 胶囊行与 #worldBookFilter 下拉共享同一个 worldBookFilter 状态，
// 这里只负责把选中态同步到胶囊上（下拉已用 .worldbook-filter-native 收起）。
function syncWorldBookFilterChips() {
  const tabs = document.getElementById('worldBookFilterTabs');
  if (!tabs) return;
  tabs.querySelectorAll('.filter-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.filter === worldBookFilter);
  });
}

function renderWorldBookUI() {
  const book = getWorldBookDraft();
  if (!book) return;

  document.getElementById('worldBookName').value = book.name || '';
  document.getElementById('worldBookDescription').value = book.description || '';
  document.getElementById('worldBookMaxEntries').value = book.settings.maxEntries;
  document.getElementById('worldBookMaxChars').value = book.settings.maxChars;
  document.getElementById('worldBookScanDepth').value = book.settings.scanDepth;
  document.getElementById('worldBookMaxRecursionSteps').value = book.settings.maxRecursionSteps;
  document.getElementById('worldBookScanMode').value = book.settings.scanMode || 'recent_chat';
  document.getElementById('worldBookRecursiveScan').checked = !!book.settings.recursiveScan;
  document.getElementById('worldBookIncludeMvuState').checked = !!book.settings.includeMvuState;
  document.getElementById('worldBookIncludeStorySetting').checked = !!book.settings.includeStorySetting;
  document.getElementById('worldBookCaseSensitive').checked = !!book.settings.caseSensitive;
  document.getElementById('worldBookMatchWholeWords').checked = !!book.settings.matchWholeWords;
  document.getElementById('worldBookSearch').value = worldBookSearch;
  document.getElementById('worldBookFilter').value = worldBookFilter;
  syncWorldBookFilterChips();

  const filtered = getFilteredWorldBookEntries(book.entries);
  const filteredIds = new Set(filtered.map(entry => entry.uid));
  if (!hasWorldBookUid(worldBookSelectedUid) || !filteredIds.has(worldBookSelectedUid)) {
    worldBookSelectedUid = filtered[0]?.uid || book.entries[0]?.uid || null;
  }
  if (hasWorldBookUid(worldBookExpandedUid) && !filteredIds.has(worldBookExpandedUid)) {
    worldBookExpandedUid = filtered[0]?.uid || null;
  }

  renderWorldBookStats(book);
  renderWorldBookActivePreview(book);
  renderWorldBookEditor(book, filtered);
}

function getFilteredWorldBookEntries(entries) {
  const keyword = worldBookSearch.trim().toLowerCase();
  return entries.filter(entry => {
    if (worldBookFilter === 'enabled' && !entry.enabled) return false;
    if (worldBookFilter === 'constant' && !entry.constant) return false;
    if (worldBookFilter === 'auto' && (entry.constant || !(entry.keys || []).length)) return false;
    if (worldBookFilter === 'nokey' && (entry.constant || (entry.keys || []).length)) return false;
    if (!keyword) return true;
    const haystack = [
      entry.title,
      entry.comment,
      entry.content,
      entry.group,
      ...(entry.keys || []),
      ...(entry.secondaryKeys || []),
    ].join('\n').toLowerCase();
    return haystack.includes(keyword);
  });
}

function renderWorldBookStats(book) {
  const blocks = WorldBook.buildPromptBlocks({ ...conversation, worldBook: book, storySetting: worldSettingDraft?.storySetting || '' });
  const activeCount = blocks.active.length;
  const stats = [
    { label: '总条目', value: book.entries.length },
    { label: '已启用', value: book.entries.filter(entry => entry.enabled).length },
    { label: '常驻项', value: book.entries.filter(entry => entry.constant).length },
    { label: '自动条目', value: book.entries.filter(entry => entry.enabled && !entry.constant && (entry.keys || []).length).length },
    { label: '候选命中', value: (blocks.candidates || []).length },
    { label: '将注入', value: activeCount },
    { label: '被拦截', value: (blocks.blocked || []).length },
  ];
  document.getElementById('worldBookStats').innerHTML = stats.map(item => `
    <div class="worldbook-stat">
      <div class="worldbook-stat-label">${item.label}</div>
      <div class="worldbook-stat-value">${item.value}</div>
    </div>
  `).join('');
}

function getWorldBookActivationLabel(entry) {
  if (entry._activationMode === 'constant') return '常驻';
  if (entry._activationMode === 'sticky') return '黏滞保留';
  if (entry._matchKind === 'recursive') return '递归命中';
  return '自动命中';
}

function getWorldBookBlockedReason(entry) {
  const reasons = {
    budget: '预算不足',
    maxEntries: '条目上限',
    group: '同组未选中',
    probability: '概率未过',
    cooldown: '冷却中',
    delay: '延迟等待',
  };
  return reasons[entry._blockedReason] || '已拦截';
}

function renderWorldBookActivePreview(book) {
  const container = document.getElementById('worldBookActivePreview');
  if (!container) return;
  const blocks = WorldBook.buildPromptBlocks({ ...conversation, worldBook: book, storySetting: worldSettingDraft?.storySetting || '' });
  const active = blocks.active || [];
  const blocked = blocks.blocked || [];
  const candidates = blocks.candidates || [];
  const scanSources = blocks.scanSources || [];
  const settings = blocks.worldBookSettings || book.settings || {};
  const scanMode = settings.scanMode === 'latest_user' ? '仅本轮输入' : '最近聊天';
  const sourceSummary = scanSources.length
    ? scanSources.map(source => `${source.label || source.kind} ${(source.content || '').length}字`).join(' / ')
    : '无可扫描上下文';
  const blockedPreview = blocked.slice(0, 6).map(entry => {
    const title = entry.comment || entry.title || ('条目 ' + entry.uid);
    const reason = getWorldBookBlockedReason(entry);
    return `<span class="worldbook-tag manual">${Utils.escapeHtml(title)}：${reason}</span>`;
  }).join('');
  if (!active.length) {
    container.innerHTML = `
      <div class="worldbook-card-title">本轮自动命中预览</div>
      <div class="worldbook-card-subtitle">扫描模式：${scanMode}；扫描源：${Utils.escapeHtml(sourceSummary)}。状态栏扫描${settings.includeMvuState ? '已开启，可能导致角色名/地点长期固定命中。' : '已关闭。'}${blocked.length ? ` 有 ${blocked.length} 条命中后被规则或预算拦截。` : ''}</div>
      ${blockedPreview ? `<div class="worldbook-editor-tags" style="margin-bottom:10px;">${blockedPreview}</div>` : ''}
      <div class="worldbook-entry-empty">当前上下文没有命中普通条目。只有常驻条目会固定注入；缺少关键词的普通条目不会自动触发。${blocked.length ? `另有 ${blocked.length} 条被预算或条目上限拦截。` : ''}</div>
    `;
    return;
  }
  container.innerHTML = `
    <div class="worldbook-card-title">本轮自动命中预览</div>
    <div class="worldbook-card-subtitle">扫描模式：${scanMode}；候选 ${candidates.length} 条，实际注入 ${active.length} 条。扫描源：${Utils.escapeHtml(sourceSummary)}。状态栏扫描${settings.includeMvuState ? '已开启，可能造成固定命中。' : '已关闭。'}${blocked.length ? ` 有 ${blocked.length} 条命中后被规则或预算拦截。` : ''}</div>
    ${blockedPreview ? `<div class="worldbook-editor-tags" style="margin-bottom:10px;">${blockedPreview}</div>` : ''}
    <div class="worldbook-editor-list">
      ${active.slice(0, 12).map(entry => {
        const keys = [...(entry._matchedPrimaryKeys || []), ...(entry._matchedSecondaryKeys || [])].slice(0, 6);
        const sources = (entry._matchSources || []).map(source => source.label || source.kind).filter(Boolean).slice(0, 3);
        const extraTags = [
          entry.group ? `组 ${entry.group}` : '',
          entry.sticky ? `黏滞 ${entry.sticky}` : '',
          entry.cooldown ? `冷却 ${entry.cooldown}` : '',
          entry.delay ? `延迟 ${entry.delay}` : '',
        ].filter(Boolean);
        return `
          <div class="worldbook-editor-entry">
            <div class="worldbook-editor-head" style="cursor:default;">
              <div class="worldbook-editor-title-row">
                <div class="worldbook-editor-title-group">
                  <div class="worldbook-editor-title">${Utils.escapeHtml(entry.comment || entry.title || ('条目 ' + entry.uid))}</div>
                  <div class="worldbook-editor-meta">${getWorldBookActivationLabel(entry)} · 预算#${entry._budgetRank || '-'} · ${Utils.escapeHtml(entry.position)} · ${(entry.content || '').length} 字</div>
                </div>
                <div class="worldbook-editor-tags">
                  ${keys.map(key => `<span class="worldbook-tag">${Utils.escapeHtml(key)}</span>`).join('')}
                  ${sources.map(source => `<span class="worldbook-tag manual">${Utils.escapeHtml(source)}</span>`).join('')}
                  ${extraTags.map(tag => `<span class="worldbook-tag">${Utils.escapeHtml(tag)}</span>`).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

    <div class="worldbook-grid">
      <div class="form-group">
        <label>标题 / 备注</label>
        <input type="text" value="${Utils.escapeHtml(entry.comment || entry.title || '')}" onchange="updateWorldBookEntryField('comment', this.value)">

      <div class="form-group">
        <label>排序</label>

      <div class="form-group">

        <textarea style="min-height:74px;" onchange="updateWorldBookEntryListField('keys', this.value)" placeholder="每行一个，或用逗号分隔">${Utils.escapeHtml((entry.keys || []).join('\n'))}</textarea>

        <textarea style="min-height:74px;" onchange="updateWorldBookEntryListField('secondaryKeys', this.value)" placeholder="可选：配合副关键词逻辑使用">${Utils.escapeHtml((entry.secondaryKeys || []).join('\n'))}</textarea>

function renderWorldBookEditor(book, entries) {

    return;
  }
  const expandedUid = hasWorldBookUid(worldBookExpandedUid) && entries.some(entry => entry.uid === worldBookExpandedUid)
    ? worldBookExpandedUid

  container.innerHTML = `
    <div class="worldbook-card-title">条目查看 / 编辑</div>
    <div class="worldbook-card-subtitle">点击条目展开编辑。普通条目靠关键词自动触发；只有常驻条目会每轮固定注入。</div>
    <div class="worldbook-editor-list">
      ${entries.map((entry, index) => {
        const isExpanded = entry.uid === expandedUid;
        const isSelected = entry.uid === worldBookSelectedUid;
        const isConstant = !!entry.constant;
        const tags = [];
        tags.push(`<span class="worldbook-tag">${Utils.escapeHtml(entry.position)}</span>`);
        tags.push(entry.enabled ? '<span class="worldbook-tag">启用</span>' : '<span class="worldbook-tag">停用</span>');
        if (entry.constant) tags.push('<span class="worldbook-tag constant wb-badge-constant">常驻</span>');
        if (!entry.constant && (entry.keys || []).length) tags.push('<span class="worldbook-tag wb-badge-trigger">关键词触发</span>');
        if (!entry.constant && !(entry.keys || []).length) tags.push('<span class="worldbook-tag manual">无关键词</span>');
        const preview = Utils.escapeHtml((entry.content || '').trim() || '暂无正文').replace(/\n/g, '<br>');
        const keyChips = (entry.keys || []).length
          ? `<div class="wb-keywords">${(entry.keys || []).slice(0, 8).map(key => `<span class="wb-key-chip">${Utils.escapeHtml(key)}</span>`).join('')}${(entry.keys || []).length > 8 ? `<span class="wb-key-chip">+${(entry.keys || []).length - 8}</span>` : ''}</div>`
          : '';
        return `
          <div class="worldbook-editor-entry wb-entry-card${isConstant ? ' is-constant' : ''}${isExpanded ? ' expanded' : ''}${isSelected ? ' selected' : ''}">
            <div class="worldbook-editor-head wb-entry-head" onclick="toggleWorldBookEntry(${entry.uid})">
              <div class="worldbook-editor-title-row">
                <div class="worldbook-editor-title-group">
                  <div class="worldbook-editor-title wb-entry-title">${Utils.escapeHtml(entry.comment || entry.title || ('条目 ' + entry.uid))}</div>
                  <div class="worldbook-editor-meta">#${index + 1} · 排序 ${entry.order} · 关键词 ${(entry.keys || []).length} · 正文 ${(entry.content || '').length} 字</div>

                <div class="worldbook-editor-tags">${tags.join('')}</div>
                <div class="worldbook-editor-chevron">▶</div>
              </div>
              <div class="worldbook-editor-preview wb-desc-snippet">${preview}</div>
              ${keyChips}
            </div>
            <div class="worldbook-editor-body${isExpanded ? '' : ' collapsed'}">
              ${isExpanded ? buildWorldBookEntryEditorFields(entry) : ''}
            </div>
          </div>
        `;
      }).join('')}

  `;

function toggleWorldBookEntry(uid) {
  const nextUid = Number(uid);
  worldBookSelectedUid = nextUid;
  worldBookExpandedUid = worldBookExpandedUid === nextUid ? null : nextUid;
  renderWorldBookUI();
}

function updateWorldBookMeta(field, value) {
  const book = getWorldBookDraft();
  if (!book) return;
  book[field] = value;
}

function updateWorldBookSetting(field, value, type = 'text') {
  const book = getWorldBookDraft();
  if (!book) return;
  if (type === 'number') book.settings[field] = Math.max(0, Number(value) || 0);
  else if (type === 'boolean') book.settings[field] = !!value;
  else book.settings[field] = value;
  renderWorldBookUI();
}

function getSelectedWorldBookEntry() {
  const book = getWorldBookDraft();
  if (!book) return null;
  return book.entries.find(entry => entry.uid === worldBookSelectedUid) || null;
}

function updateWorldBookEntryField(field, value, type = 'text') {
  const entry = getSelectedWorldBookEntry();
  if (!entry) return;
  if (type === 'number') entry[field] = Number(value) || 0;
  else if (type === 'nullableNumber') {
    const number = Number(value);
    entry[field] = Number.isFinite(number) && number > 0 ? Math.floor(number) : null;
  }
  else if (type === 'boolean') {
    entry[field] = !!value;
  } else {
    entry[field] = value;
    if (field === 'comment') entry.title = value || entry.title;
  }
  renderWorldBookUI();
}

function updateWorldBookEntryListField(field, value) {
  const entry = getSelectedWorldBookEntry();
  if (!entry) return;
  entry[field] = String(value || '').split(/\r?\n|,/).map(item => item.trim()).filter(Boolean);
  renderWorldBookUI();
}

function addWorldBookEntry() {
  const book = getWorldBookDraft();
  if (!book) return;
  const entry = WorldBook.createEntry();
  book.entries.unshift(entry);
  worldBookSelectedUid = entry.uid;
  worldBookExpandedUid = entry.uid;
  renderWorldBookUI();
}

function duplicateWorldBookEntry() {
  const book = getWorldBookDraft();
  const entry = getSelectedWorldBookEntry();
  if (!book || !entry) return;
  const copy = WorldBook.createEntry({
    ...JSON.parse(JSON.stringify(entry)),
    comment: (entry.comment || entry.title || '条目') + ' (副本)',
  });
  const index = book.entries.findIndex(item => item.uid === entry.uid);
  book.entries.splice(index + 1, 0, copy);
  worldBookSelectedUid = copy.uid;
  worldBookExpandedUid = copy.uid;
  renderWorldBookUI();
}

function deleteWorldBookEntry() {
  const book = getWorldBookDraft();
  const entry = getSelectedWorldBookEntry();
  if (!book || !entry) return;
  UI.showConfirm({
    title: '删除世界书条目',
    message: `确定删除「${Utils.escapeHtml(entry.comment || entry.title || ('条目 ' + entry.uid))}」吗？`,
    onConfirm: () => {
      book.entries = book.entries.filter(item => item.uid !== entry.uid);
      worldBookSelectedUid = book.entries[0]?.uid || null;
      worldBookExpandedUid = worldBookSelectedUid;
      renderWorldBookUI();
    },
  });
}

function deleteCurrentWorldBook() {
  if (!worldSettingDraft || !conversation) return;
  const book = getWorldBookDraft();
  const entryCount = Array.isArray(book.entries) ? book.entries.length : 0;
  UI.showConfirm({
    title: '清空当前世界书',
    message: `确定清空当前世界书的全部 ${entryCount} 条条目吗？`,
    onConfirm: () => {
      worldSettingDraft.worldBook = WorldBook.createEmptyBook((conversation.name || '未命名故事') + ' 世界书');
      worldBookSelectedUid = null;
      worldBookExpandedUid = null;
      renderWorldBookUI();
      UI.showToast('当前世界书已清空，点击保存后正式生效', 'success');
    },
  });
}

function cleanWorldBookConstantEntries() {
  const book = getWorldBookDraft();
  if (!book) return;
  const convertible = book.entries.filter(entry => entry.enabled && entry.constant && (entry.keys || []).length > 0);
  if (!convertible.length) {
    UI.showToast('没有发现带关键词的误常驻条目', 'info');
    return;
  }
  UI.showConfirm({
    title: '清理误常驻条目',
    message: `将 ${convertible.length} 条“有关键词但被设为常驻”的条目改为自动触发。无关键词常驻项会保留。`,
    onConfirm: () => {
      for (const entry of convertible) {
        entry.constant = false;
      }
      renderWorldBookUI();
      UI.showToast(`已转为自动触发：${convertible.length} 条`, 'success');
    },
  });
}

function moveWorldBookEntry(delta) {
  const book = getWorldBookDraft();
  const entry = getSelectedWorldBookEntry();
  if (!book || !entry) return;
  const index = book.entries.findIndex(item => item.uid === entry.uid);
  const target = index + delta;
  if (index < 0 || target < 0 || target >= book.entries.length) return;
  const [item] = book.entries.splice(index, 1);
  book.entries.splice(target, 0, item);
  renderWorldBookUI();
}

function triggerWorldBookImport() {
  document.getElementById('worldBookImportInput').click();
}

function handleWorldBookImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = WorldBook.importAny(JSON.parse(e.target.result));
      if (!worldSettingDraft) return;
      worldSettingDraft.worldBook = imported;
      worldBookSelectedUid = imported.entries[0]?.uid || null;
      worldBookExpandedUid = worldBookSelectedUid;
      renderWorldBookUI();
      UI.showToast(`世界书导入成功，共 ${imported.entries.length} 条`, 'success');
    } catch (err) {
      UI.showToast('世界书文件格式无效: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function exportWorldBook(format) {
  const book = getWorldBookDraft();
  if (!book) return;
  const payload = format === 'tavern' ? WorldBook.exportSillyTavern(book) : WorldBook.exportAirp(book);
  const extName = format === 'tavern' ? 'tavern' : 'airp';
  const baseName = (book.name || 'worldbook').replace(/[\/\\:*?"<>|]/g, '_');
  Utils.downloadFile(
    JSON.stringify(payload, null, 2),
    `${baseName}-${extName}.json`,
    'application/json;charset=utf-8'
  );
  UI.showToast('世界书已导出', 'success');
}
